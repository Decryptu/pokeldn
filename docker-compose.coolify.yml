# pokeldn on Coolify (Docker Compose build pack): Traefik routes to the container, no host port.
# docs/docker.md. Plain `docker compose` users keep docker-compose.yml.
#
# Domain: set it in Coolify's UI for service `pokeldn` as https://pokeldn.example.lan:8550
# (the `:8550` suffix tells Traefik the container port).
services:
  pokeldn:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8550"
    environment:
      # HOST:PORT of the network bridge, e.g. 10.0.1.50:47811. Empty means USB boards only.
      # No ${VAR:+...} here: Coolify's env parser does not handle it reliably.
      POKELDN_BRIDGE: ${POKELDN_BRIDGE}
      TZ: ${TZ:-Europe/Berlin}
      # A folder in the container, e.g. /data/logs: every run's output also goes to a file there. Unredacted.
      POKELDN_RUN_LOG: ${POKELDN_RUN_LOG:-}
    volumes:
      # Settings, bank, received Pokemon, logs. HOME=/data/home in the image, so prod.keys lives at
      # /data/home/.switch/prod.keys: add it as a "File Mount" in Coolify's UI, never commit it.
      - pokeldn-data:/data
    healthcheck:
      # python:3.13-slim has no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8550/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  pokeldn-data:
