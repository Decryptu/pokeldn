plugins {
    id 'com.android.application' version '8.13.0'
    id 'com.chaquo.python' version '17.0.0'
}

android {
    namespace 'org.pokeldn.usbprobe'
    compileSdk 36
    defaultConfig {
        applicationId 'org.pokeldn.usbprobe'
        minSdk 26
        targetSdk 36
        // The release workflow numbers each build: a higher versionCode installs as an update.
        versionCode((System.getenv('POKELDN_ANDROID_VERSION_CODE') ?: '4') as int)
        versionName System.getenv('POKELDN_ANDROID_VERSION_NAME') ?: '0.4-gui'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        debug {
            def existingKey = System.getenv('POKELDN_ANDROID_KEYSTORE')
            if (existingKey) storeFile file(existingKey)
        }
        // The release key (README, Releases); absent, a release build signs with the debug key.
        release {
            def key = System.getenv('POKELDN_ANDROID_RELEASE_KEYSTORE')
            if (key) {
                storeFile file(key)
                storePassword System.getenv('POKELDN_ANDROID_RELEASE_PASSWORD')
                keyAlias 'pokeldn'
                keyPassword System.getenv('POKELDN_ANDROID_RELEASE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            signingConfig System.getenv('POKELDN_ANDROID_RELEASE_KEYSTORE')
                ? signingConfigs.release : signingConfigs.debug
        }
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src/java']
            res.srcDirs = ['res']
            jniLibs.srcDirs = ['jniLibs']
        }
        test {
            java.srcDirs = ['test/java']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

chaquopy {
    defaultConfig {
        version '3.13'
        buildPython(System.getenv('POKELDN_ANDROID_BUILD_PYTHON') ?: 'python3.13')
        extractPackages '*'
        pip {
            // Every package is pinned here: fastapi (pydantic-core) has no Android build, so pip
            // resolves nothing and src/python/fastapi stands in for it (README, The app).
            options '--no-deps'
            install 'trio==0.33.0'
            install 'attrs==26.1.0'
            install 'outcome==1.3.0.post0'
            install 'sortedcontainers==2.4.0'
            install 'sniffio==1.3.1'
            install 'idna==3.20'
            install 'pyserial==3.5'
            install './wheels/python_netlink-0.0.15-py3-none-any.whl'
            install 'pycryptodome==3.21.0'
            install 'zstandard==0.23.0'
            install 'websockets==17.1'
            install 'certifi==2026.7.22'
            install 'pytest==8.4.2'
            install 'iniconfig==2.1.0'
            install 'packaging==25.0'
            install 'pluggy==1.6.0'
            install 'pygments==2.19.2'
            install 'flet==1.0.2'
            install 'flet-web==1.0.2'
            install './wheels/msgpack-1.2.3-py3-none-any.whl'
            install 'repath==0.9.0'
            install 'six==1.17.0'
            install 'oauthlib==4.0.0'
            install 'httpx==0.28.1'
            install 'httpcore==1.0.9'
            install 'anyio==4.15.1'
            install 'typing_extensions==4.16.0'
            install 'starlette==1.7.0'
            install 'uvicorn==0.54.0'
            install 'h11==0.16.0'
            install 'click==8.5.0'
            // esptool: the Board page installs firmware from the phone. Chaquopy builds cryptography
            // 42 and bitarray 3.0, so bitstring stays at 4.3.1 (4.4 needs tibs, which has no build).
            install './wheels/esptool-5.4.0-py3-none-any.whl'
            install './wheels/esp_pylib-1.1.5-py3-none-any.whl'
            install 'bitstring==4.3.1'
            install 'bitarray==3.0.0'
            install 'cryptography==42.0.8'
            install 'cffi==1.17.1'
            install 'pycparser==2.22'
            install 'pyyaml==6.0.3'
            install './wheels/reedsolo-1.7.0-py3-none-any.whl'
            install './wheels/intelhex-2.3.0-py2.py3-none-any.whl'
            install 'rich-click==1.9.9'
            install 'rich==15.0.0'
            install 'markdown-it-py==4.2.0'
            install 'mdurl==0.1.2'
        }
        pyc { src = false }
    }
    sourceSets {
        main { srcDirs = ['src/python', 'staged'] }
    }
}
