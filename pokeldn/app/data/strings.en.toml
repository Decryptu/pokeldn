"core.help.lgpe-online.grace" = "seconds past --seconds to hold a session whose trade is half done"
"core.help.lgpe-online.ignore-clone0-answer" = "test only: ignore the console's first answer to our clone 0 pair, as if lost, so the pair goes again"
"core.help.lgpe-online.ip-host" = "host over ldn_mitm for an emulator instead of the radio (docs/ldn.md)"
"core.help.lgpe-online.lead" = "test only, for bin/lgpe_join.py: act as a console host's player, each step this many seconds after the last. Offer unprompted after the party clones and after each result, vote on the offered clone, announce and vote the commit clone, commit (docs/lgpe_session.md). Never against a console"
