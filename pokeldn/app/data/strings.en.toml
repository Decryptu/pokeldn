"core.help.sv-raid-host.raid-reward" = "a reward row in place of the seed's, in order; up to 45"
"core.help.sv-raid-host.raid-seed" = "host a Tera Raid: the raid seed, eight hex digits; the boss, its Tera type and the rewards follow from it and the four --raid-* context flags"
