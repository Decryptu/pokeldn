"core.help.lgpe-online.drive-delay" = "seconds between the steps the host drives an offered clone through"
"core.help.lgpe-online.first" = "our kind-1 identity message, sent when the console's arrives: a captured 376-byte message, header included, or echo for the console's own back"
"core.help.lgpe-online.first-copies" = "how many kind 1 identities to send, 0.3 s apart under successive steps"
