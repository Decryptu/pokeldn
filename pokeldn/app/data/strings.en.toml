"core.help.sv-raid-host.trade-offer" = "a file holding the 348-byte record this host offers (raw, or hex text; a 352-byte game message is stripped of its header). With it the host answers the console's offer with its own, confirms, and follows the console through the commit and the four exchange steps the way a pair's host does (pokeldn.sv.trade). Repeatable: the second and later records are offered in the same seat, one per trade, as each trade closes"
"core.help.sv-raid-host.trainer-name" = "the player name record 1 of our identity carries, the one the trade screen shows"
"core.help.sv-raid-host.update-delay" = "seconds between the Session join response and the station-list update; a Scarlet host leaves about 1.5 s"
"core.help.sv-raid-host.update-first-seq" = "also send a station list in the same breath as the join response, under this sequence id; an emulated Scarlet host sends one with id 0 there and the second about two seconds later"
"core.help.sv-raid-host.update-seq" = "the sequence id in the station-list update; a Scarlet host sends 1 where its join response sent 0"
"core.help.sv-raid-host.violet" = "advertise Violet's local communication id instead of Scarlet's"
"core.help.sv-raid-join.ack-dest-bits" = "the reliable header's destination bits; 3 adds the four-byte bitmap a retail station sends, 0 leaves the nine-byte header"
"core.help.sv-raid-join.ack-entries" = "entries in the ack payload; a retail station sends four"
"core.help.sv-raid-join.ack-flags" = "the Pia message flags on our bulk acks; 0xa0 is what both retail stations send, and bit 5 compresses the message body"
"core.help.sv-raid-join.ack-highest" = "ack one past the highest id received, with no mask, instead of the contiguous run and a mask as a retail station does (docs/sv.md)"
"core.help.sv-raid-join.ack-period" = "seconds between the periodic bulk acks on every stream the host uses"
"core.help.sv-raid-join.ack-sweep" = "rotate every combination of --ack-flags, --ack-entries and --ack-dest-bits through the seat, one per --ack-sweep-period, and print each as it goes live. One seat then says which shape the guest parses"
"core.help.sv-raid-join.ack-sweep-period" = "seconds each sweep variant stays live"
"core.help.sv-raid-join.announce-timeout" = "end a seat whose console has not announced on 0x80 port 2 this many seconds after the seat, and go back to scanning. A seat can carry every stream to completion and never be announced (docs/sv.md, Unresolved); board seats that traded announced at 5.8 and 7.7 s"
"core.help.sv-raid-join.answer-migration" = "answer the host's type-7 leave-with-host-migration with a type-8 ack, telling it we accept the host role it is handing over"
"core.help.sv-raid-join.bbq-clear" = "the BP, 1 to 9999999, --circle-task bp gives"
"core.help.sv-raid-join.capture" = "write every datagram here as JSON lines"
"core.help.sv-raid-join.circle-task" = "with --union-circle, a task after which our player leaves the circle and the run ends: snacksworth gives the host every Team and solo clear it lacks for all of Snacksworth's legendaries, one a second from the start demo's end; bp a clear paying the host the --bbq-clear BP"
"core.help.sv-raid-join.code" = "join only a console searching with this Link Code; empty takes any"
"core.help.sv-raid-join.comm-id" = "local communication id to join, hex; default is either cartridge's"
"core.help.sv-raid-join.commit-delay" = "seconds after the host's confirmation before the joiner commits; the pair's joiner committed 1.5 s after its own confirmation and its host answered in kind"
"core.help.sv-raid-join.confirm-delay" = "seconds after the host's confirmation before the joiner's own"
"core.help.sv-raid-join.connect-timeout" = "seconds to allow the association itself; a console whose host phase ends mid-connect leaves ldn.connect blocked with no timeout of its own"
"core.help.sv-raid-join.dwell" = "seconds per channel in the scan; the console's hosting window is a few seconds, so a long dwell misses it"
"core.help.sv-raid-join.follow-host" = "with --union-circle: our player copies the host's as it moves, its animations and its ride, keeping 5 m from it and facing it"
"core.help.sv-raid-join.fresh-pid" = "offer each record under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again"
"core.help.sv-raid-join.game-channel" = "announce our own channel table on 0x7c. A station opens the game's channel by sending the same 31-byte table its peer sends on port 1, an open on port 2, and a mirror of every later table update; the peer sends the game on port 0 only once ours is announced (docs/sv.md)"
"core.help.sv-raid-join.hold" = "how long to stay in one joined session before scanning again"
"core.help.sv-raid-join.host-ip" = "--ip-join: the emulator's address"
"core.help.sv-raid-join.ip-join" = "join an emulated console over the LAN through ldn_mitm instead of the radio: no root, no phy, no prod.keys"
"core.help.sv-raid-join.join-delay" = "hold the Session join request this long after the seat. A console whose WaitMember (3 to 4 s) ends unjoined leaves with host migration, so a join accepted in its leave wait draws the type 7 (docs/sv.md, What decides a seat)"
"core.help.sv-raid-join.join-dst-var" = "the packet header's destination variable id on the join request: 0, which is what a joining Arceus uses, or the host's own"
"core.help.sv-raid-join.join-flags" = "message flags on the join request; a joining Arceus sends 0x01, skip the source check, on every repeat of it"
"core.help.sv-raid-join.join-player-id" = "the 16-byte player id in the join request: 'arceus' (1 then 0 as two big-endian u64, what a retail Arceus states), 'random', 'high' (random with a leading 0xff) or 32 hex digits. A Scarlet host's own is 10047bd4a25543e057cee5c71ab1f2a2 (sv18)"
"core.help.sv-raid-join.join-player-name" = "the player name in the join request's one player record; a retail console's is a single space"
"core.help.sv-raid-join.join-repeat" = "with --session-join, re-send it every N seconds (0 sends it once)"
"core.help.sv-raid-join.leave-on-migration" = "end the seat this many seconds after the console asks us to take the host role (Session type 7), and go back to scanning. A console that sent it sent nothing but NetStartHostMigration afterwards in the seats measured; without this the run holds the seat for the whole --hold"
"core.help.sv-raid-join.mac" = "set the adapter's MAC before associating, e.g. 48:f1:eb:11:22:33. Pia derives a station's constant id from its MAC, and the two consoles' are Nintendo OUIs where the adapter's is not. The driver reload in the launcher puts the adapter's own address back"
"core.help.sv-raid-join.mirror-records" = "send every record the host puts on 0x81 port 0 back on port 1 as our own, in order. A retail joiner answers the host's records with a set of its own; this fills that set with records the game itself composed"
"core.help.sv-raid-join.name" = "the LDN node name we publish"
"core.help.sv-raid-join.net-ack" = "answer the host's Net 0x11 with the 0x12 ack. A retail joiner does not, and the ack makes the console ask for host migration instead (sv08)"
"core.help.sv-raid-join.no-ack" = "do not acknowledge reliable streams"
"core.help.sv-raid-join.no-channel-ack" = "do not acknowledge the host's messages on the game's reliable channel 0x7c"
"core.help.sv-raid-join.no-clock" = "do not send the Clone Clock request. A seated joiner sends eighteen zero bytes on 0x77 before anything else and the host answers"
"core.help.sv-raid-join.no-identity" = "send no station identity unless --record-set or --send-on-open names one; by default the recorded one in pokeldn.sv.reference"
"core.help.sv-raid-join.no-rtt" = "do not answer RTT requests"
"core.help.sv-raid-join.no-take-host" = "when the console hands us the host role before the announcement (not a player leaving), leave its network and become the host with bin/sv_host.py on the same channel and code, as bin/pla_join.py does; needs --answer-migration"
"core.help.sv-raid-join.no-update-ack" = "do not answer a Session type-5 station update with the type 6"
"core.help.sv-raid-join.offer-after-open" = "seconds after the host's key-0x80 open at which the joiner offers first, before the host does; without it the joiner answers the host's offer"
"core.help.sv-raid-join.offer-dump" = "write the offered record's 348-byte body to this file as hex and exit, which needs no radio"
"core.help.sv-raid-join.offer-out" = "a file to write the host's own offer to, the 348-byte body of its 80 00 02 00 message, as hex text"
"core.help.sv-raid-join.offer-set" = "a field written into the offered record before it is sealed, by its pokeldn.sv.pokemon name: nickname=SHINY, species=906, ivs=31,31,31,31,31,31, trainer_id=12345, ball=4. Repeatable, and `shiny` alone rolls a personality value shiny against the record's own ids"
"core.help.sv-raid-join.open-delay" = "seconds after the join response (after the seat without --session-join) before the eleven acks and the two stream opens go out; a retail joiner opens 0.75 s after its join"
"core.help.sv-raid-join.our-ip" = "--ip-join: our own address"
"core.help.sv-raid-join.platform" = "the station platform byte we publish; 1 is what a Switch 2 sends"
"core.help.sv-raid-join.port2-now" = "send the game's type-3 join on 0x7c port 2 with the channel table, rather than in answer to the console's type-7 announcement on 0x80 port 2. A pair's joiner answers the announcement (docs/sv.md, Port 2)"
"core.help.sv-raid-join.print-packets" = "print every packet in and out; the --capture file keeps them either way"
"core.help.sv-raid-join.quiet-seat" = "end a seat on which the console has sent nothing at all for this many seconds, and go back to scanning. An association taken outside the console's host phase carries no traffic; without this the run holds it for the whole --hold"
"core.help.sv-raid-join.raid-pokemon" = "join the Tera Raid lobby a console hosts and bring this party record, legal per PKHeX; our player readies, answers the start and leaves when the battle begins, its Pokemon fighting on for the console"
"core.help.sv-raid-join.raid-ready-delay" = "seconds in the raid lobby before our player readies"
"core.help.sv-raid-join.record-delay" = "seconds after the seat before the first identity record goes out"
"core.help.sv-raid-join.record-set" = "send this directory's records as our own on 0x81 port 1, in sequence order, in place of --mirror-records. `scratchpad/sv_extract_records.py` writes one from a station's own log, so a whole real identity can be replayed rather than the host's mirrored back; by default the recorded set in pokeldn.sv.reference"
"core.help.sv-raid-join.repeat-ack-gap" = "acknowledge a record already held at most once per SECONDS per stream; a new record is acked at once. 0 acks every repeat (docs/sv.md)"
"core.help.sv-raid-join.rtt-delay" = "answer each RTT request SECONDS late; RTT samples enable the host's retransmission timer (docs/sv.md)"
"core.help.sv-raid-join.rtt-period" = "seconds between our own RTT requests (0 sends none)"
"core.help.sv-raid-join.scan-only" = "report what the console advertises and join nothing"
"core.help.sv-raid-join.scan-timeout" = "--ip-join: seconds to wait for one ldn_mitm scan answer"
"core.help.sv-raid-join.scene-id" = "join only a network of this LDN scene: 4 a Link Trade, 7 a Tera Raid"
"core.help.sv-raid-join.seconds" = "how long to keep trying"
"core.help.sv-raid-join.send-on-open" = "DELAY:PROTO:PORT:HEX[:z][:start|:end], sent that many seconds after the host announces key 0x80 open on 0x7c port 1. A station's identity is four messages on 0x7c port 0, the two fragments twice, and nothing sent on that port before the announcement reaches the game; repeatable; by default the identity fragments in pokeldn.sv.reference"
"core.help.sv-raid-join.send-record" = "after the seat, send this 1395-byte identity record on 0x81 port 1 (our station stream) as the game's data exchange, retransmitting until the host acknowledges it. A retail joiner sends its own identity here"
"core.help.sv-raid-join.session-join" = "send the Pia Session join request in the retail layout (docs/sv.md, The Session join request): ten protocols with their versions, a four-byte nonce, both location ids, a seven-byte station address and one player record. A mesh join is unicast, so no passive capture shows a retail one"
"core.help.sv-raid-join.spawn" = "with --union-circle: 10 s after the circle's start demo has ended, keep 3 wild Pokemon of this species (dev number) out 15 to 25 m from the host's player, as a console shares its own: one the host battles, removes or goes more than 50 m from comes again near it"
"core.help.sv-raid-join.spawn-ability" = "ability slot, 2 the hidden ability (default 0 or 1 at random, as a wild one's)"
"core.help.sv-raid-join.spawn-gender" = "1 female (default 0)"
"core.help.sv-raid-join.spawn-item" = "held item id"
"core.help.sv-raid-join.spawn-ivs" = "six IVs 0 to 31 (default each random, as a wild one's)"
"core.help.sv-raid-join.spawn-legal" = "with --spawn: spawn only while the host stands in an area where PKHeX accepts that spawn caught, found from the wild Pokemon the host's console shares (it shares them once our player is near: --follow-host)"
"core.help.sv-raid-join.spawn-nature" = "0 to 24 (default random)"
"core.help.sv-raid-join.spawn-scale" = "0 to 255 (default random)"
"core.help.sv-raid-join.spawn-tera" = "Tera Type, 0 Normal to 17 Fairy in type order (default %(default)s)"
"core.help.sv-raid-join.stay-on-host-migration" = "hold the seat after the console's NetStartHostMigration (Net 0x40). By default the joiner leaves on the first one: the console is destroying its network and resends it until every client has left, for up to 4 s"
"core.help.sv-raid-join.trade-offer" = "a file holding the 348-byte record this joiner offers (raw, or hex text; a 352-byte game message is stripped of its header). With it the joiner answers the host's offer with its own, confirms, commits, and echoes the four exchange steps the way a pair's joiner does (pokeldn.sv.trade). Repeatable: the second and later records are offered in the same seat, one per trade, as each trade closes"
"core.help.sv-raid-join.trainer-name" = "the player name record 1 of our identity carries, the one the trade screen shows"
"core.help.sv-raid-join.unicast" = "send to the host's address instead of the LDN broadcast address. Both retail stations broadcast every Pia packet (sv11), and a broadcast needs no ARP resolution of the peer"
"core.help.sv-raid-join.union-circle" = "join the Union Circle a console hosts, as a raid guest joins a raid: take the seat, send our identity, open the game's channel, answer the host's start, put our player on the field where the host's stands and hold it for --hold (docs/sv_union_circle.md)"
"core.help.sv-raid-join.verbose-circle" = "with --union-circle: print each circle message we send and each step of the area search too; the --capture file keeps the steps either way"
"core.help.sv-raid-join.verbose-rtt" = "print the RTT traffic too"
"core.help.swsh-gift.dump" = "write the record and its fragments here and exit"
"core.help.swsh-gift.dwell" = "seconds each fragment stays on the air"
"core.help.swsh-gift.export-gift" = "save a .pokegift file and exit without using the radio"
"core.help.swsh-gift.gift-file" = "a .pokegift or 720-byte .wc8 record to send instead of building one"
"core.help.swsh-gift.keys" = "prod.keys; default from config/host.toml"
"core.help.swsh-gift.level" = "0 makes the game roll one"
"core.help.swsh-gift.nickname-host" = "the network's own name"
"core.help.swsh-gift.patch" = "bytes written over the record at OFFSET before sealing, for the fields no name covers (0x15=0b for the title index); repeatable"
"core.help.swsh-gift.phy" = "the phy renumbers on every driver reload"
"core.help.swsh-gift.protocol" = "LDN advertisement protocol version"
"core.help.swsh-gift.ribbon" = "a ribbon index; repeatable"
"core.help.swsh-gift.set" = "any other record field by name: shiny_type=3, ball=1, held_item=236, gender=1, nature=10, ability_type=2, iv_hp=31, dynamax_level=10, gigantamax=1, tid=12345, sid=54321 ..."
"core.help.swsh-host.accept-first" = "accept without waiting for the joiner's acceptance, as a player would; for our own joiner, which accepts after its partner"
"core.help.swsh-host.advert" = "optional Sword advertisement (hex, raw, or swsh_net_facts.json); without one, build a fresh station record"
"core.help.swsh-host.card-set" = "set a field of the League Card the console may keep after the trade (pokeldn.swsh.league_card: name, trainer_id, dex_owned, poke1_species, ...)"
"core.help.swsh-host.code" = "the Link Code the player searches with, e.g. 12345678; none by default"
"core.help.swsh-host.end-delay" = "with --migrate, ladder done to box command 3 and the migration"
"core.help.swsh-host.fresh-pid" = "draw a new encryption constant and PID for the offered Pokemon"
"core.help.swsh-host.ip-host" = "host over ldn_mitm on the LAN for an emulator; no radio and no root"
"core.help.swsh-host.lair-leave" = "leave this long after the legendary is sent; a computer partner then takes our seat and picks our rental"
"core.help.swsh-host.lair-legendary" = "host a Dynamax Adventure (Max Lair) lobby whose legendary is this species; the host leaves once the adventure starts (docs/swsh_raid.md)"
"core.help.swsh-host.lair-seed" = "the adventure seed (ChikaBattleSeed): the rentals and encounters; random by default"
"core.help.swsh-host.lead" = "test only, for bin/swsh_connect.py: act as a console host's player: after a trade with another --offer-file queued, offer it from the box this many seconds after the ladder, without waiting for the joiner's offer"
"core.help.swsh-host.migrate" = "end with box command 3 and MIGRATION_START, as the retail Sword that led our joiner did; by default the host keeps the session"
"core.help.swsh-host.network-id" = "advertise 0x00, hex; a searching Sword joins only a larger one than its own; default 0xFFFF and two random bytes"
"core.help.swsh-host.offer-file" = "a PK8 to place in the offered party slot, encrypted or PKHeX export. Repeatable, one per trade: the player trades again from the box, or searches again; the last serves every later trade"
"core.help.swsh-host.offer-slot" = "the party slot we offer"
"core.help.swsh-host.online" = "trade with a player far away: their console's offer is offered here, and each side confirms only once both consoles have (docs/online.md)"
"core.help.swsh-host.online-code" = "the room both players enter; default the link code, and no code meets anyone else trading online without one"
"core.help.swsh-host.our-ip" = "with --ip-host, the address to advertise"
"core.help.swsh-host.raid-area" = "with --raid-event: the den area whose table the boss comes from"
"core.help.swsh-host.raid-boss" = "host a Max Raid den lobby with this boss instead of a Link Trade (docs/swsh_raid.md)"
"core.help.swsh-host.raid-console-serves" = "put the console first in BattleStart and framework object 0, so it serves the battle and the board answers as a client (docs/swsh_raid.md)"
"core.help.swsh-host.raid-event" = "host a Max Raid with a boss of this Wild Area Event delivery (an EventsGallery 'Index NNN' folder) instead of --raid-boss; its rewards unless --raid-reward (docs/swsh_raid.md, Event raids)"
"core.help.swsh-host.raid-event-boss" = "with --raid-event: the boss, numbered as the list printed without it"
"core.help.swsh-host.raid-event-drops" = "with --raid-event: roll each drop's chance as a den does, or give every drop"
"core.help.swsh-host.raid-gigantamax" = "the --raid-boss boss is Gigantamax; a retail console accepts it where a base den holds that Gigantamax Pokemon (docs/swsh_raid.md)"
"core.help.swsh-host.raid-ready" = "our player readies this long after the guest's lobby opens"
"core.help.swsh-host.raid-reward" = "a reward row, item id and count; up to 15; none gives an emulated den's rows"
"core.help.swsh-host.raid-seed" = "the BattleSeed value; random by default"
"core.help.swsh-host.raid-stars" = "with --raid-event: the star rank, 1 to 5"
"core.help.swsh-host.raid-version" = "with --raid-event: whose table the boss comes from; the advertisement's version by default"
"core.help.swsh-host.received" = "write the joiner's Pokemon here; trade N > 1 writes FILE-N"
"core.help.swsh-host.snapshot" = "optional saved Sword 0x84 snapshot; otherwise use the joining console's snapshot from this session"
"core.help.swsh-join.abort-on-stall" = "once the confirmation ladder has produced its first step, end the run as soon as SECONDS pass with no NEW step body: stop transmitting, drop the link and let the console report a lost connection. Holding a stalled ladder open with acks instead makes the game declare the TRADE failed, which costs the player about an hour. Nothing but acks follows the last step body. 0 is off and the hold runs in full."
"core.help.swsh-join.ack-lowest-pending" = "the header's own 'lowest sequence pending ack'. We have sent nothing on this protocol, so 1 (the next id we would use) and 0 are both readings; the console itself sends 1 while waiting on its own first message"
"core.help.swsh-join.ack-reliable" = "acknowledge the 0x7C reliable window. The pass signal is the retransmits STOPPING and the sequence ids moving on"
"core.help.swsh-join.ack-seconds" = "per reading"
"core.help.swsh-join.ack-slots" = "which of the 32 ack slots to fill; \"all\" (the default) fills every one, because only the slot at some station index is read and whose index it is has not been settled. \"0\" is the console, \"1\" is us"
"core.help.swsh-join.ack-snapshot" = "ACK the console's 0x84 fragments (kind 0x21, a contiguous base and a bitmask). Nothing here has ever acked this protocol, which is why the console retransmits one snapshot 19142 times and never moves on"
"core.help.swsh-join.answer-migration" = "answer the console's MIGRATION_START on 0x18 port 1 with a MIGRATION_RESPONSE. `440001` arrives there only when the player accepts, and the console goes silent on every window afterwards: the last thing it asks for is two bytes of mesh, not application data"
"core.help.swsh-join.answer-once" = "answer each payload the console sends ONCE instead of re-deriving an answer to its last payload every period. `said` never clears, so without this an offer goes out hundreds of times. The console sends each of its own messages once"
"core.help.swsh-join.answer-rtt" = "answer the console's 0x58 RTT requests. Sixteen bytes at version 4, and the reply echoes the seven bytes nothing has read yet"
"core.help.swsh-join.box-commands" = "after our offer is acknowledged, send boxSyncStateCommand{{data:N}} on the trade holder for each N in turn, one per acknowledged sequence. 20030 is a BoxSyncStateDataHolder and its field 2 is a command enum; this project 1 offers and 2 withdraws; 4 confirms and 5 withdraws the confirmation"
"core.help.swsh-join.box-on-accept" = "send these box commands the moment MIGRATION_START arrives - the only signal that says the player pressed accept. The console keeps acking for about five seconds after it"
"core.help.swsh-join.box-open" = "send these box commands as soon as the console acks our 0x84 snapshot - BEFORE either side offers a Pokemon. The game sends command 3 exactly once, on the first frame after its trade session is built and only when the role bit at session+0x419 is clear (0x010c9bb0), so one of the two sides owes the other an opener before anything else happens. Sent after both offers instead, the console leaves while the player is still picking"
"core.help.swsh-join.box-period" = "seconds between the queued post-offer payloads. Spread them so the sweep spans the accept: the console tears down on the accept, not on a timer, so commands sent inside a couple of seconds all land before it"
"core.help.swsh-join.comm-id" = "hex; defaults to Sword's 0x0100abf008968000"
"core.help.swsh-join.confirm-command" = "when the CONFIRMATION envelope (40040) sends a four-byte status whose body ends `0100` - the same cue the selection content sends before its Pokemon - reply with SyncSaveDataHolder{{syncCommand{{data:N}}}} on that content's 10000-base holder, id 10040, reliable port 0, and answer the status itself on port 1. Content 40 takes a command and not a Pokemon: its parser 0x010df6d0 accepts one submessage carrying one int32. Its own machine sends 0, 1, 2 and 3 in that order (swsh_trade.SYNC_COMMANDS)"
"core.help.swsh-join.confirm-commands" = "the handshake form of --confirm-command: send the NEXT of these on each new four-byte body the confirmation content puts on elementId 20000. Content 40's own machine sends 0,1,2,3 and parks after each; one command buys two rungs and then the ladder stops"
"core.help.swsh-join.confirm-final-delta" = "after the CONFIRMATION content answers our syncCommand with a hash, re-arm the 40040 pair and send BOTH members again at this clock delta - the move --selection-final-delta makes on 40050, which carries the selection phase past its own hash"
"core.help.swsh-join.confirm-phase" = "answer the confirmation content's four-byte steps with phase N in the LOW u16 instead of echoing the console's own. The console reads its phase out of exactly those bytes (`0x006d6490` stores them, `0x006d3260` reads them), and every step this project has sent so far echoed the value back unchanged"
"core.help.swsh-join.connect" = "after the ack, sweep the version-4 connection request on protocol 0x14"
"core.help.swsh-join.connect-station" = "values for the header byte at 0x05 on the requests, and their IV source id; list or LO-HI"
"core.help.swsh-join.data-destination" = "the station BITMAP on 0x58 and 0x7C. The console sends 2 to us, station index 1; 1 is the bit for station 0, which is the console"
"core.help.swsh-join.fresh-pid" = "draw a new encryption constant and PID for every offered Pokemon"
"core.help.swsh-join.grace" = "seconds past --hold to keep a session whose trade is under way: the console has offered and the ladder has not finished"
"core.help.swsh-join.host-ip" = "--ip-join: the console's address"
"core.help.swsh-join.ip-join" = "join an emulated console hosting over ldn_mitm on the LAN; no radio, no root, no keys. Each of --scans waits --dwell seconds for an answer"
"core.help.swsh-join.join" = "after the station handshake closes, send the Mesh Protocol (0x18) join request and ack whatever comes back"
"core.help.swsh-join.join-ack-id" = "fixed ack id for the join request; random when omitted"
"core.help.swsh-join.join-gap" = "Pia retransmits an unacknowledged join request every 500 ms"
"core.help.swsh-join.join-port" = "the Pia port the join travels on; the update mesh uses the reliable one"
"core.help.swsh-join.join-seconds" = "how long to retransmit the join request; Pia's own joiner gives up at 10"
"core.help.swsh-join.join-station-index" = "byte [1]. 0xFD is what 0x017c1700 compares against; anything else is the instrument that says the handler was reached"
"core.help.swsh-join.join-wait" = "how long to wait for the station acceptance before giving up on joining"
"core.help.swsh-join.lair-join" = "a Dynamax Adventure (Max Lair) guest: the lobby, the paths and the battles; use with --scene 50000"
"core.help.swsh-join.lair-rental" = "an encrypted party PK8 sent as our rental instead of the offered one"
"core.help.swsh-join.lair-rental-choice" = "the offer place we take; by default the first the host left"
"core.help.swsh-join.leave-with-host" = "when the hosting console leaves, ack its update session carrying the host-migration state and leave the network on its START_HOST_MIGRATION, as its own clients do; each step waits 10 s unanswered"
"core.help.swsh-join.listen-first" = "seconds of listening before the first packet out, so the capture holds the console's own rate to compare against"
"core.help.swsh-join.migration-answer" = "what to send when the console migrates the mesh. \"auto\" sends MIGRATION_FINISH when the start names US as the next host and a MIGRATION_RESPONSE when it names anyone else, which is what the binary says. \"response\" always answers 0x48, for comparison"
"core.help.swsh-join.migration-period" = "how often to retransmit the migration response until it is acked"
"core.help.swsh-join.nat-flags" = "values for byte [1], list or LO-HI"
"core.help.swsh-join.nat-location" = "values for byte [0x10]"
"core.help.swsh-join.no-variable-id" = "clear [3], which makes the console skip the variable-id comparison"
"core.help.swsh-join.offer-ability" = "the ability id of the built record; --offer-species leaves the template's ability where it was"
"core.help.swsh-join.offer-echo" = "offer back the exact PK8 the console just offered us, unchanged, instead of one out of --send-snapshot. These bytes came out of its own save, so a run that still aborts rules the record out"
"core.help.swsh-join.offer-experience" = "the experience word at 0x10 of the built record"
"core.help.swsh-join.offer-file" = "a .pk8 to put in --offer-slot in place of the snapshot's record: stored or party form, encrypted or PKHeX's decrypted export. Its OT name and ids become the snapshot's unless --offer-file-as-is. Repeatable, one per trade on the session: the console's player picks again from the box; the last serves every later trade"
"core.help.swsh-join.offer-file-as-is" = "keep the file's own OT name and trainer ids"
"core.help.swsh-join.offer-ivs" = "six IVs, comma-separated, in PKHeX's HP,ATK,DEF,SPE,SPA,SPD order"
"core.help.swsh-join.offer-level" = "the level byte at 0x148 of the built record, 1..100; the experience word is left alone unless --offer-experience is given"
"core.help.swsh-join.offer-moves" = "four move ids, comma-separated; 0 empties a slot. PP is left as the template had it"
"core.help.swsh-join.offer-nickname" = "the nickname of the built record; sets the nicknamed flag"
"core.help.swsh-join.offer-on-50" = "put our PK8 in field 5 of the 40050 pair's second member. Content 50 is PokemonTradeDataHolder, the transfer; content 30 is the box exchange. A 344-byte PK8 rides that field"
"core.help.swsh-join.offer-ot" = "the original trainer name of the built record"
"core.help.swsh-join.offer-slot" = "which party slot of --send-snapshot to offer back, 1-6; 0 offers nothing and only records what the console offers us"
"core.help.swsh-join.offer-species" = "build the record in --offer-slot instead of sending it as it came: this national dex number, in the party record the snapshot advertises AND in the offer, so the two still tell one story"
"core.help.swsh-join.open-after-hash" = "once a hash body has been answered, `ping` content N's 10000-base holder on port 0 to open the next phase - 40 is the confirmation, so this sends `382700000a00`. The console stops sending 40050 once the hash answer lands and says nothing further; Pia retransmits anything it still waits on, so that silence means satisfied and the next phase needs opening"
"core.help.swsh-join.open-content" = "after our offer is acknowledged, send `ping` on content N's 10000-base holder for each N - `382700000a00` for 40, which is exactly the opener nxldn-lab's client sends to start the confirmation phase, rebuilt here from our own content registry rather than copied"
"core.help.swsh-join.open-content-offer" = "make --open-content send our PK8 on the 10000-base holder instead of an empty `ping`. The ping opens content 50 and is taken as our Pokemon: the console reaches the confirmation phase and asks the player to trade theirs for an egg. Same moment, same holder, a Pokemon in it"
"core.help.swsh-join.open-early" = "`ping` content N's 10000-base holder at the 0x84 snapshot ack, before either side offers. The console's box send is gated on a ready bool at content+0x4c that only `0x010ce040` sets, on a zero result code; until then every command the game tries to send is parked in content+0x48. A parked command that does not match the next one sets the error byte +0x4d, and `0x010c9bb0` turns that into trade state 9: abort, with nothing on the application layer"
"core.help.swsh-join.our-ip" = "--ip-join: our own address on that LAN"
"core.help.swsh-join.pair-after-hash" = "once a hash body has been answered, open content N's phase by sending the two-member RPC pair for it (40 is the confirmation). A pair is the only shape that opens a phase on this console: 40030 opened the offer and 40050 the selection. A bare content ping (`382700000a00`) and a bare sync-120 ping (`780000000a00`) are both ignored"
"core.help.swsh-join.preset" = "the tested flag set: 'capture' records the console's party snapshot, 'trade' needs --send-snapshot"
"core.help.swsh-join.quiet-for" = "seconds without an update session that count as the rebroadcast stopping - the console sends ten a second, so this is fifteen missed"
"core.help.swsh-join.raid-join" = "a Max Raid den guest: after the snapshot send PlayerInfo, BattleReady and SelectPokemon (the --offer-slot Pokemon); use with --scene 60006"
"core.help.swsh-join.raid-move" = "the move slot our Pokemon uses every turn"
"core.help.swsh-join.raid-name" = "the name the raid lobby shows for us"
"core.help.swsh-join.raid-ready" = "press ready this many seconds after the host acked the lobby messages"
"core.help.swsh-join.request-broadcast" = "send them to the broadcast address instead"
"core.help.swsh-join.request-flags" = "values for the MESSAGE flags byte. 0x09 is what the console puts on its own Local Protocol messages; BDSP's station requests carry 0x11"
"core.help.swsh-join.request-gap" = "seconds between requests; the console answered BDSP's in 40 ms"
"core.help.swsh-join.request-platform" = "values for the platform byte at [2]. 9 is the real one; ANY other value is answered with a connection response rather than dropped, which is the probe for whether our message reaches the 0x14 handler at all"
"core.help.swsh-join.request-unicast" = "send the requests to the console rather than the broadcast address"
"core.help.swsh-join.respond" = "answer a connection request the CONSOLE sends us with a connection response"
"core.help.swsh-join.respond-result" = "0 is accepted"
"core.help.swsh-join.respond-with" = "whose constant and variable id go in the response's two id fields - a deduction, so 'both' alternates them across the retransmits"
"core.help.swsh-join.rpc-bodies" = "answer every DISTINCT (envelope, base, field-5 body) in the 40000 band once, on top of the opening pair. The clock advances on every message so the payload cannot be the key, but the body can: `00000000` and `000018fc` are the openers and anything else is new. A per-envelope guard stops answering at the hash body and stalls there"
"core.help.swsh-join.rpc-clock-delta" = "how far to advance a trade RPC's clock in our answer. 5 is nxldn-lab's and is the one number in this path nothing here has measured"
"core.help.swsh-join.rpc-pair" = "answer the console's 40030 RPC as the PAIR it is: collect both members one per base, 10000 then 20000, keyed on the BASE FIELD. `payload[5] in (0x19, 0x1A)` is the inner length and moves with the sender's station-id varint (0x1A/0x1B on some consoles). Send both once in that order and nothing more on this window; `said_by_port` keeps only the last payload, so a mirror sends one member repeatedly and never the other"
"core.help.swsh-join.rpc-pair-advance" = "after answering an RPC pair, send BOTH members again with the clock advanced by this much. The console advances its own pair's clock by 2 each burst (b41c, b61c, b81c). A repeated clock is a repeated state, so an answer that carries one clock never moves ours. 0 is off"
"core.help.swsh-join.rpc-port-answers" = "answer the trade RPC on its OWN Pia port with its own reliable window. The console sends them on 0x7C port 1; an answer on port 0 lands on a window it does not read them on"
"core.help.swsh-join.save-offer" = "write the PK8 we will offer to this file, before the radio is touched"
"core.help.swsh-join.save-offered" = "write the PK8 the console offers to this file; trade N > 1 writes FILE-N"
"core.help.swsh-join.scan-ip" = "--ip-join: the address a scan leaves from; default --our-ip"
"core.help.swsh-join.scans" = "scans for a matching search (--scene) before giving up"
"core.help.swsh-join.scene" = "the LDN scene id to seat in: 60001 a Link Trade search; any takes the first Sword network (a Max Raid den, docs/swsh_gift.md)"
"core.help.swsh-join.selection-final-delta" = "after the selection HASH is answered, send the 40050 pair AGAIN - both members - at this clock delta. nxldn-lab's `selection_final_delta` is 9 (nxldn-lab's `selection_final_delta`). --rpc-pair latches per envelope, so the second pair needs the latch cleared. 0 is off"
"core.help.swsh-join.selection-offer" = "when the console follows its selection-phase Pokemon with the status whose body ends `0100`, offer OUR Pokemon on that content's 10000-base holder (id 10050) on reliable port 0 and answer the status on port 1"
"core.help.swsh-join.selection-offer-data" = "with --selection-offer, answer the console's selection status with our PK8 in field 5 (`body`) of a 40050 Data carrying OUR ownerId, on the RPC port, instead of a PokemonTradeDataHolder on 10050 port 0. Content 50's receive handler resolves the sender to a station index and drops silently when it cannot; the holder shape carries no owner"
"core.help.swsh-join.selection-offer-high" = "with --selection-offer, answer the selection status with our PK8 as a PokemonTradeDataHolder on the 20000-base holder (id 20050), which is where the BOX phase's own Pokemon rides one content over. Overrides --selection-offer-mirror and --selection-offer-data"
"core.help.swsh-join.selection-offer-mirror" = "with --selection-offer, answer the selection status with our PK8 in a 40050 carrying the console's OWN field set - syncId, clock, body, and neither elementId nor ownerId, which is how its own selection offer decodes. Overrides --selection-offer-data"
"core.help.swsh-join.selection-offer-sweep" = "send our PK8 as a Data on elementId 10000 and as a holder on the 30000-base id (30050), which every content registers. More than one variable at once"
"core.help.swsh-join.selection-start" = "send our own 40050 pair the moment the console says id 130 pingSynced, before its own selection burst. nxldn-lab's client opens the selection phase this way and nothing here has ever opened one; the console sends 820000001a00 in our own captures 0.3 s before its 40050 burst"
"core.help.swsh-join.send-after" = "seconds after acceptance before the first data message, so the mesh join and the RTT exchange are already running when it lands"
"core.help.swsh-join.send-count" = "how many sequence ids of ours to send in all; 0 has no limit. One message does not hold the console's state; it sends its own heartbeat about 580 times in 180 s"
"core.help.swsh-join.send-data" = "send APPLICATION DATA once the mesh is up - the first of the project. The payload as hex; \"610000000a00\" is the six bytes the console repeats at us on 0x7C. Nothing is sent without this flag"
"core.help.swsh-join.send-destinations" = "the header's destination list. \"console\" names its station constant id, which is what its own broadcast acks do to us; \"none\" sends count 0, which 0x01859578 never filters and every 0x7C message carries. \"auto\" mirrors the console per protocol: none on 0x7C, the console on 0x80"
"core.help.swsh-join.send-mirror" = "send back whatever the console last said on this protocol, rather than the fixed --send-data. --send-data is still the first payload, before the console has said anything"
"core.help.swsh-join.send-period" = "the retransmit interval. A window retransmits until it is acked"
"core.help.swsh-join.send-port" = "the Pia message port. The console sends its 0x80 acks on 0 AND 1, each packet carrying both; \"0,1\" mirrors that"
"core.help.swsh-join.send-protocol" = "0x80 (the broadcast reliable window, the default: it asks us for sequence 1 once a second) or 0x7c (the unicast one, which has never had an ack to send us because it has never had our data)"
"core.help.swsh-join.send-seconds" = "how long to keep retransmitting if nothing acknowledges it; 0 sends until the run ends"
"core.help.swsh-join.send-selection" = "WHEN to open the selection phase with a 40050 pair on 0x7c port 1. \"offer\" sends it as soon as our offer is acknowledged, the only window the console is still reading in; \"migration\" sends it on the migration start, after the console has stopped. The pair is the same envelope as the console's own 40030 at offset 50 with our station id; the builder reproduces its 40030 pair byte for byte"
"core.help.swsh-join.send-sequence" = "the sequence id. 1 is what both windows ask for; the first message also carries FLAG_IS_INITIALIZED and DEFINES where the stream starts"
"core.help.swsh-join.send-snapshot" = "a 3456-byte trade snapshot to send back on 0x84 once the console sends its own, or live (the default under --preset trade) for the console's own from this session. A short 2965-byte payload is inflated first. The identity is rewritten by --snapshot-name/-tid/-sid"
"core.help.swsh-join.send-stream" = "the stream id. 0 is what the console sends on both protocols"
"core.help.swsh-join.send-wait" = "how long to wait for the station handshake before giving up on sending"
"core.help.swsh-join.send-zlib" = "compress the message, the way the console compresses every 0x80 message it sends. The flag is the Pia message's (0x10 at version 4), so this is free either way - and it is one variable, so sweep it alone"
"core.help.swsh-join.send2-data" = "a SECOND stream, on --send2-protocol, sent once the console says --send2-trigger. `60ea000012020801` is BlockDataHolder{{imReady:true}}, which the console says on 0x80 and waits on"
"core.help.swsh-join.send2-trigger" = "wait for this payload on --send2-protocol before sending; omit to send as soon as the mesh is up"
"core.help.swsh-join.seq-delta" = "THE CONTROL. Ack a sequence id the console never sent: a rebroadcast that carries on under --seq-delta 1 is what attributes a stop under 0 to the ack's CONTENT rather than to our merely having transmitted"
"core.help.swsh-join.snapshot-account" = "replace the three ids at the front of the snapshot's profile (pseudo device id, account Uid, network service account id). They are the console's own, handed back unchanged otherwise"
"core.help.swsh-join.snapshot-period" = "between our own fragments"
"core.help.swsh-join.snapshot-port" = "Pia port(s) for our 0x84 messages; the console sends on 0"
"core.help.swsh-join.snapshot-repeat" = "between whole re-sends; the console retransmits its own until acked"
"core.help.swsh-join.src-var" = "our own station variable id; fresh random when omitted, because a reused one is 'already one of my stations' on BDSP"
"core.help.swsh-join.station-sweep" = "readings of the header byte at 0x05, in order; the IV's source id follows each one"
"core.help.swsh-join.sync-after-hash" = "once a hash body has been answered, send `ping` on sync holder N (120 is the confirmation's) on port 0. The console drives 97, 60000, 110 and 130 itself and opens the selection phase when 130's pingSynced lands; it never sends 120. A phase follows its sync, not a content ping"
"core.help.swsh-join.sync-after-offer" = "queue a sync on holder N right behind our selection offer, in the branch that actually runs when --selection-offer is on. --sync-after-hash cannot fire there: this one can"
"core.help.swsh-join.sync-answers" = "answer with `pokeldn.swsh.trade.SYNC_ANSWERS` instead of echoing one payload: the ping, and the three other sync holders the console is expected to raise after the trade snapshot. A payload with no rule is REPORTED and left unanswered - that report is the point of the run"
"core.help.swsh-join.sync-field" = "which SyncPingDataHolder field --sync-after-hash sends: 1 ping, 2 pingReply, 3 pingSynced (`780000001a00`, the one the trace records)"
"core.help.swsh-join.trade-ready" = "after our offer is acknowledged, send imReady on the TRADE holder (20030). The console has never sent these bytes and the published client waits for them before it offers, so it may be our turn to say them"
"core.help.swsh-join.unicast" = "send to the console rather than the broadcast address"
"core.help.swsh-join.update-mesh" = "once the migration makes us the host, broadcast UPDATE_MESH the way the console did: its own last one with the host index set to ours. The console stops sending these once it hands the role over, and the mesh is gone about 1.3 s later if nothing takes over"
"core.help.swsh-join.update-mesh-period" = "how often to broadcast it; the console sent one about every 2 s"
