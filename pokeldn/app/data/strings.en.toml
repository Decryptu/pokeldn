"core.help.bdsp-join.ack-repeats" = "how many times to ack the acceptance; the console repeats it until acked"
"core.help.bdsp-join.after-approach" = "after THEY answer our approach, send this message - the initiator's own next one. `0x06:0000000000` is NetDataTalkData{{sexId 0, CHECK}}, which is what SwitchTalkStateMine builds. Repeatable, sent in order"
"core.help.bdsp-join.after-approach-gap" = "seconds between the approach answer and each --after-approach message"
"core.help.bdsp-join.after-talk" = "after answering the talk reservation, send this game message on the reliable stream - `0x08:00` is NetDataSelectData{{index: 0}}. Repeatable, sent in order. The console parks in TalkState GREETING and waits to be advanced, and which message does it is not readable offline: this is the sweep handle"
"core.help.bdsp-join.after-talk-gap" = "seconds between the talk answer and each --after-talk message"
"core.help.bdsp-join.answer-return-select" = "answer the console's NetDataReturnSelectData, a round reset, ONCE; the answer has no measured effect"
"core.help.bdsp-join.answer-with" = "when the console sends game message ID, answer once with the body in FILE (raw bytes, no header): 0x15:capsule.bin answers its ball capsule with ours, 0x14:record.bin its record"
"core.help.bdsp-join.broadcast-only" = "only the broadcast pass, the framing the ack proved"
"core.help.bdsp-join.can-talk" = "NetDataTalkReserveResultData.IsCanTalk - 1 accepts the talk, 0 refuses it. A refusal is the SAFE probe: it should release the player rather than open a flow we cannot hold up"
"core.help.bdsp-join.connect" = "send N well-formed connection requests and report what comes back"
"core.help.bdsp-join.connect-timeout" = "how long one connection request waits for its answer"
"core.help.bdsp-join.count" = "the console's protocol count, if already measured; skips the sweep"
"core.help.bdsp-join.dwell" = "seconds per channel in the scan; 0.8 missed a live network twice"
"core.help.bdsp-join.fresh-pid" = "offer it under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again"
"core.help.bdsp-join.gap" = "seconds to wait for a reply; every probe gets one, so this is short"
"core.help.bdsp-join.identify" = "after the count, read each candidate protocol's registered version"
"core.help.bdsp-join.ids" = "a comma-separated list of ids to probe instead"
"core.help.bdsp-join.initiate-delay" = "seconds to wait after the console starts advertising before approaching"
"core.help.bdsp-join.initiate-gap" = "seconds between approach retransmissions"
"core.help.bdsp-join.initiate-tries" = "how many times to retransmit the approach before giving up"
"core.help.bdsp-join.inject-file" = "poll this file and send each new `ID:HEX` line as a game message on the reliable window, retransmitted until acked. Lines are sent once, in order; `#` starts a comment"
"core.help.bdsp-join.join" = "after the station handshake, send up to N mesh join requests"
"core.help.bdsp-join.join-ack-seconds" = "how long to keep acking the mesh join response; the host repeats it every 500 ms until it is acknowledged"
"core.help.bdsp-join.join-avatar" = "NetJoinData.avatarId, which is what picks the MODEL: it indexes UnionCharacterTable and OpLoadCharacter loads that asset name. 8 is what the default, the girl the screen shows"
"core.help.bdsp-join.join-color" = "NetJoinData.colorId. The game also derives one from the avatar id (OpcManager.GetNpcColorId), so this may not be the deciding field"
"core.help.bdsp-join.join-offset-x" = "where our character spawns relative to the console's own, on x. The default +2.0 is one fixed side, and a player standing against the wall on that side gets a character spawned out of bounds (followed by a crash). Negative puts it on the other side"
"core.help.bdsp-join.join-offset-z" = "the same on z"
"core.help.bdsp-join.join-wait" = "--room-pattern fixed: seconds a join has to draw the console's request for NetCharacterStateData before the next goes out"
"core.help.bdsp-join.language" = "the PlayerInfo language byte, a MsgLangId (3 is French); 1, 8, 9 and 10 cap the greeting's name at 6 characters, others at 12 (docs/bdsp_protocol.md)"
"core.help.bdsp-join.match-wait-period" = "with --match-wait, ALSO send NetDataIsMatchWaitData{{1}} every S seconds for the whole hold (0 disables, leaving the answer-on-request). The console requests 0x23 once, at t=8.4-9.4, and the player reaches the trade option in the Y menu long after that"
"core.help.bdsp-join.no-answer-requests" = "answer the console's NetRequestData with the message it names. It has asked for data id 0x23 in every capture since the first join and has never been answered; this is the probe, so arm it on its own"
"core.help.bdsp-join.no-answer-talk" = "answer a NetDataTalkReserveData with a NetDataTalkReserveResultData. unanswered, the player's character freezes"
"core.help.bdsp-join.no-complete-trade" = "answer NetDataTradeReadyOkData (0x21) with tradeState=WAIT and LET THE TRADE COMPLETE. THIS WRITES THE CONSOLE'S SAVE: the message is the only writer of the console's `targetTradeState`, both states at WAIT move UnionTradeManager to SECURIY_TRADE, and TradeStateModel$$InitState calls PlayerSave. The Pokemon the player picked leaves their box and ours takes its place. Needs --trade-reply. ASK THE USER FIRST"
"core.help.bdsp-join.no-initiate-talk" = "APPROACH the console's character instead of waiting to be approached. Picking an emote locks a player in place waiting to be interacted with, so a recruiting console can only be reached by someone walking up to it. Waits for its broadcast state to say it is advertising, then sends NetDataTalkReserveData - the console's own bytes, 63 00 01 00"
"core.help.bdsp-join.no-join-ack" = "ack the mesh join response, on the STATION protocol"
"core.help.bdsp-join.no-leave-on-host-migration" = "leave the network when the console host starts host migration (Local Protocol 0x13), which its player leaving the room sends; a station that stays sees it repeated for 10 s before the console closes its network"
"core.help.bdsp-join.no-match-wait" = "answer the console's request for NetDataIsMatchWaitData (0x23) with isMatchWait=1 instead of 0. ONE comparison in UnionRoomManager$$SetNetData gates the trade on it (`cmp w23, #1` at main.bin 0x01fd56e4, then UnionFrontDeskTradeController$$StartMatch); every run has answered 0, which is a station declining to be matched"
"core.help.bdsp-join.no-reliable-ack" = "after the join, sweep the bulk acknowledgement until the console's reliable retransmission stops"
"core.help.bdsp-join.no-reliable-auto-ack" = "acknowledge the console's reliable data as it arrives"
"core.help.bdsp-join.no-rtt" = "answer the console's RTT requests (protocol 0x58) while we hold the seat"
"core.help.bdsp-join.no-send-card" = "after the walk, send a NetDataTranerCardData for our own station. It is the message that says what a player LOOKS like, and the probe is whether the character the game drew for us changes on screen"
"core.help.bdsp-join.no-trade-reply" = "answer the console's trade messages with ours. It sends a trainer record and then a Pokemon and waits; with neither answered the player sits on \"En attente d'une reponse\". THIS DOES NOT COMPLETE A TRADE - the player still confirms on their own screen, and declining there leaves the save untouched"
"core.help.bdsp-join.no-ug-join" = "Grand Underground: once the console's NetZoneData arrives, send a NetUgJoinData in its zone at its position plus --join-offset-x/z"
"core.help.bdsp-join.pre-request" = "a game message to put on the reliable stream before the first --request-ids request, e.g. 0x59:01000100 to add station 1 to the console's match-wait list. Repeatable, sent in order"
"core.help.bdsp-join.print-packets" = "print every packet in and out; the --capture file keeps them either way"
"core.help.bdsp-join.probe-id" = "a protocol id the console does not register, so its version is 0"
"core.help.bdsp-join.probe-version" = "1 against an expected 0 is a guaranteed 'version is too high'"
"core.help.bdsp-join.recruiting" = "StateData.isRecruiment, the second byte of the same answer"
"core.help.bdsp-join.reliable-ack-wait" = "how long silence has to last to count as an ack that landed"
"core.help.bdsp-join.reliable-sweep" = "how many values of the byte at offset 1 to try"
"core.help.bdsp-join.request-delay" = "seconds after the walk before the first request"
"core.help.bdsp-join.request-gap" = "seconds between one request landing and the next going out"
"core.help.bdsp-join.request-ids" = "after the walk, send a NetRequestData for each of these data ids, one at a time on the reliable stream, and print what comes back. The Union Room answers six ids (docs/bdsp_protocol.md); 0x22 is the opaque one"
"core.help.bdsp-join.return-select-value" = "the byte to answer it with (default 0, what a console answers a {{1}} with [0x1c27f48]; a {{1}} reads as our back-out and, past phase 2, shows 'the partner canceled the trade')"
"core.help.bdsp-join.room-pattern" = "square spawns one avatar per corner; line and fixed ask whether the game's idea of identity is the station or the position"
"core.help.bdsp-join.room-walk" = "after the reliable handshake, send N position messages of our own and watch the console's screen"
"core.help.bdsp-join.room-walk-period" = "seconds between position messages in the burst pattern. The default is the console's own median gap"
"core.help.bdsp-join.room-walk-steps" = "position messages in the burst pattern's walk. At the console's own stride, 60 is 55.8 units and leaves the Union Room entirely; pass 8 for a walk that ends where the screen can still see it"
"core.help.bdsp-join.room-walk-stride" = "units one position message spans. The default is what a console's own walk measures (0.93 units every 0.41 s, over 80 of its messages); our first walks did 0.15 every 0.6 s, which is a ninth of a real player's speed and is the whole of the stutter"
"core.help.bdsp-join.scans" = "scans for the console's room before giving up; it may not exist yet"
"core.help.bdsp-join.security-repeat" = "seconds between repeats of our security-phase state, until the console reports SEND_READYOK. A CHILD console's SEND_READYOK only ends when a message arrives inside it"
"core.help.bdsp-join.state" = "the OpcState.OnlineState our character reports when the console asks for NetCharacterStateData. 0 NONE means \"doing nothing\" and is a character doing nothing; 3 RECRUITMENT_BATTLE, 4 RECRUITMENT_TRADE, 5 RECRUITMENT_RECORD, 6 RECRUITMENT_GREETINGS, 8 COMMUNICATE"
"core.help.bdsp-join.sweep-ids" = "probe all 256 protocol ids, not only the ones the wiki names"
"core.help.bdsp-join.trade-name" = "the name in OUR trainer record"
"core.help.bdsp-join.trade-nickname" = "nickname for the offered Pokemon"
"core.help.bdsp-join.trade-ot" = "OT name for the offered Pokemon"
"core.help.bdsp-join.trade-save-poke" = "where to write the Pokemon the console offers; trade N > 1 writes FILE-N"
"core.help.bdsp-join.trade-template" = "a PB8 to offer (328 or 344 bytes, encrypted or PKHeX's decrypted export), edited by --trade-nickname and --trade-ot. 328 bytes hold much more than this project has identified, so what we send is a real Pokemon with named fields changed rather than one invented from nothing. Repeatable, one per trade in order; the last is offered again after the list"
"core.help.bdsp-join.ug-join-delay" = "seconds after the console's NetZoneData before the Underground join"
"core.help.bdsp-join.unicast" = "only the unicast pass, skipping the broadcast one"
"core.help.bdsp-join.vary-var" = "after identifying, vary the variable id to find what result 7 tests"
"core.help.bdsp-online.approach-delay" = "seconds after the player's trade emote before our character approaches (no walk)"
"core.help.bdsp-online.at" = "where our character stands: x,y,z,rot_y (a retail host's own spot)"
"core.help.bdsp-online.capture" = "every datagram and event, one JSON line each"
"core.help.bdsp-online.complete-trade" = "answer the ready-ok, after which the console writes its save"
"core.help.bdsp-online.for-receiver" = "make each --gift-event card that gives the receiver's own trainer again for the console's save, during the trade: the console offers first, a Pokemon its save caught names the trainer, and ours goes up made for it; for any other, the trainer the console's session data names. Failing both, the offer goes as given, under the trainer from Settings (pokeldn.receiver_gift, docs/gift_simulated.md)"
"core.help.bdsp-online.fresh-pid" = "offer it under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again"
"core.help.bdsp-online.gift-event" = "the Mystery Gift card each --offer was made from, in the same order: its key in PKHeX's event database (pokeldn.pokemon.Service.gift_events)"
"core.help.bdsp-online.language" = "3 is French"
"core.help.bdsp-online.ldn-protocol" = "the LDN protocol the advertisement is encrypted for"
"core.help.bdsp-online.name" = "the player name our side carries"
"core.help.bdsp-online.offer" = "the Pokemon we trade: a complete, legal, encrypted 328-byte PB8 whose PID the console's save does not already hold; repeatable, one per trade in order, the last offered again after the list"
"core.help.bdsp-online.online" = "trade with a player far away: their console's offer is offered here, and each side confirms only once both consoles have (docs/online.md)"
"core.help.bdsp-online.online-code" = "the room both players enter; default the link code, and no code meets anyone else trading online without one"
"core.help.bdsp-online.password" = "host the room the player enters with this password, e.g. 00000000"
"core.help.bdsp-online.save-theirs" = "write the Pokemon the console offers in trade N to PREFIX_N.pb8"
"core.help.bdsp-online.scene-id" = "default the Union Room's, or the password room's with --password"
"core.help.bdsp-online.seconds" = "how long to host"
"core.help.bdsp-online.state" = "the OnlineState we report when asked; 4 raises the trade bubble"
"core.help.bdsp-online.trainer" = "our trade trainer record"
"core.help.bdsp-online.variable-id" = "our Pia variable id; random by default"
"core.help.frlg-gift.adapter" = "named Wi-Fi adapter profile used while --phy is auto"
"core.help.frlg-gift.artifact-dir" = "directory for --make-artifact output (default: artifacts)"
"core.help.frlg-gift.attempt-log-dir" = "append completed joined-attempt records to daily csv files in DIR; default: disabled (the supervised shell host enables logs/)"
"core.help.frlg-gift.block-repeat" = "emit each block fragment N times (1-8, default 2); bounded redundancy against the console's silent datagram drops"
"core.help.frlg-gift.buffer-script" = "run native ARM code on the console through CLI_RUN_BUFFER_SCRIPT instead of sending a gift: trainer-id-probe: read playerTrainerId out of gSaveBlock2Ptr and return it (reads only, writes nothing); save-dump: read out any part of either save block, using the pointers the console hands us - no absolute address needed (reads only, writes nothing); memory-dump: read out any region of the console's memory by repointing the console's own outgoing message at it (needs --dump-address; reads only, writes nothing); memory-dump-multi: the same, but SEVERAL consecutive blocks in one session (--dump-address --dump-blocks N): the client script runs the payload once per block and each pass sends the next kilobyte; memory-dump-scatter: the same, but the blocks are UNRELATED addresses (--dump-scatter A,B,C): the payload carries a table of bases and the cursor indexes it, so one session reads the sixteen kilobytes a plan actually asked for rather than sixteen consecutive ones; save-write: write bytes into a save block and read the same region back in the same run; the console saves afterwards, so the write reaches flash (--write-hex, --dump-block, --dump-offset); rng-trace: sample one word of memory once a frame, optionally calling a ROM function between the two halves of each sample, and check the LCG recurrence on what comes back (--trace-address, --trace-call, --trace-samples; reads only, plus whatever the callee does); memory-scan: search memory for a 32-bit value and send back where it is; it returns 0 to be called again next frame, so one run covers a range no dump could (--scan-word, --scan-start, --scan-end, --scan-blocks; reads only, writes nothing); table-scan: search memory for a table by its shape, a run of N words each exactly D above the one before it, and send back where each run starts and what value it starts with; this is how a table of pointers is found when no constant in it is known (--table-delta, --table-runlen, --table-start, --table-end, --table-blocks; reads only, writes nothing); rom-checksum: checksum a range of memory in up to 128 blocks and send back one sum per block; the host sets them beside the same sums over a ROM image and names the blocks that differ (--sum-start, --sum-end, --sum-block, --sum-budget, --sum-reference; reads only, writes nothing); anchors: ask the machine where it is: our own load address, the return address into ROM, the stack and the client's five buffers (writes only its own outgoing buffer); create-mon: call CreateMon, a ROM function taking eight arguments, and send back the 100-byte struct Pokemon it built; the mon is built inside our own image, so nothing on the console is written unless --create-mon-append or --create-mon-destination asks for it (--create-mon-call, --create-mon-species, --create-mon-level, --create-mon-personality); string-gather: follow an array of pointers and send back the strings themselves, back to back, instead of a window of mostly-pointers: a whole Easy Chat group in one run (--gather-address, --gather-count, --gather-stride; reads only, writes nothing); call: call any ROM function with arguments we choose, up to eight words in r0..r3 then the stack, and send back its r0 with one address read either side of the call (--call-address, --call-arg, --call-watch); the payload writes nothing itself, but the callee may, so the address has to have been read as code first; flash-read: select the flash bank, byte-copy a save sector out of the 64 KiB window into EWRAM with the CPU, and send the COPY: the console's outgoing message cannot be pointed at flash itself (--flash-sector, --flash-read-offset, --dump-size; reads only, writes nothing); flash-patch: read a save sector out of flash through the banked window, change one field, recompute the checksum and write it back with swi 0x48, then bump the counter-bearing sector so the loader adopts the band. Nothing is rebuilt from RAM, so a field the save routine serializes cannot be lost (--flash-id, --flash-patch-offset, --flash-patch-hex; needs --write-unsafe); flash-write: compose 4 KB in EWRAM on the console and write it straight into a flash sector with swi 0x48, bypassing the game's save code entirely - no counter, checksum or signature (--flash-sector, --flash-fill-base, --flash-fill-step, --flash-words; a sector inside the save bands needs --write-unsafe); call-chain: run a LIST of ROM calls and memory accesses in one frame and send back a word for each, any step able to use the previous step's result as its address - which is how a function that returns a pointer (GetVarPointer) becomes a write (--chain-step, repeatable; a write step needs --write-unsafe); sloop-svc: issue one Sloop syscall (swi 0x40..0x62) with r0..r3 we choose, optionally pointing r0 or r1 at up to 256 bytes we send, and send back the registers and the bytes as the syscall left them (--svc-number, --svc-arg, --svc-text/--svc-hex, --svc-data-in; a number outside the read-only set needs --write-unsafe); install-resident: copy a resident hook into the top of EWRAM and install it in gIntrTable[4], where it runs every frame until a soft reset; answers with the V-blank handler it found (--resident turbo, --resident-param extra=N field=N battle=N hold=0x100 budget=228; needs --write-unsafe); install-kept: install the resident hook kept in the save's filler_B20 (written by save-write --resident), after checking its sum; answers with the V-blank handler it found, 0xBAD0BAD0 when nothing was installed"
"core.help.frlg-gift.call-address" = "with --buffer-script call: the ROM function to call, as a THUMB pointer (bit 0 set). SeedRng is 0x080486D1 and Random 0x080486B1 on the French cartridges, 0x08048691 and 0x08048671 on the English ones [builds.py]. The address is sent as given, so pair it with --console-build. 0 calls nothing, which checks the send path with the ROM left out"
"core.help.frlg-gift.call-arg" = "with --buffer-script call: one argument word, repeatable, up to eight. The first four go in r0..r3 and the rest on the stack at [sp+0..12], where CreateMon's own prologue reads them"
"core.help.frlg-gift.call-watch" = "with --buffer-script call: one word read immediately before and immediately after the call, both returned. gRngValue is 0x03004220 French, 0x030042D0 English. For a function that returns nothing, such as SeedRng, this is the only evidence the call did what it was called for"
"core.help.frlg-gift.capture" = "record an optional JSONL protocol diagnostic"
"core.help.frlg-gift.card-flag-id" = "the Wonder Card flag id our trainer card claims in the Union Room card exchange. A console holding the card with that id arms its own card counters, so a trade or cable-club battle with us increments them [union_room.c:1777]; default 0, which arms nothing"
"core.help.frlg-gift.chain-step" = "with --buffer-script call-chain: one step, repeatable, up to 16, run in order in one frame. `call:NAME_OR_ADDR[,ARG]...` calls a ROM function (AddBagItem, AddMoney, AddPCItem, CalcCRC16, CheckBagHasItem, CheckBagHasSpace, CompactPartySlots, CreateMon, FlagClear, FlagGet, FlagSet, GetMoney, GetSetPokedexFlag, GetVarPointer, IncrementGameStat, InitRamScript, IsEnoughMoney, ItemIsMail, Random, ReadFlash, RemoveBagItem, RemoveMoney, RunScriptImmediately, SeedRng, SpeciesToNationalPokedexNum, StringCompare, VarGet, VarSet, or a THUMB address); `read32|read16|read8:ADDR` reads; `write32|write16|write8:ADDR,VALUE` writes and reads itself back, and needs --write-unsafe. A target of `prev` is the PREVIOUS step's result and `prev+N` is N bytes past it, which is how a function that returns a pointer becomes a write; an op may carry +keep to leave prev alone. Example: --chain-step call:GetVarPointer,0x4024 --chain-step write16:prev,7. A named function is resolved on the console's build"
"core.help.frlg-gift.client-ready-idle-frames" = "diagnostic: quiet child polls after LinkPlayer standby before the first Mystery Gift message; default is the built-in timing"
"core.help.frlg-gift.comm-id" = "LDN local_communication_id in hexadecimal"
"core.help.frlg-gift.config" = "shared host TOML (default: config/host.toml)"
"core.help.frlg-gift.console-build" = "whose addresses a hook, a stub or a ROM call is built with: BPRF, BPGF, BPRE, BPGE, BPRS, BPGS, BPRD, BPGD, BPRI, BPGI, BPRJ, BPGJ. auto (the default) builds for each and sends the one the console's game code names, before anything address-dependent is sent; another code is refused. A game code serves only that cartridge. Bytes with no build address go to any console either way"
"core.help.frlg-gift.create-mon-append" = "with --buffer-script create-mon: append the finished mon to the player's party. The slot is computed from gSaveBlock1Ptr, never given, and it is always the first free one - playerParty[playerPartyCount] - so an occupied slot is never touched and no Pokemon can be destroyed. A full party writes nothing and says so. This is the player's live SAVE and the console commits it to flash: needs --write-unsafe"
"core.help.frlg-gift.create-mon-append-dry-run" = "with --buffer-script create-mon: the same run as --create-mon-append - the same call, the same arithmetic on the same gSaveBlock1Ptr - with the two stores that would change the save left out. It reports the party count and the address it would have written, and reads that slot's current 100 bytes back so the answer says what a real run would overwrite. Writes nothing, so it needs no override"
"core.help.frlg-gift.create-mon-call" = "with --buffer-script create-mon: the ROM function to call with eight arguments, a THUMB pointer. The default is the console build's CreateMon (0x08041151 French, 0x080411FD English); 0 calls nothing, which checks the send path with the ROM left out"
"core.help.frlg-gift.create-mon-destination" = "with --buffer-script create-mon: copy the finished 100 bytes to this address in the console's memory. The mon is built in our own image either way, so without this nothing on the console is written at all. Needs --write-unsafe"
"core.help.frlg-gift.create-mon-iv" = "with --buffer-script create-mon: every IV set to this, 0..31. 32 or more rolls them instead [USE_RANDOM_IVS], which makes the run non-deterministic"
"core.help.frlg-gift.create-mon-level" = "with --buffer-script create-mon: the level, 1..100"
"core.help.frlg-gift.create-mon-ot-id" = "with --buffer-script create-mon --create-mon-ot-id-type 1: the OT id to use"
"core.help.frlg-gift.create-mon-ot-id-type" = "with --buffer-script create-mon: 0 = the OT is the player and the id comes off the real save, 1 = use --create-mon-ot-id, 2 = rolled until not shiny"
"core.help.frlg-gift.create-mon-personality" = "with --buffer-script create-mon: the 32-bit personality value, which fixes the nature, the gender, the ability slot and, with the trainer ids, whether the mon is shiny. Omitted, the console rolls one with Random32"
"core.help.frlg-gift.create-mon-species" = "with --buffer-script create-mon: the species number, 1..411 (internal numbering, not the National Dex)"
"core.help.frlg-gift.denied-message" = "what a console that does not know the phrase reads (max 63 characters); the default is 'That is not the phrase.'"
"core.help.frlg-gift.dump-address" = "with --buffer-script memory-dump: the console address to read out (0x02000000 EWRAM, 0x03000000 IWRAM, 0x08000000 ROM). Accepts 0x hex"
"core.help.frlg-gift.dump-block" = "with --buffer-script save-dump: which save block to read; sav2 is name, trainer id and pokedex, sav1 is party, bag, money, flags and vars"
"core.help.frlg-gift.dump-blocks" = "with --buffer-script memory-dump-multi: how many consecutive blocks to pull in ONE session. MG_LINK_BUFFER_SIZE caps a message, not a session, so the client script runs the payload once per block and each pass sends the next one"
"core.help.frlg-gift.dump-file" = "with a dumping --buffer-script: write the bytes that come back to this file"
"core.help.frlg-gift.dump-offset" = "with --buffer-script save-dump: byte offset into that block. Accepts 0x hex"
"core.help.frlg-gift.dump-scatter" = "with --buffer-script memory-dump-scatter: the UNRELATED addresses to read, one block each, in this order. A plan asks for scattered kilobytes rather than one long region, and this is the payload that answers it. Accepts 0x hex"
"core.help.frlg-gift.dump-size" = "with --buffer-script memory-dump: how many bytes to read, 1..1024 (MG_LINK_BUFFER_SIZE)"
"core.help.frlg-gift.event-pokemon" = "with --gift event-pokemon: a fresh copy of a Gen 3 distribution, made by PKHeX by that event's\nown PID/IV method, e.g. \"WISHMKR Jirachi\", \"10 ANIV Pikachu\", \"Aura Mew\". The\nrelease in --language is preferred. Without it the card sends a stored WISHMKR Jirachi."
"core.help.frlg-gift.expect-console" = "refuse the session unless the console that joins is this cartridge, checked against the version in its game data. Nothing is sent on a mismatch"
"core.help.frlg-gift.export-gift" = "save a .pokegift file and exit without using the radio"
"core.help.frlg-gift.flag-id" = "Wonder Card flagId, 1000..1019; without this option, the selected gift's registered default shown below is used"
"core.help.frlg-gift.flash-counter" = "with --flash-footer: the save counter written at +0xFFC"
"core.help.frlg-gift.flash-counter-bias" = "with --flash-derive: added to gSaveCounter for the footer. 0 keeps the sector in its own band; a positive value is what would outrank the live slot"
"core.help.frlg-gift.flash-derive" = "with --flash-footer: read gLastWrittenSector and gSaveCounter on the console and write the sector the --flash-id actually occupies right now, rather than a position computed when the payload was built. Needs --write-unsafe"
"core.help.frlg-gift.flash-fill-base" = "with --buffer-script flash-write: word[0] of the pattern the console composes"
"core.help.frlg-gift.flash-fill-step" = "with --buffer-script flash-write: added to each word of the pattern"
"core.help.frlg-gift.flash-footer" = "with --buffer-script flash-write: compose a WELL-FORMED save sector instead of a raw pattern - the console zeroes past the data, computes the game's own checksum over the 3968-byte data area and lays down id, checksum, signature and counter"
"core.help.frlg-gift.flash-id" = "with --flash-footer: the sector id written at +0xFF4"
"core.help.frlg-gift.flash-patch-hex" = "with --buffer-script flash-patch: the replacement bytes for that field, as hex. Everything else in the sector is whatever the game's own save routine wrote"
"core.help.frlg-gift.flash-patch-offset" = "with --buffer-script flash-patch: byte offset of the field inside the sector's data"
"core.help.frlg-gift.flash-position" = "with --flash-derive: aim at band position N (0..13) and derive the ID from it, instead of deriving the position from --flash-id. Position 13 is the sector whose counter GetSaveValidStatus reports for the whole slot"
"core.help.frlg-gift.flash-read-offset" = "with --buffer-script flash-read: byte offset into the sector to start reading at"
"core.help.frlg-gift.flash-sector" = "with --buffer-script flash-write: the 4 KB flash sector (0..31) swi 0x48 writes. Sectors 0..27 are the two save bands and need --write-unsafe; 28..31 are outside both"
"core.help.frlg-gift.flash-words" = "with --buffer-script flash-write: how many words of the sector to compose"
"core.help.frlg-gift.game-data-log" = "append what the console says about itself - its card counters, its four questionnaire words and its Easy Chat battle profile - to this jsonl ledger. tools/frlg/game_data_read.py reads it back and says what moved between sessions"
"core.help.frlg-gift.gather-address" = "with --buffer-script string-gather: the address of the first pointer in an array to follow. The answer is the strings themselves, back to back, so one run carries a whole table instead of a window of mostly-pointers. Accepts 0x hex"
"core.help.frlg-gift.gather-count" = "with --buffer-script string-gather: how many pointers to follow at most"
"core.help.frlg-gift.gather-maxlen" = "with --buffer-script string-gather: longest string accepted, terminator included. A pointer that is not a string would otherwise be copied until it met an 0xFF (default 64)"
"core.help.frlg-gift.gather-stride" = "with --buffer-script string-gather: bytes from one pointer to the next (default 12, struct EasyChatWordInfo, whose `text` is at offset 0; a plain array of `const u8 *` is 4)"
"core.help.frlg-gift.gift" = "gift payload to distribute; without --flag-id, uses the registered default.\nAvailable gifts:\n  beast-cutscene          flag ID 1003: composed gift 'LEGENDARY BEAST'\n  beast-cutscene-share    flag ID 1003: composed gift 'LEGENDARY BEAST'\n  celebi                  flag ID 1003: composed gift 'CELEBI GIFT'\n  solrock-stamp           flag ID 1006: solrock-stamp for 'SUN AND MOON RALLY'\n  lunatone-stamp          flag ID 1006: lunatone-stamp for 'SUN AND MOON RALLY'\n  porygon-tm-gift         flag ID 1007: composed gift 'PORYGON TM GIFT'\n  worlds-xp               flag ID 1006: composed gift 'FANtastic Mystery Gift - WORLDS 26'\n  visiting-trainer        flag ID 1008: composed gift 'VISITING TRAINER'\n  mystery-event-probe     flag ID 1009: composed gift 'MYSTERY EVENT'\n  mystery-event-celebi    flag ID 1010: composed gift 'MYSTERY EVENT'\n  mystery-event-npc       flag ID 1011: composed gift 'MYSTERY EVENT'\n  rng-shiny-ditto         flag ID 1013: composed gift 'MYSTERY EVENT'\n  rng-seed-reader         flag ID 1015: composed gift 'MYSTERY EVENT'\n  rng-rate-probe          flag ID 1016: composed gift 'MYSTERY EVENT'\n  rng-rate-probe-3000     flag ID 1017: composed gift 'MYSTERY EVENT'\n  rng-draw-count          flag ID 1018: composed gift 'MYSTERY EVENT'\n  resident-hook           flag ID 1003: composed gift 'MYSTERY EVENT'\n  save-loader             flag ID 1003: composed gift 'MYSTERY EVENT'\n  resident-save           flag ID 1003: composed gift 'MYSTERY EVENT'\n  rng-shiny-hunt          flag ID 1012: composed gift 'MYSTERY EVENT'\n  rng-mon-hunt            flag ID 1019: composed gift 'MYSTERY EVENT'\n  rng-mon-hunt-far        flag ID 1000: composed gift 'MYSTERY EVENT'\n  rng-mon-hunt-both       flag ID 1001: composed gift 'MYSTERY EVENT'\n  rng-mon-hunt-log        flag ID 1002: composed gift 'MYSTERY EVENT'\n  mevent-opcode-sweep     flag ID 1005: composed gift 'MYSTERY EVENT'\n  master-ball             flag ID 1014: composed gift 'MYSTERY GIFT'\n  altering-cave           flag ID 1004: composed gift 'MYSTERY GIFT'\n  battle-count-card       flag ID 1005: composed gift 'BATTLE COUNT CARD'\n  wish-egg                flag ID 1005: composed gift '“WISH EGG”'\n  pokepark-egg            flag ID 1003: composed gift 'POKéMON EGG Present Card'\n  pc-japan-egg            flag ID 1003: composed gift 'POKéMON EGG Present Card'\n  event-pokemon           flag ID 1010: composed gift 'EVENT POKéMON'\n  national-dex            flag ID 1007: composed gift 'NATIONAL POKéDEX'\n  rare-berries            flag ID 1008: composed gift 'RARE BERRIES'\n  starter-egg             flag ID 1009: composed gift 'STARTER EGG'\n  speed-0-5               flag ID 1002: GB-Link Team card 'HALF SPEED'\n  speed-0-75              flag ID 1003: GB-Link Team card '0.75× SPEED'\n  speed-2                 flag ID 1006: GB-Link Team card 'DOUBLE SPEED'\n  speed-3                 flag ID 1007: GB-Link Team card 'TRIPLE SPEED'\n  speed-4                 flag ID 1008: GB-Link Team card '4× SPEED'\n  gender-swap             flag ID 1013: GB-Link Team card 'NEW TRAINER NAME/GENDER'\n  pokerus                 flag ID 1014: GB-Link Team card 'POKéRUS'\n  instant-eggs            flag ID 1016: GB-Link Team card 'INSTANT EGGS'\n  friendship              flag ID 1017: GB-Link Team card 'FRIENDSHIP CHECKER'\n  stat-judge              flag ID 1019: GB-Link Team card 'IV/EV STAT JUDGE'\n  no-encounters           flag ID 1000: GB-Link Team card 'NO ENCOUNTERS & REPEL'\n  nickname                flag ID 1001: GB-Link Team card 'NICKNAME CHANGE'\n  shiny-hunting           flag ID 1002: GB-Link Team card 'SHINY HUNTING'\n  nature-mint             flag ID 1003: GB-Link Team card 'NATURE MINT'\n  ability-capsule         flag ID 1004: GB-Link Team card 'ABILITY CAPSULE'\n  poke-ball-changer       flag ID 1004: GB-Link Team card 'POKé BALL CHANGER'\n  pokemon-gender          flag ID 1005: GB-Link Team card 'POKéMON GENDER CHANGE'\n  pp-max                  flag ID 1007: GB-Link Team card 'PP MAX'\n  max-conditions          flag ID 1008: GB-Link Team card 'MAX CONDITIONS'\n  hidden-power            flag ID 1009: GB-Link Team card 'HIDDEN POWER & IVS'\n  hidden-power-type       flag ID 1017: GB-Link Team card 'HIDDEN POWER TYPE'\n  unown-letters           flag ID 1016: GB-Link Team card 'UNOWN LETTER CHANGER'\n  ev-training             flag ID 1010: GB-Link Team card 'EV TRAINING'\n  trainer-ids             flag ID 1011: GB-Link Team card 'TRAINER ID REVEAL'\n  rival-name              flag ID 1017: GB-Link Team card 'RENAME YOUR RIVAL'\n  gift-ribbons            flag ID 1018: GB-Link Team card 'GIFT RIBBONS'\n  fast-text               flag ID 1019: GB-Link Team card 'FAST TEXT'\n  move-tutor              flag ID 1000: GB-Link Team card 'MOVE RELEARNER & DELETER'\n  trade-evolution         flag ID 1001: GB-Link Team card 'TRADE EVOLUTION'\n  espeon-umbreon          flag ID 1003: GB-Link Team card 'ESPEON & UMBREON'\n  roamer                  flag ID 1002: GB-Link Team card 'ROAMING POKéMON'\n  legendary-respawn       flag ID 1003: GB-Link Team card 'LEGENDARY RESPAWN'\n  travel-anywhere         flag ID 1004: GB-Link Team card 'TRAVEL ANYWHERE'\n  pc-anywhere             flag ID 1006: GB-Link Team card 'PC ANYWHERE'\n  hm-moves                flag ID 1008: GB-Link Team card 'HM MOVES, NO HMs'\n  reusable-tms            flag ID 1005: GB-Link Team card 'REUSABLE TMs'\n  physical-special-split  flag ID 1002: GB-Link Team card 'GEN 4 PHYSICAL/SPECIAL SPLIT'\n  exp-share               flag ID 1007: GB-Link Team card 'EXP. SHARE FOR ALL'\n  box-eggs                flag ID 1010: GB-Link Team card 'POKéMON BOX EGGS'\n  colosseum-pikachu       flag ID 1011: GB-Link Team card 'COLOSSEUM PIKACHU'\n  ageto-celebi            flag ID 1012: GB-Link Team card 'AGETO CELEBI'\n  mattle-ho-oh            flag ID 1013: GB-Link Team card 'MATTLE HO-OH'\n  gift-box                flag ID 1001: GB-Link Team card 'GIFT BOX'\n  pocket-casino           flag ID 1009: GB-Link Team card 'POCKET CASINO'"
"core.help.frlg-gift.gift-file" = "a complete FRLG .pokegift file, or a .wc3 Wonder Card"
"core.help.frlg-gift.hunt-cap" = "with --gift rng-mon-hunt: how many states the stub may try before giving up and leaving the\nrng alone. The default is the smallest cap that finds one 99 times in 100."
"core.help.frlg-gift.hunt-freeze-frames" = "with --gift rng-mon-hunt: how long the search may block the overworld in the worst case,\nin frames (default 900, about 15 s). The field engine has not returned while it\nsearches, so the player sees a still frame with the music playing; criteria whose\nsearch could take longer than this are refused before the card is built."
"core.help.frlg-gift.hunt-iv" = "with --gift rng-mon-hunt: a floor under one IV, repeatable (speed=31, attack=20). The stats\nare hp, attack, defense, speed, sp_attack, sp_defense, named in the order the ROM draws them - which is not the order the summary\nscreen shows."
"core.help.frlg-gift.hunt-level" = "with --gift rng-mon-hunt: the level that species appears at."
"core.help.frlg-gift.hunt-nature" = "with --gift rng-mon-hunt: which natures the search will accept, comma separated\n(Hardy, Lonely, Brave, Adamant, Naughty, Bold, ...), or plain ids. Without this it takes any."
"core.help.frlg-gift.hunt-species" = "with --gift rng-mon-hunt: what the stub's own `setwildbattle` puts on the screen. Neither the\nspecies nor the level is drawn from the rng, so this changes nothing about the\nsearch. The default is a level 5 MAGIKARP, which is catchable in one ball."
"core.help.frlg-gift.id" = "decimal trainer ID, optionally followed by decimal secret ID"
"core.help.frlg-gift.idle-timeout" = "stop after this many seconds without meaningful Switch traffic (join or Pia/RFU datagram); default: disabled"
"core.help.frlg-gift.inter-block-gap-frames" = "diagnostic: idle VBlanks between the blocks of one Mystery Gift message; raise it if a run stalls part-way through a message (default is the built-in timing)"
"core.help.frlg-gift.language" = "trainer language; defaults to DEFAULT_TRAINER"
"core.help.frlg-gift.local-config" = "optional machine-local TOML (default: sibling host.local.toml)"
"core.help.frlg-gift.news" = "Wonder News payload to distribute (Mystery Gift -> Wonder News -> Friend).\nAvailable news:\n  pokeldn  id 1: the plain proof-of-link news, one berry from the man in CERULEAN CITY\n  berry    id 2: a ten-line news that exercises the console's scroll indicator"
"core.help.frlg-gift.news-id" = "override the news id (1..65535). A console keeps news only when it differs from what it already holds [IsWonderNewsSameAsSaved], so bump this to re-send the same text to the same console"
"core.help.frlg-gift.no-accept-decrypted-ccmp" = "accept hardware-decrypted RX frames that retain their CCMP header and mic (TP-Link Archer T3U/rtw88_8822bu profile)"
"core.help.frlg-gift.no-end-on-success" = "stop after the post-delivery RFU close sequence; used by the supervised run_mystery_gift.sh host"
"core.help.frlg-gift.no-live" = "host for a real Switch"
"core.help.frlg-gift.no-local-config" = "do not load host.local.toml"
"core.help.frlg-gift.no-make-artifact" = "write an annotated listing for the exact Mystery Gift bytes that will be sent (default: disabled)"
"core.help.frlg-gift.no-native-nonce-sequence" = "use FireRed's session-wide incrementing Pia nonce"
"core.help.frlg-gift.no-session-response-first" = "send Session type 2 unicast before type 5 broadcast"
"core.help.frlg-gift.no-skip-encryption" = "delegate transmit CCMP to mac80211/hardware; over-air frames remain encrypted"
"core.help.frlg-gift.no-trust-pia" = "use Pia-backed send-once block delivery (recommended); --no-trust-pia enables diagnostic RFU retransmits"
"core.help.frlg-gift.ot" = "trainer name; defaults to DEFAULT_TRAINER"
"core.help.frlg-gift.over-ip" = "host for an emulated console over the LAN instead of over the radio: answer ldn_mitm discovery on port 11452 and carry Pia over UDP. Takes the address to advertise, or auto. Needs no adapter, no prod.keys and no root"
"core.help.frlg-gift.password" = "LDN passphrase hex; default uses the frlg emulator value"
"core.help.frlg-gift.phy" = "Wi-Fi phy; explicit phyN overrides --adapter"
"core.help.frlg-gift.print-effective-config" = "print the safe effective host configuration and exit"
"core.help.frlg-gift.questionnaire" = "require the console to be holding this four-word Easy Chat phrase in its Poke Mart\nquestionnaire before anything is sent [SVR_CHECK_QUESTIONNAIRE]. Each word is an\nEnglish word name, `species:N`, `move:N`, `group/index`, or a raw id. Word ids are\nper-language outside the species and move groups, so read the phrase off the target\nconsole first: every session logs the four ids it is holding."
"core.help.frlg-gift.ram-script-block-repeat" = "fragment redundancy for the ident-25 delivery script alone (1-8, default 3); the console never reflects gift blocks, so a lost fragment cannot be resent"
"core.help.frlg-gift.ram-script-map-group" = "which map group the RAM script binds to (a group_order index in\n[decomp:data/maps/map_groups.json]). The default is the player's house, where the\nmother never moves. Cerulean Cave B1F is group 1 map 74, and MEWTWO is object 3."
"core.help.frlg-gift.ram-script-map-num" = "which map in that group the RAM script binds to."
"core.help.frlg-gift.ram-script-object" = "which object event on that map. Local ids are assigned in map.json order and start\nat 1. Binding REPLACES that object's own script, so choose one that never moves."
"core.help.frlg-gift.resident" = "with --buffer-script install-resident: the hook to install (turbo)"
"core.help.frlg-gift.resident-param" = "with --buffer-script install-resident: a hook parameter, e.g. extra=6"
"core.help.frlg-gift.save-backup" = "copy the console's whole 128 KB save into FILE (.sav); the console's save is not changed [docs/frlg_gift.md, Save backup and restore]"
"core.help.frlg-gift.save-restore" = "write the .sav FILE onto the console: beside its newest save, every sector read back, then the game loads it and saves; anything short of that keeps the old save"
"core.help.frlg-gift.save-resume-dir" = "with --save-backup: keep a backup the link cut short here; the next one goes on from it"
"core.help.frlg-gift.scan-blocks" = "with --buffer-script memory-scan: 32-byte blocks scanned per frame, the budget the console's link has to live with (default 512, about 3 ms of a 16 ms frame)"
"core.help.frlg-gift.scan-end" = "with --buffer-script memory-scan: one past the last address to read (default 0x09000000, the end of a 16 MB cartridge)"
"core.help.frlg-gift.scan-max-calls" = "with --buffer-script memory-scan: the watchdog. A payload that never returns 1 hangs the Mystery Gift menu, so the scan gives up and answers after this many frames (default: what the range needs, plus two)"
"core.help.frlg-gift.scan-start" = "with --buffer-script memory-scan: where to start, 32-byte aligned (default 0x08000000, the cartridge)"
"core.help.frlg-gift.scan-word" = "with --buffer-script memory-scan: the 32-bit value to search for. The payload returns 0 to be called again next frame, so one run scans a whole range instead of the 1024 bytes a dump reads. Accepts 0x hex"
"core.help.frlg-gift.scene" = "LDN scene; default is the known FRLG scene"
"core.help.frlg-gift.sum-block" = "with --buffer-script rom-checksum: the block size, a power of two from 32; the range holds at most 128 blocks (default 0x20000)"
"core.help.frlg-gift.sum-budget" = "with --buffer-script rom-checksum: 32-byte chunks summed per frame (default 512, no more load on the frame than memory-scan's 512)"
"core.help.frlg-gift.sum-end" = "with --buffer-script rom-checksum: one past the last address to sum, a whole number of blocks after --sum-start (default 0x09000000)"
"core.help.frlg-gift.sum-max-calls" = "with --buffer-script rom-checksum: the watchdog, in calls (= frames) (default: what the range needs, plus two)"
"core.help.frlg-gift.sum-reference" = "with --buffer-script rom-checksum: the ROM image to compare the sums with (default: the image config.REFERENCE_ROMS names for the console's build)"
"core.help.frlg-gift.sum-start" = "with --buffer-script rom-checksum: where to start, aligned to --sum-block (default 0x08000000, the cartridge)"
"core.help.frlg-gift.svc-arg" = "with --buffer-script sloop-svc: r0, r1, r2, r3 in order (repeatable)"
"core.help.frlg-gift.svc-bkpt" = "with --buffer-script sloop-svc: issue THUMB `bkpt N` instead of `swi N` (0xFF is the one the game never issues; needs --write-unsafe)"
"core.help.frlg-gift.svc-data-in" = "with --buffer-script sloop-svc: point this register at the console's copy of the data"
"core.help.frlg-gift.svc-hex" = "with --buffer-script sloop-svc: the data as hex instead"
"core.help.frlg-gift.svc-number" = "with --buffer-script sloop-svc: a syscall, 0x40..0x62 (0x4D is the bad-word check); repeat for up to eight, issued in order in one session"
"core.help.frlg-gift.svc-text" = "with --buffer-script sloop-svc: up to 256 bytes of UTF-8 data to send"
"core.help.frlg-gift.table-blocks" = "with --buffer-script table-scan: 16-byte blocks scanned per frame (default 192, the same instruction load on the frame that memory-scan's 512 costs)"
"core.help.frlg-gift.table-delta" = "with --buffer-script table-scan: what each word of the run must exceed the one before it by. 2 finds a table of pointers to consecutive u16s, which is what gSpecialVars is. Accepts 0x hex"
"core.help.frlg-gift.table-end" = "with --buffer-script table-scan: one past the last address to read (default 0x09000000)"
"core.help.frlg-gift.table-max-calls" = "with --buffer-script table-scan: the watchdog, in calls (= frames)"
"core.help.frlg-gift.table-runlen" = "with --buffer-script table-scan: how many words in a row make a run worth reporting (default 12, the twelve gSpecialVar_0x8000..0x800B entries)"
"core.help.frlg-gift.table-start" = "with --buffer-script table-scan: where to start, 16-byte aligned (default 0x08000000, the cartridge)"
"core.help.frlg-gift.tick-hz" = "how many RFU slots a second the host emits (default 59.727, one per GBA VBlank). A real console pair runs far below this; lowering it slows every link step by the same factor."
"core.help.frlg-gift.trace-address" = "with --buffer-script rng-trace: the word to sample once a frame. gRngValue is 0x03004220 on the French cartridges and 0x030042D0 on the English ones [builds.py]. Accepts 0x hex"
"core.help.frlg-gift.trace-call" = "with --buffer-script rng-trace: a ROM function to call between the two reads of each sample, as a THUMB pointer (bit 0 set), or 0 for none. Random is 0x080486B1 French, 0x08048671 English; the recurrence between the two reads is then the proof that both addresses are what we say they are"
"core.help.frlg-gift.trace-samples" = "with --buffer-script rng-trace: how many frames to sample, 1..96"
"core.help.frlg-gift.verbose" = "show detailed protocol logging instead of milestones"
"core.help.frlg-gift.version" = "game version; defaults to DEFAULT_TRAINER"
"core.help.frlg-gift.write-hex" = "with --buffer-script save-write: the bytes to write, as hex"
"core.help.frlg-gift.write-text" = "with --buffer-script save-write: ascii to write into the save block at --dump-offset. The same region is read back in the same run, so the answer is the proof. The console saves afterwards, so it reaches flash"
"core.help.frlg-gift.write-unsafe" = "allow a save write outside struct SaveBlock2's never-read filler regions. This is the player's live save and the console commits it to flash; without this the write is refused"
"core.help.frlg-trade-host.adapter" = "named Wi-Fi adapter profile used while --phy is auto"
"core.help.frlg-trade-host.anim-delay" = "override the proven trade-animation frame delay"
"core.help.frlg-trade-host.battle-fight" = "Union Room battle: pick fight with the first move instead of forfeiting at the first action prompt. Only the forfeit path has been proven on hardware"
"core.help.frlg-trade-host.battle-move" = "Union Room battle with --battle-fight: which of the active Pokemon's four move slots to use. The default 0 is whatever move slot one holds, which for the tracked party is refresh and does no damage"
"core.help.frlg-trade-host.board-level" = "override the level shown on the trading board"
"core.help.frlg-trade-host.board-type" = "Union Room trading board: register the offered Pokemon (its species and level) and ask for this type in return, so the console's board lists us. The console must have a Pokemon of that type to start the trade"
"core.help.frlg-trade-host.capture" = "record an optional JSONL protocol diagnostic"
"core.help.frlg-trade-host.card-flag-id" = "the Wonder Card flag id our trainer card claims in the Union Room card exchange. A console holding the card with that id arms its own card counters, so a trade or cable-club battle with us increments them [union_room.c:1777]; default 0, which arms nothing"
"core.help.frlg-trade-host.chat-file" = "Union Room chat: tail this file while the host runs and send every line appended to it, so the chat can be answered live instead of queued at launch"
"core.help.frlg-trade-host.chat-message" = "Union Room chat: a line to send once the chat opens, repeatable. Up to 15 Gen-3 charmap characters each, the console's own keyboard limit and the width its chat line can draw; they go out one at a time, 1.5s apart"
"core.help.frlg-trade-host.colosseum" = "host the cable-club COLOSSEUM instead of the trade centre (Pokemon Center 2F, third NPC -> Colosseum -> Single Battle -> JOIN). The entry is the trade centre's, so --card-flag-id still arms the console's card counters, and only this path increments its battlesWon [decomp:src/cable_club.c:792]. The whole party fights"
"core.help.frlg-trade-host.comm-id" = "LDN local_communication_id in hexadecimal"
"core.help.frlg-trade-host.config" = "shared host TOML (default: config/host.toml)"
"core.help.frlg-trade-host.id" = "decimal trainer ID, optionally followed by decimal secret ID"
"core.help.frlg-trade-host.language" = "trainer language; defaults to DEFAULT_TRAINER"
"core.help.frlg-trade-host.link-player-idle-frames" = "diagnostic: quiet console polls after the LinkPlayer exchange before the leader starts the trainer-card exchange itself"
"core.help.frlg-trade-host.local-config" = "optional machine-local TOML (default: sibling host.local.toml)"
"core.help.frlg-trade-host.no-accept-decrypted-ccmp" = "accept hardware-decrypted RX frames that retain their CCMP header and mic (TP-Link Archer T3U/rtw88_8822bu profile)"
"core.help.frlg-trade-host.no-live" = "host for a real Switch"
"core.help.frlg-trade-host.no-local-config" = "do not load host.local.toml"
"core.help.frlg-trade-host.no-native-nonce-sequence" = "use FireRed's session-wide incrementing Pia nonce"
"core.help.frlg-trade-host.no-session-response-first" = "send Session type 2 unicast before type 5 broadcast"
"core.help.frlg-trade-host.no-skip-encryption" = "delegate transmit CCMP to mac80211/hardware; over-air frames remain encrypted"
"core.help.frlg-trade-host.no-trust-pia" = "use Pia-backed send-once block delivery (recommended); --no-trust-pia enables diagnostic RFU retransmits"
"core.help.frlg-trade-host.online" = "trade with a player far away: their console's offer is offered here, and each side confirms only once both consoles have (docs/online.md)"
"core.help.frlg-trade-host.online-code" = "the room both players enter; default the link code, and no code meets anyone else trading online without one"
"core.help.frlg-trade-host.ot" = "trainer name; defaults to DEFAULT_TRAINER"
"core.help.frlg-trade-host.out" = "received-mon output path"
"core.help.frlg-trade-host.over-ip" = "host for an emulated console over the LAN instead of over the radio: answer ldn_mitm discovery on port 11452 and carry Pia over UDP. Takes the address to advertise, or auto. Needs no adapter, no prod.keys and no root"
"core.help.frlg-trade-host.password" = "LDN passphrase hex; default uses the frlg emulator value"
"core.help.frlg-trade-host.phy" = "Wi-Fi phy; explicit phyN overrides --adapter"
"core.help.frlg-trade-host.player-ids-repeat-frames" = "diagnostic: consecutive polls the opening SEND_PLAYER_IDS burst occupies before the LinkPlayer block request; default is the built-in timing"
"core.help.frlg-trade-host.print-effective-config" = "print the safe effective host configuration and exit"
"core.help.frlg-trade-host.save-rounds" = "post-trade standby rounds before the parties are exchanged again; default 6, the Switch FireRed count. GBA Emerald runs 5 (docs/rse.md, After the trade)"
"core.help.frlg-trade-host.scene" = "LDN scene; default is the known Direct Corner scene"
"core.help.frlg-trade-host.slot" = "0-based host party slot offered for one trade (default: 1)"
"core.help.frlg-trade-host.slots" = "comma-separated 0-based offered slots for multiple trades"
"core.help.frlg-trade-host.tick-hz" = "how many RFU slots a second the host emits (default 59.727, one per GBA VBlank). A real console pair runs far below this; lowering it slows every link step by the same factor."
"core.help.frlg-trade-host.union-room" = "host for the Union Room (the middle NPC on Pokemon Center 2F) instead of the trade centre's third NPC; use with --union-room-keepalive 120 and --board-type"
"core.help.frlg-trade-host.union-room-activity" = "which activity --union-room advertises; default 'in-room', the bare IN_UNION_ROOM a console standing in the room connects to. 'search' is what the screen before the room looks for (untested)"
"core.help.frlg-trade-host.union-room-battle" = "Union Room: accept the console's Combat instead of declining it. The console needs two non-egg party mons at level 30 or lower or it refuses on its own screen; it is master and runs the battle, we answer its controller commands"
"core.help.frlg-trade-host.union-room-chat" = "Union Room: accept the console's 'Tchat' instead of declining it. Both sides send a join block, then the console's keyboard opens and every line it types is logged"
"core.help.frlg-trade-host.union-room-keepalive" = "Union Room: re-present a parent NI_START for N VBlanks before the first UNI frame; the room child drops the link after five unanswered frames, and enters UNI 480 frames after the last NI_START. 120 is proven"
"core.help.frlg-trade-host.verbose" = "show detailed protocol logging instead of milestones"
"core.help.frlg-trade-host.version" = "game version; defaults to DEFAULT_TRAINER"
"core.help.frlg-trade-join.anim-delay" = "frames to wait after START_TRADE before READY_FINISH (default 1935, the wire-measured wireless DoTradeAnim duration)"
"core.help.frlg-trade-join.capture" = "(live) record every Pia datagram both directions to a .jsonl (incl. the SSID), so a live attempt can be decrypted/analysed offline"
"core.help.frlg-trade-join.card-flag-id" = "the Wonder Card flag id our trainer card claims in the Union Room card exchange. A console holding the card with that id arms its own card counters, so a trade or cable-club battle with us increments them [union_room.c:1777]; default 0, which arms nothing"
"core.help.frlg-trade-join.comm-id" = "LDN local_communication_id (hex) to join (live); if omitted, joins the only available network (scan logs candidates)"
"core.help.frlg-trade-join.compress" = "zstd-compress out payloads"
"core.help.frlg-trade-join.connect-id" = "(live) override the RFU connection id (hex, e.g. 7036) sent in the emulator connect ('C') frame. Default: a random nonzero id - any nonzero value works. --parent-pid is a deprecated alias."
"core.help.frlg-trade-join.decline" = "decline at the confirm prompt (confirm-NO -> immediate READY_CANCEL, graceful cancel-to-leave) [trade.c:2019-2023]"
"core.help.frlg-trade-join.id" = "decimal trainer ID, optionally followed by decimal secret ID"
"core.help.frlg-trade-join.keys" = "Switch prod.keys (live); default: keys_path from config/host*.toml"
"core.help.frlg-trade-join.language" = "trainer language; defaults to DEFAULT_TRAINER"
"core.help.frlg-trade-join.live" = "join the real Switch"
"core.help.frlg-trade-join.no-trust-pia" = "send each block fragment once (fire-and-forget) instead of the console's re-send-until-confirmed loop. Default off (faithful re-send): against the real client, a block streams in 1-2s with aggressive re-sends (~1.5x) and completes; trust_pia's send-once crawled (~0.1 frag/s) and never completed. trust_pia was a workaround for the 'flood', but that was the rtt deadlock (now fixed). --trust-pia re-enables send-once"
"core.help.frlg-trade-join.ot" = "trainer name; defaults to DEFAULT_TRAINER"
"core.help.frlg-trade-join.out" = "save the received mon here (trades=1); for trades>1 this is a base/prefix and each received mon is saved as <stem>_trade<k>_<species>.pk3"
"core.help.frlg-trade-join.out-format" = "received mon format: pk3=decrypted (opens in PKHeX), ek3=encrypted/raw"
"core.help.frlg-trade-join.out-size" = "received file size (100=party, 80=box)"
"core.help.frlg-trade-join.pace-ms" = "live: minimum ms between two datagrams to the console, merging what is due into one (0 = off). See sim.PACE_MIN_GAP_MS for the measurement."
"core.help.frlg-trade-join.password" = "LDN passphrase as hex (live); default = the built-in 64-byte emulator passphrase (shared by frlg/rse)"
"core.help.frlg-trade-join.phy" = "wifi phy for the LDN join (live)"
"core.help.frlg-trade-join.refuse-illegit" = "treat an offered Deoxys/Mew as PARTNER_MON_INVALID and cancel-to-leave (the host's illegitimate-legend gate; legitimacy is not offline-decodable) [trade.c:1965-1968]"
"core.help.frlg-trade-join.replay" = "offline: replay a capture's host stream"
"core.help.frlg-trade-join.self-id" = "wire mpId / gLocalLinkPlayerId (joiner = 1 = right seat; the only valid value - mpId 0 is the host/parent) [trade.c:1816; link_rfu_2.c:1633-1638]"
"core.help.frlg-trade-join.slot" = "party slot to offer on the first round (default 1); the per-round default list grows ascending from here (or [0..N-1] for a full-party swap)"
"core.help.frlg-trade-join.slots" = "explicit comma list of 0-based party slots to offer, one per trade (len must == --trades, distinct, each < party size), e.g. --slots 0,2,4"
"core.help.frlg-trade-join.trades" = "number of sequential trades to perform, 1..6 (default 1; 6 = swap both entire parties). After the Nth trade the sim cancels-to-leave."
"core.help.frlg-trade-join.version" = "game version; defaults to DEFAULT_TRAINER"
"core.help.frlg-trade-online.adapter" = "named Wi-Fi adapter profile used while --phy is auto"
"core.help.frlg-trade-online.anim-delay" = "override the proven trade-animation frame delay"
"core.help.frlg-trade-online.battle-fight" = "Union Room battle: pick fight with the first move instead of forfeiting at the first action prompt. Only the forfeit path has been proven on hardware"
"core.help.frlg-trade-online.battle-move" = "Union Room battle with --battle-fight: which of the active Pokemon's four move slots to use. The default 0 is whatever move slot one holds, which for the tracked party is refresh and does no damage"
"core.help.frlg-trade-online.board-level" = "override the level shown on the trading board"
"core.help.frlg-trade-online.board-type" = "Union Room trading board: register the offered Pokemon (its species and level) and ask for this type in return, so the console's board lists us. The console must have a Pokemon of that type to start the trade"
"core.help.frlg-trade-online.capture" = "record an optional JSONL protocol diagnostic"
"core.help.frlg-trade-online.card-flag-id" = "the Wonder Card flag id our trainer card claims in the Union Room card exchange. A console holding the card with that id arms its own card counters, so a trade or cable-club battle with us increments them [union_room.c:1777]; default 0, which arms nothing"
"core.help.frlg-trade-online.chat-file" = "Union Room chat: tail this file while the host runs and send every line appended to it, so the chat can be answered live instead of queued at launch"
"core.help.frlg-trade-online.chat-message" = "Union Room chat: a line to send once the chat opens, repeatable. Up to 15 Gen-3 charmap characters each, the console's own keyboard limit and the width its chat line can draw; they go out one at a time, 1.5s apart"
"core.help.frlg-trade-online.colosseum" = "host the cable-club COLOSSEUM instead of the trade centre (Pokemon Center 2F, third NPC -> Colosseum -> Single Battle -> JOIN). The entry is the trade centre's, so --card-flag-id still arms the console's card counters, and only this path increments its battlesWon [decomp:src/cable_club.c:792]. The whole party fights"
"core.help.frlg-trade-online.comm-id" = "LDN local_communication_id in hexadecimal"
"core.help.frlg-trade-online.config" = "shared host TOML (default: config/host.toml)"
"core.help.frlg-trade-online.id" = "decimal trainer ID, optionally followed by decimal secret ID"
"core.help.frlg-trade-online.language" = "trainer language; defaults to DEFAULT_TRAINER"
"core.help.frlg-trade-online.link-player-idle-frames" = "diagnostic: quiet console polls after the LinkPlayer exchange before the leader starts the trainer-card exchange itself"
"core.help.frlg-trade-online.local-config" = "optional machine-local TOML (default: sibling host.local.toml)"
"core.help.frlg-trade-online.no-accept-decrypted-ccmp" = "accept hardware-decrypted RX frames that retain their CCMP header and mic (TP-Link Archer T3U/rtw88_8822bu profile)"
"core.help.frlg-trade-online.no-live" = "host for a real Switch"
"core.help.frlg-trade-online.no-local-config" = "do not load host.local.toml"
"core.help.frlg-trade-online.no-native-nonce-sequence" = "use FireRed's session-wide incrementing Pia nonce"
"core.help.frlg-trade-online.no-session-response-first" = "send Session type 2 unicast before type 5 broadcast"
"core.help.frlg-trade-online.no-skip-encryption" = "delegate transmit CCMP to mac80211/hardware; over-air frames remain encrypted"
"core.help.frlg-trade-online.no-trust-pia" = "use Pia-backed send-once block delivery (recommended); --no-trust-pia enables diagnostic RFU retransmits"
"core.help.frlg-trade-online.online" = "trade with a player far away: their console's offer is offered here, and each side confirms only once both consoles have (docs/online.md)"
"core.help.frlg-trade-online.online-code" = "the room both players enter; default the link code, and no code meets anyone else trading online without one"
"core.help.frlg-trade-online.ot" = "trainer name; defaults to DEFAULT_TRAINER"
"core.help.frlg-trade-online.out" = "received-mon output path"
"core.help.frlg-trade-online.over-ip" = "host for an emulated console over the LAN instead of over the radio: answer ldn_mitm discovery on port 11452 and carry Pia over UDP. Takes the address to advertise, or auto. Needs no adapter, no prod.keys and no root"
"core.help.frlg-trade-online.password" = "LDN passphrase hex; default uses the frlg emulator value"
"core.help.frlg-trade-online.phy" = "Wi-Fi phy; explicit phyN overrides --adapter"
"core.help.frlg-trade-online.player-ids-repeat-frames" = "diagnostic: consecutive polls the opening SEND_PLAYER_IDS burst occupies before the LinkPlayer block request; default is the built-in timing"
"core.help.frlg-trade-online.print-effective-config" = "print the safe effective host configuration and exit"
"core.help.frlg-trade-online.save-rounds" = "post-trade standby rounds before the parties are exchanged again; default 6, the Switch FireRed count. GBA Emerald runs 5 (docs/rse.md, After the trade)"
"core.help.frlg-trade-online.scene" = "LDN scene; default is the known Direct Corner scene"
"core.help.frlg-trade-online.slot" = "0-based host party slot offered for one trade (default: 1)"
"core.help.frlg-trade-online.slots" = "comma-separated 0-based offered slots for multiple trades"
"core.help.frlg-trade-online.tick-hz" = "how many RFU slots a second the host emits (default 59.727, one per GBA VBlank). A real console pair runs far below this; lowering it slows every link step by the same factor."
"core.help.frlg-trade-online.union-room" = "host for the Union Room (the middle NPC on Pokemon Center 2F) instead of the trade centre's third NPC; use with --union-room-keepalive 120 and --board-type"
"core.help.frlg-trade-online.union-room-activity" = "which activity --union-room advertises; default 'in-room', the bare IN_UNION_ROOM a console standing in the room connects to. 'search' is what the screen before the room looks for (untested)"
"core.help.frlg-trade-online.union-room-battle" = "Union Room: accept the console's Combat instead of declining it. The console needs two non-egg party mons at level 30 or lower or it refuses on its own screen; it is master and runs the battle, we answer its controller commands"
"core.help.frlg-trade-online.union-room-chat" = "Union Room: accept the console's 'Tchat' instead of declining it. Both sides send a join block, then the console's keyboard opens and every line it types is logged"
"core.help.frlg-trade-online.union-room-keepalive" = "Union Room: re-present a parent NI_START for N VBlanks before the first UNI frame; the room child drops the link after five unanswered frames, and enters UNI 480 frames after the last NI_START. 120 is proven"
"core.help.frlg-trade-online.verbose" = "show detailed protocol logging instead of milestones"
"core.help.frlg-trade-online.version" = "game version; defaults to DEFAULT_TRAINER"
"core.help.lgpe-gift-host.advance-after" = "seconds after the party clones to move our state word to 2 and send the offer, which is what a station does as its own state word reaches 2"
"core.help.lgpe-gift-host.agree-withdrawn-vote" = "test only: carry the drive on through a withdrawn vote, as the host did before it answered state 2 (docs/lgpe_session.md). Locks a console's save"
"core.help.lgpe-gift-host.capture" = "every datagram, one JSON line each"
"core.help.lgpe-gift-host.channel" = "1, 6, 11; code (default): the channel the link code puts a searching console on, the only one it joins on; auto: scan for the console's own network under our scene id and host on its channel"
"core.help.lgpe-gift-host.code" = "the link code the player enters: three picker names (English or French) or indices 0-9, comma-separated"
"core.help.lgpe-gift-host.drive-delay" = "seconds between the steps the host drives an offered clone through"
"core.help.lgpe-gift-host.first" = "our kind-1 identity message, sent when the console's arrives: a captured 376-byte message, header included, or echo for the console's own back"
"core.help.lgpe-gift-host.first-copies" = "how many kind 1 identities to send, 0.3 s apart under successive steps"
"core.help.lgpe-gift-host.for-receiver" = "make each --gift-event card that gives the receiver's own trainer again for the console's save, during the trade: the console offers first, a Pokemon its save caught names the trainer, and ours goes up made for it; for any other, the trainer the console's session data names. Failing both, the offer goes as given, under the trainer from Settings (pokeldn.receiver_gift, docs/gift_simulated.md)"
"core.help.lgpe-gift-host.fresh-pid" = "offer every --offer and --next-offer structure under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again"
"core.help.lgpe-gift-host.gift-event" = "the Mystery Gift card each --offer and --next-offer was made from, in the same order: its key in PKHeX's event database (pokeldn.pokemon.Service.gift_events)"
"core.help.lgpe-gift-host.grace" = "seconds past --seconds to hold a session whose trade is half done"
"core.help.lgpe-gift-host.ignore-clone0-answer" = "test only: ignore the console's first answer to our clone 0 pair, as if lost, so the pair goes again"
"core.help.lgpe-gift-host.ip-host" = "host over ldn_mitm for an emulator instead of the radio (docs/ldn.md)"
"core.help.lgpe-gift-host.lead" = "test only, for bin/lgpe_join.py: act as a console host's player, each step this many seconds after the last. Offer unprompted after the party clones and after each result, vote on the offered clone, announce and vote the commit clone, commit (docs/lgpe_session.md). Never against a console"
"core.help.lgpe-gift-host.next-offer" = "232-byte box structure for the next trade in the same session; repeatable, one per trade after the first"
"core.help.lgpe-gift-host.no-accept-decrypted-ccmp" = "do not accept the frames rtw88 has already decrypted. With this the host reads nothing on that adapter"
"core.help.lgpe-gift-host.no-skip-encryption" = "let the LDN layer encrypt in software. The Archer T3U wants the hardware path, which is the default here"
"core.help.lgpe-gift-host.no-type4-data" = "publish no clone data on clone types 4 and 1. Without it the console never passes the gate at 0x11b080 and stays on its search screen"
"core.help.lgpe-gift-host.offer" = "answer the console's offer with this 232-byte box structure (echo: its own back), and its commits with commits"
"core.help.lgpe-gift-host.online" = "trade with a player far away: their console's offer is offered here, and each side confirms only once both consoles have (docs/online.md)"
"core.help.lgpe-gift-host.online-code" = "the room both players enter; default the link code, and no code meets anyone else trading online without one"
"core.help.lgpe-gift-host.our-ip" = "with --ip-host, the address to advertise"
"core.help.lgpe-gift-host.our-trainer" = "the trainer id pair written over the identity's"
"core.help.lgpe-gift-host.party-clones" = "how many party clones (ids 2 up) to announce after the identities; the reference host announced two"
"core.help.lgpe-gift-host.party-clones-delay" = "seconds after our identity to announce them"
"core.help.lgpe-gift-host.player-name" = "the nickname our connection response carries"
"core.help.lgpe-gift-host.protocol" = "the LDN advertisement protocol. A title sees only its own: Let's Go advertises and scans on 1, measured off the console's own beacon"
"core.help.lgpe-gift-host.random-ssid" = "let the LDN layer pick the session id. A Let's Go network's is the fixed value every console advertises, which is the default here"
"core.help.lgpe-gift-host.received" = "write the peer's offered PB7 here"
"core.help.lgpe-gift-host.result-after" = "seconds after the second commit to send the result, the next trade's first slot, with two clones announced 0.5 s before it; a retail host sent it 26.8 s after, behind its trade animation"
"core.help.lgpe-gift-host.scene-id" = "the advertised scene id, in place of the one --code gives"
"core.help.lgpe-gift-host.seconds" = "how long to host"
"core.help.lgpe-gift-host.trainer-name" = "the player name our identity carries, the one the trade screen shows"
"core.help.lgpe-gift-host.variable-id" = "our own variable id, any nonzero value"
