"core.help.bdsp-gift-host.approach-delay" = "seconds after the player's trade emote before our character approaches (no walk)"
"core.help.bdsp-gift-host.at" = "where our character stands: x,y,z,rot_y (a retail host's own spot)"
"core.help.bdsp-gift-host.capture" = "every datagram and event, one JSON line each"
"core.help.bdsp-gift-host.complete-trade" = "answer the ready-ok, after which the console writes its save"
"core.help.bdsp-gift-host.for-receiver" = "make each --gift-event card that gives the receiver's own trainer again for the console's save, during the trade: the console offers first, a Pokemon its save caught names the trainer, and ours goes up made for it; for any other, the trainer the console's session data names. Failing both, the offer goes as given, under the trainer from Settings (pokeldn.receiver_gift, docs/gift_simulated.md)"
"core.help.bdsp-gift-host.fresh-pid" = "offer it under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again"
"core.help.bdsp-gift-host.gift-event" = "the Mystery Gift card each --offer was made from, in the same order: its key in PKHeX's event database (pokeldn.pokemon.Service.gift_events)"
"core.help.bdsp-gift-host.language" = "3 is French"
"core.help.bdsp-gift-host.ldn-protocol" = "the LDN protocol the advertisement is encrypted for"
"core.help.bdsp-gift-host.name" = "the player name our side carries"
"core.help.bdsp-gift-host.offer" = "the Pokemon we trade: a complete, legal, encrypted 328-byte PB8 whose PID the console's save does not already hold; repeatable, one per trade in order, the last offered again after the list"
"core.help.bdsp-gift-host.online" = "trade with a player far away: their console's offer is offered here, and each side confirms only once both consoles have (docs/online.md)"
"core.help.bdsp-gift-host.online-code" = "the room both players enter; default the link code, and no code meets anyone else trading online without one"
"core.help.bdsp-gift-host.password" = "host the room the player enters with this password, e.g. 00000000"
"core.help.bdsp-gift-host.save-theirs" = "write the Pokemon the console offers in trade N to PREFIX_N.pb8"
"core.help.bdsp-gift-host.scene-id" = "default the Union Room's, or the password room's with --password"
"core.help.bdsp-gift-host.seconds" = "how long to host"
"core.help.bdsp-gift-host.state" = "the OnlineState we report when asked; 4 raises the trade bubble"
"core.help.bdsp-gift-host.trainer" = "our trade trainer record"
"core.help.bdsp-gift-host.variable-id" = "our Pia variable id; random by default"
