"core.help.za-join.app-ver" = "hex; the application communication version the Session join declares. Six is what a reference joiner sends and what the advertisement carries"
"core.help.za-join.broadcast" = "address our datagrams to the link-local broadcast, as a retail station does"
"core.help.za-join.capture" = "every datagram as one JSON line"
"core.help.za-join.code" = "only join a console waiting on this link code"
"core.help.za-join.comm-id" = "hex; the default is Legends Z-A's"
"core.help.za-join.connect-timeout" = "bound the association alone; the seat itself is not bounded by it"
"core.help.za-join.dwell" = "seconds per channel in a scan"
"core.help.za-join.fresh-pid" = "send the offer under a new PID and encryption constant, shiny state kept, so a save that took this record before takes it again"
"core.help.za-join.game" = "once the session is up, open the game's reliable streams and send the identity, the selection record and, with --trade-offer, an offer"
"core.help.za-join.game-dir" = "where the reference payloads (identity10.bin, selection.bin, ...) live; by default the ones pokeldn.za.reference ships"
"core.help.za-join.hold" = "how long to hold one seat"
"core.help.za-join.hold-after-trade" = "leave this long after the last queued trade's fourth step; by default the seat is kept until the player backs out or --hold ends, as every joiner does"
"core.help.za-join.ip-join" = "join an emulated host over the LAN through its ldn_mitm bridge, with no radio and no root"
"core.help.za-join.join-flags" = "hex packet flags ORed into the Session join's header: 4 is the band's skip-network-connection-check bit, which a station the console has not yet connected may owe"
"core.help.za-join.join-repeat" = "V-Blank ticks between re-sends of an unanswered Session join; 0 is once"
"core.help.za-join.mac" = "give the phy this MAC before associating"
"core.help.za-join.net-probe" = "send the band's Net connection request once seated"
"core.help.za-join.no-answer" = "stay silent; the run then measures what the console sends on its own"
"core.help.za-join.node-version" = "the local communication version our NodeInfo publishes on the LAN path; a host publishes its own application version there"
"core.help.za-join.offer-delay" = "seconds after the streams open before the offer goes out"
"core.help.za-join.offer-out" = "write the host's offered PA9 here; trade N > 1 writes FILE-N"
"core.help.za-join.our-ip" = "our own address on that LAN"
"core.help.za-join.our-var" = "the variable id we send as our own until the console names one"
"core.help.za-join.platform" = "the station platform byte; both retail consoles here are Switch 2"
"core.help.za-join.player-name" = "the name the Session join's PlayerInfo carries; a reference joiner sends one space"
"core.help.za-join.print-packets" = "print every packet in and out; the --capture file keeps them either way"
"core.help.za-join.protocols" = "id:version pairs the Session join declares; the default is the set a reference Legends Z-A joiner declares"
"core.help.za-join.quiet-seat" = "end a seat on which the console has sent nothing for this long"
"core.help.za-join.seat-marker" = "a file to write the moment a seat forms and again when it ends, so a watcher on the other side can act on the seat without a relay"
"core.help.za-join.seconds" = "the whole run"
"core.help.za-join.selection-count" = "how many selection records to send; a reference joiner sent sixteen"
"core.help.za-join.selection-delay" = "seconds after the identity before the selection record starts; a reference joiner waits about 0.46 s"
"core.help.za-join.selection-period" = "seconds between selection records; a reference joiner sends about four a second, each under a fresh sequence"
"core.help.za-join.session-join" = "send the Session join request once the console's Net is acknowledged"
"core.help.za-join.source-id" = "our own constant id in the Session join: the LDN permutation of our MAC, which is the form the console publishes for itself, or the MAC as it is"
"core.help.za-join.token" = "hex; the Session join's 32-byte identification token, zero-padded. A reference joiner sends 0x06 and zeroes"
"core.help.za-join.trade-offer" = "a 354-byte offer message to send once the streams are open. Repeatable, one per trade in the seat; the last serves every later trade"
"core.help.za-join.trainer-name" = "the player name our identity carries, the one the trade screen shows"
"core.help.za-join.unicast" = "address our datagrams to the host rather than to the broadcast"
"core.help.za-join.withhold" = "never send this answer, to find what a seat needs (docs/za.md, Unresolved); repeatable"
"core.help.za-online.capture" = "every datagram as one JSON line"
"core.help.za-online.channel" = "a searching console put both of its measured sessions on channel 6"
"core.help.za-online.code" = "the link code the player types"
"core.help.za-online.comm-id" = "hex; the default is the title's. An emulated Z-A advertises and scans for ffffffffffffffff over ldn_mitm"
"core.help.za-online.for-receiver" = "make each --gift-event card that gives the receiver's own trainer again for the console's save, during the trade: the console offers first, a Pokemon its save caught names the trainer, and ours goes up made for it; for any other, the trainer the console's session data names. Failing both, the offer goes as given, under the trainer from Settings (pokeldn.receiver_gift, docs/gift_simulated.md)"
"core.help.za-online.fresh-pid" = "send the offer under a new PID and encryption constant, shiny state kept, so a save that took this record before takes it again"
"core.help.za-online.game-dir" = "where identity10.bin, identity11b.bin and selection.bin live; by default the ones pokeldn.za.reference ships"
"core.help.za-online.gift-event" = "the Mystery Gift card each --trade-offer was made from, in the same order: its key in PKHeX's event database (pokeldn.pokemon.Service.gift_events)"
"core.help.za-online.hold-after-trade" = "optional seconds to keep the seat once the console is back on its box after a trade, then hand the console the session and close; by default the host waits for the console to leave"
"core.help.za-online.ip-host" = "host an emulated console over ldn_mitm, with no radio"
"core.help.za-online.offer-at" = "make our pick this many seconds after the preview, without waiting for the console's; the default answers the console's pick"
"core.help.za-online.offer-out" = "write the Pokemon the console picks here; trade N > 1 writes FILE-N. A preview, the console's cursor on its box, is not written"
"core.help.za-online.online" = "trade with a player far away: their console's offer is offered here, and each side confirms only once both consoles have (docs/online.md)"
"core.help.za-online.online-code" = "the room both players enter; default the link code, and no code meets anyone else trading online without one"
"core.help.za-online.player-name" = "the LDN node name; a searching console advertises one space"
"core.help.za-online.trade-offer" = "the 354-byte offer message: the preview, then our pick. Repeatable, one per trade in the seat; the last serves every later trade"
"core.help.za-online.trainer-name" = "the player name our identity carries, the one the trade screen shows"
