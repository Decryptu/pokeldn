"core.help.lgpe-online.offer" = "answer the console's offer with this 232-byte box structure (echo: its own back), and its commits with commits"
"core.help.lgpe-online.online" = "trade with a player far away: their console's offer is offered here, and each side confirms only once both consoles have (docs/online.md)"
