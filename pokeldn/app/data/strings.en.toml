"core.help.pla-online.data-exchange-skip-source-check" = "put the skip-source-check flag on the record, where a reference host sends none; one variable if a run shows the record is not dispatched"
"core.help.pla-online.for-receiver" = "make each --gift-event card that gives the receiver's own trainer again for the console's save, during the trade: the console offers first, a Pokemon its save caught names the trainer, and ours goes up made for it; for any other, the trainer the console's session data names. Failing both, the offer goes as given, under the trainer from Settings (pokeldn.receiver_gift, docs/gift_simulated.md)"
"core.help.pla-online.fresh-pid" = "offer the record under a new PID and encryption constant, drawn once per run, shiny state kept, so a save that took it before takes it again"
"core.help.pla-online.game-channel" = "open the game's own reliable channel (0x7c) once the data exchange is done: answer the console's channel message, send the same back, and open the host's own port-0 channel, which is what the trade flow's step 0x20 ticks its network object for"
"core.help.pla-online.gender" = "0 male, 1 female: the gender in that record, whose look follows it"
"core.help.pla-online.gift-event" = "the Mystery Gift card each --trade-box-record was made from, in the same order: its key in PKHeX's event database (pokeldn.pokemon.Service.gift_events)"
"core.help.pla-online.hello-protocol" = "the protocol the host sends its reliable game data on; the game's own reader polls 0x80 (BroadcastReliable), so 0x80 puts data where the game drains it"
"core.help.pla-online.host-player-id" = "hex, 16 bytes: the host's player id in the station-list update, a real principal id in place of the placeholder"
"core.help.pla-online.host-player-name" = "the host's player name in the station-list update, which the game reads as identity; a real name in place of the placeholder single space"
"core.help.pla-online.interrupt-before-phase-6" = "after answering phase 3, wait for the console's phase 6, then leave without answering it; this deliberately triggers the game's trade restriction"
"core.help.pla-online.ip-host" = "host over ldn_mitm on the LAN for an emulator; no radio and no root"
"core.help.pla-online.join-seq" = "the sequence id the join response promises; a type-5 update must reach it"
"core.help.pla-online.leave-after" = "seconds after a station's session join to send it the type-3 leave and end the run; the one direction no capture shows"
"core.help.pla-online.leave-sends" = "how many times to send it; a console sends four"
"core.help.pla-online.net-protocol" = "the Net protocol id to send the connection request under"
"core.help.pla-online.no-net-probe" = "stay silent after a join, to measure what the joiner does unprompted"
"core.help.pla-online.no-session-ack" = "do not answer a join request with the type-1 ack (buys 8 s, completes nothing)"
"core.help.pla-online.no-session-response" = "do not answer a join request with the type-2 join response"
"core.help.pla-online.offer-out" = "write the record the console traded to this file, -N before the extension for trade N above 1"
"core.help.pla-online.online" = "trade with a player far away: their console's offer is offered here, and each side confirms only once both consoles have (docs/online.md)"
"core.help.pla-online.online-code" = "the room both players enter; default the link code, and no code meets anyone else trading online without one"
"core.help.pla-online.our-ip" = "with --ip-host, the address to advertise and serve on"
"core.help.pla-online.player-name" = "the LDN node name; a retail console publishes its profile name here"
"core.help.pla-online.print-packets" = "print every packet in and out; the --capture file keeps them either way"
"core.help.pla-online.reliable-bitmap" = "destination bitmap word, big-endian at wire[9]; the console drops a message unless the bit for its own station index (1) is set, so bit 1 = 0x2"
"core.help.pla-online.reliable-dest-bits" = "destination-bit count on the host's reliable message; 2 so the console's own station index (1) is in range of the body destination-bitmap check"
"core.help.pla-online.reliable-hello" = "hex: once the console speaks on reliable, send this as the host's own reliable seq-1 data (the game leaves at +10 s if the host never speaks)"
"core.help.pla-online.reliable-mirror" = "progress the host's reliable stream in lockstep: for each console reliable data message, send the host's own next-sequence data with the same payload (the console advances only as the host advances)"
"core.help.pla-online.rtt-probe" = "also send an RTT request, which a peer answers with no state at all"
"core.help.pla-online.rtt-version" = "the RTT protocol version byte"
"core.help.pla-online.seconds" = "how long to hold the network up"
"core.help.pla-online.session-update" = "after the response, send a type-5 station-list update (sets job+0x7c). Its per-station layout is provisional pending the 0x739050 decode"
"core.help.pla-online.ssid" = "hex, 16 bytes; default lets the LDN layer pick"
"core.help.pla-online.stay-after-leave" = "keep the network up and go silent after the leave instead of ending the run; separates what a console reads in the leave from what it reads in the network going down. Also keeps the run (and BOOT marks) after a console leaves following a trade"
"core.help.pla-online.sustain" = "once joined, echo RTT and acknowledge the reliable stream so the console does not time out after 12 s and leave"
"core.help.pla-online.trade-box" = "offer the host's own Pokemon on the game channel: answer the console's trade box with one of ours at sequence 2 on port 0"
"core.help.pla-online.trade-box-collect" = "write every record the console shows or offers to this directory, one file per distinct record, named by species and nickname"
"core.help.pla-online.trade-box-experience" = "the experience in the offered record; the level the game shows is the curve's, so this and --trade-box-level go together"
"core.help.pla-online.trade-box-level" = "the level byte in the offered record's party tail"
"core.help.pla-online.trade-box-nickname" = "the nickname in the offered record"
"core.help.pla-online.trade-box-ours" = "offer a record of the host's own rather than the captured one: the same Pokemon under the data exchange's player name and id and a new identity, so the console is not offered the record it is itself holding"
"core.help.pla-online.trade-box-pid" = "hex: the personality value in the offered record. HYPOTHESIS: a record is shiny when the trainer id, the secret id and the two halves of this value exclusive-or to under 16, which is the Gen-6 rule and is untested here"
"core.help.pla-online.trade-box-record" = "offer this record file instead of the reference one; stored or party, encrypted or decrypted. Repeatable, one per trade in order; the last is offered again after the list"
"core.help.rse-gift.adapter" = "named Wi-Fi adapter profile used while --phy is auto"
"core.help.rse-gift.artifact-dir" = "directory for --make-artifact output (default: artifacts)"
"core.help.rse-gift.attempt-log-dir" = "append completed joined-attempt records to daily csv files in DIR; default: disabled (the supervised shell host enables logs/)"
"core.help.rse-gift.block-repeat" = "emit each block fragment N times (1-8, default 2); bounded redundancy against the console's silent datagram drops"
"core.help.rse-gift.buffer-script" = "run native ARM code on the console through CLI_RUN_BUFFER_SCRIPT instead of sending a gift: trainer-id-probe: read playerTrainerId out of gSaveBlock2Ptr and return it (reads only, writes nothing); save-dump: read out any part of either save block, using the pointers the console hands us - no absolute address needed (reads only, writes nothing); memory-dump: read out any region of the console's memory by repointing the console's own outgoing message at it (needs --dump-address; reads only, writes nothing); memory-dump-multi: the same, but SEVERAL consecutive blocks in one session (--dump-address --dump-blocks N): the client script runs the payload once per block and each pass sends the next kilobyte; memory-dump-scatter: the same, but the blocks are UNRELATED addresses (--dump-scatter A,B,C): the payload carries a table of bases and the cursor indexes it, so one session reads the sixteen kilobytes a plan actually asked for rather than sixteen consecutive ones; save-write: write bytes into a save block and read the same region back in the same run; the console saves afterwards, so the write reaches flash (--write-hex, --dump-block, --dump-offset); rng-trace: sample one word of memory once a frame, optionally calling a ROM function between the two halves of each sample, and check the LCG recurrence on what comes back (--trace-address, --trace-call, --trace-samples; reads only, plus whatever the callee does); memory-scan: search memory for a 32-bit value and send back where it is; it returns 0 to be called again next frame, so one run covers a range no dump could (--scan-word, --scan-start, --scan-end, --scan-blocks; reads only, writes nothing); table-scan: search memory for a table by its shape, a run of N words each exactly D above the one before it, and send back where each run starts and what value it starts with; this is how a table of pointers is found when no constant in it is known (--table-delta, --table-runlen, --table-start, --table-end, --table-blocks; reads only, writes nothing); rom-checksum: checksum a range of memory in up to 128 blocks and send back one sum per block; the host sets them beside the same sums over a ROM image and names the blocks that differ (--sum-start, --sum-end, --sum-block, --sum-budget, --sum-reference; reads only, writes nothing); anchors: ask the machine where it is: our own load address, the return address into ROM, the stack and the client's five buffers (writes only its own outgoing buffer); create-mon: call CreateMon, a ROM function taking eight arguments, and send back the 100-byte struct Pokemon it built; the mon is built inside our own image, so nothing on the console is written unless --create-mon-append or --create-mon-destination asks for it (--create-mon-call, --create-mon-species, --create-mon-level, --create-mon-personality); string-gather: follow an array of pointers and send back the strings themselves, back to back, instead of a window of mostly-pointers: a whole Easy Chat group in one run (--gather-address, --gather-count, --gather-stride; reads only, writes nothing); call: call any ROM function with arguments we choose, up to eight words in r0..r3 then the stack, and send back its r0 with one address read either side of the call (--call-address, --call-arg, --call-watch); the payload writes nothing itself, but the callee may, so the address has to have been read as code first; flash-read: select the flash bank, byte-copy a save sector out of the 64 KiB window into EWRAM with the CPU, and send the COPY: the console's outgoing message cannot be pointed at flash itself (--flash-sector, --flash-read-offset, --dump-size; reads only, writes nothing); flash-patch: read a save sector out of flash through the banked window, change one field, recompute the checksum and write it back with swi 0x48, then bump the counter-bearing sector so the loader adopts the band. Nothing is rebuilt from RAM, so a field the save routine serializes cannot be lost (--flash-id, --flash-patch-offset, --flash-patch-hex; needs --write-unsafe); flash-write: compose 4 KB in EWRAM on the console and write it straight into a flash sector with swi 0x48, bypassing the game's save code entirely - no counter, checksum or signature (--flash-sector, --flash-fill-base, --flash-fill-step, --flash-words; a sector inside the save bands needs --write-unsafe); call-chain: run a LIST of ROM calls and memory accesses in one frame and send back a word for each, any step able to use the previous step's result as its address - which is how a function that returns a pointer (GetVarPointer) becomes a write (--chain-step, repeatable; a write step needs --write-unsafe); sloop-svc: issue one Sloop syscall (swi 0x40..0x62) with r0..r3 we choose, optionally pointing r0 or r1 at up to 256 bytes we send, and send back the registers and the bytes as the syscall left them (--svc-number, --svc-arg, --svc-text/--svc-hex, --svc-data-in; a number outside the read-only set needs --write-unsafe); install-resident: copy a resident hook into the top of EWRAM and install it in gIntrTable[4], where it runs every frame until a soft reset; answers with the V-blank handler it found (--resident turbo, --resident-param extra=N field=N battle=N hold=0x100 budget=228; needs --write-unsafe); install-kept: install the resident hook kept in the save's filler_B20 (written by save-write --resident), after checking its sum; answers with the V-blank handler it found, 0xBAD0BAD0 when nothing was installed"
"core.help.rse-gift.call-address" = "with --buffer-script call: the ROM function to call, as a THUMB pointer (bit 0 set). SeedRng is 0x080486D1 and Random 0x080486B1 on the French cartridges, 0x08048691 and 0x08048671 on the English ones [builds.py]. The address is sent as given, so pair it with --console-build. 0 calls nothing, which checks the send path with the ROM left out"
"core.help.rse-gift.call-arg" = "with --buffer-script call: one argument word, repeatable, up to eight. The first four go in r0..r3 and the rest on the stack at [sp+0..12], where CreateMon's own prologue reads them"
"core.help.rse-gift.call-watch" = "with --buffer-script call: one word read immediately before and immediately after the call, both returned. gRngValue is 0x03004220 French, 0x030042D0 English. For a function that returns nothing, such as SeedRng, this is the only evidence the call did what it was called for"
"core.help.rse-gift.capture" = "record an optional JSONL protocol diagnostic"
"core.help.rse-gift.card-flag-id" = "the Wonder Card flag id our trainer card claims in the Union Room card exchange. A console holding the card with that id arms its own card counters, so a trade or cable-club battle with us increments them [union_room.c:1777]; default 0, which arms nothing"
"core.help.rse-gift.chain-step" = "with --buffer-script call-chain: one step, repeatable, up to 16, run in order in one frame. `call:NAME_OR_ADDR[,ARG]...` calls a ROM function (AddBagItem, AddMoney, AddPCItem, CalcCRC16, CheckBagHasItem, CheckBagHasSpace, CompactPartySlots, CreateMon, FlagClear, FlagGet, FlagSet, GetMoney, GetSetPokedexFlag, GetVarPointer, IncrementGameStat, InitRamScript, IsEnoughMoney, ItemIsMail, Random, ReadFlash, RemoveBagItem, RemoveMoney, RunScriptImmediately, SeedRng, SpeciesToNationalPokedexNum, StringCompare, VarGet, VarSet, or a THUMB address); `read32|read16|read8:ADDR` reads; `write32|write16|write8:ADDR,VALUE` writes and reads itself back, and needs --write-unsafe. A target of `prev` is the PREVIOUS step's result and `prev+N` is N bytes past it, which is how a function that returns a pointer becomes a write; an op may carry +keep to leave prev alone. Example: --chain-step call:GetVarPointer,0x4024 --chain-step write16:prev,7. A named function is resolved on the console's build"
"core.help.rse-gift.client-ready-idle-frames" = "diagnostic: quiet child polls after LinkPlayer standby before the first Mystery Gift message; default is the built-in timing"
"core.help.rse-gift.comm-id" = "LDN local_communication_id in hexadecimal"
"core.help.rse-gift.config" = "shared host TOML (default: config/host.toml)"
"core.help.rse-gift.console-build" = "whose addresses a hook, a stub or a ROM call is built with: BPRF, BPGF, BPRE, BPGE, BPRS, BPGS, BPRD, BPGD, BPRI, BPGI, BPRJ, BPGJ. auto (the default) builds for each and sends the one the console's game code names, before anything address-dependent is sent; another code is refused. A game code serves only that cartridge. Bytes with no build address go to any console either way"
"core.help.rse-gift.create-mon-append" = "with --buffer-script create-mon: append the finished mon to the player's party. The slot is computed from gSaveBlock1Ptr, never given, and it is always the first free one - playerParty[playerPartyCount] - so an occupied slot is never touched and no Pokemon can be destroyed. A full party writes nothing and says so. This is the player's live SAVE and the console commits it to flash: needs --write-unsafe"
"core.help.rse-gift.create-mon-append-dry-run" = "with --buffer-script create-mon: the same run as --create-mon-append - the same call, the same arithmetic on the same gSaveBlock1Ptr - with the two stores that would change the save left out. It reports the party count and the address it would have written, and reads that slot's current 100 bytes back so the answer says what a real run would overwrite. Writes nothing, so it needs no override"
"core.help.rse-gift.create-mon-call" = "with --buffer-script create-mon: the ROM function to call with eight arguments, a THUMB pointer. The default is the console build's CreateMon (0x08041151 French, 0x080411FD English); 0 calls nothing, which checks the send path with the ROM left out"
"core.help.rse-gift.create-mon-destination" = "with --buffer-script create-mon: copy the finished 100 bytes to this address in the console's memory. The mon is built in our own image either way, so without this nothing on the console is written at all. Needs --write-unsafe"
"core.help.rse-gift.create-mon-iv" = "with --buffer-script create-mon: every IV set to this, 0..31. 32 or more rolls them instead [USE_RANDOM_IVS], which makes the run non-deterministic"
"core.help.rse-gift.create-mon-level" = "with --buffer-script create-mon: the level, 1..100"
"core.help.rse-gift.create-mon-ot-id" = "with --buffer-script create-mon --create-mon-ot-id-type 1: the OT id to use"
"core.help.rse-gift.create-mon-ot-id-type" = "with --buffer-script create-mon: 0 = the OT is the player and the id comes off the real save, 1 = use --create-mon-ot-id, 2 = rolled until not shiny"
"core.help.rse-gift.create-mon-personality" = "with --buffer-script create-mon: the 32-bit personality value, which fixes the nature, the gender, the ability slot and, with the trainer ids, whether the mon is shiny. Omitted, the console rolls one with Random32"
"core.help.rse-gift.create-mon-species" = "with --buffer-script create-mon: the species number, 1..411 (internal numbering, not the National Dex)"
"core.help.rse-gift.denied-message" = "what a console that does not know the phrase reads (max 63 characters); the default is 'That is not the phrase.'"
"core.help.rse-gift.dump-address" = "with --buffer-script memory-dump: the console address to read out (0x02000000 EWRAM, 0x03000000 IWRAM, 0x08000000 ROM). Accepts 0x hex"
"core.help.rse-gift.dump-block" = "with --buffer-script save-dump: which save block to read; sav2 is name, trainer id and pokedex, sav1 is party, bag, money, flags and vars"
"core.help.rse-gift.dump-blocks" = "with --buffer-script memory-dump-multi: how many consecutive blocks to pull in ONE session. MG_LINK_BUFFER_SIZE caps a message, not a session, so the client script runs the payload once per block and each pass sends the next one"
"core.help.rse-gift.dump-file" = "with a dumping --buffer-script: write the bytes that come back to this file"
"core.help.rse-gift.dump-offset" = "with --buffer-script save-dump: byte offset into that block. Accepts 0x hex"
"core.help.rse-gift.dump-scatter" = "with --buffer-script memory-dump-scatter: the UNRELATED addresses to read, one block each, in this order. A plan asks for scattered kilobytes rather than one long region, and this is the payload that answers it. Accepts 0x hex"
"core.help.rse-gift.dump-size" = "with --buffer-script memory-dump: how many bytes to read, 1..1024 (MG_LINK_BUFFER_SIZE)"
"core.help.rse-gift.event-pokemon" = "with --gift event-pokemon: a fresh copy of a Gen 3 distribution, made by PKHeX by that event's\nown PID/IV method, e.g. \"WISHMKR Jirachi\", \"10 ANIV Pikachu\", \"Aura Mew\". The\nrelease in --language is preferred. Without it the card sends a stored WISHMKR Jirachi."
"core.help.rse-gift.expect-console" = "refuse the session unless the console that joins is this cartridge, checked against the version in its game data. Nothing is sent on a mismatch"
"core.help.rse-gift.export-gift" = "save a .pokegift file and exit without using the radio"
"core.help.rse-gift.flag-id" = "Wonder Card flagId, 1000..1019; without this option, the selected gift's registered default shown below is used"
"core.help.rse-gift.flash-counter" = "with --flash-footer: the save counter written at +0xFFC"
"core.help.rse-gift.flash-counter-bias" = "with --flash-derive: added to gSaveCounter for the footer. 0 keeps the sector in its own band; a positive value is what would outrank the live slot"
"core.help.rse-gift.flash-derive" = "with --flash-footer: read gLastWrittenSector and gSaveCounter on the console and write the sector the --flash-id actually occupies right now, rather than a position computed when the payload was built. Needs --write-unsafe"
"core.help.rse-gift.flash-fill-base" = "with --buffer-script flash-write: word[0] of the pattern the console composes"
"core.help.rse-gift.flash-fill-step" = "with --buffer-script flash-write: added to each word of the pattern"
"core.help.rse-gift.flash-footer" = "with --buffer-script flash-write: compose a WELL-FORMED save sector instead of a raw pattern - the console zeroes past the data, computes the game's own checksum over the 3968-byte data area and lays down id, checksum, signature and counter"
"core.help.rse-gift.flash-id" = "with --flash-footer: the sector id written at +0xFF4"
"core.help.rse-gift.flash-patch-hex" = "with --buffer-script flash-patch: the replacement bytes for that field, as hex. Everything else in the sector is whatever the game's own save routine wrote"
"core.help.rse-gift.flash-patch-offset" = "with --buffer-script flash-patch: byte offset of the field inside the sector's data"
"core.help.rse-gift.flash-position" = "with --flash-derive: aim at band position N (0..13) and derive the ID from it, instead of deriving the position from --flash-id. Position 13 is the sector whose counter GetSaveValidStatus reports for the whole slot"
"core.help.rse-gift.flash-read-offset" = "with --buffer-script flash-read: byte offset into the sector to start reading at"
"core.help.rse-gift.flash-sector" = "with --buffer-script flash-write: the 4 KB flash sector (0..31) swi 0x48 writes. Sectors 0..27 are the two save bands and need --write-unsafe; 28..31 are outside both"
"core.help.rse-gift.flash-words" = "with --buffer-script flash-write: how many words of the sector to compose"
"core.help.rse-gift.game-data-log" = "append what the console says about itself - its card counters, its four questionnaire words and its Easy Chat battle profile - to this jsonl ledger. tools/frlg/game_data_read.py reads it back and says what moved between sessions"
"core.help.rse-gift.gather-address" = "with --buffer-script string-gather: the address of the first pointer in an array to follow. The answer is the strings themselves, back to back, so one run carries a whole table instead of a window of mostly-pointers. Accepts 0x hex"
"core.help.rse-gift.gather-count" = "with --buffer-script string-gather: how many pointers to follow at most"
"core.help.rse-gift.gather-maxlen" = "with --buffer-script string-gather: longest string accepted, terminator included. A pointer that is not a string would otherwise be copied until it met an 0xFF (default 64)"
"core.help.rse-gift.gather-stride" = "with --buffer-script string-gather: bytes from one pointer to the next (default 12, struct EasyChatWordInfo, whose `text` is at offset 0; a plain array of `const u8 *` is 4)"
"core.help.rse-gift.gift" = "gift payload to distribute; without --flag-id, uses the registered default.\nAvailable gifts:\n  beast-cutscene          flag ID 1003: composed gift 'LEGENDARY BEAST'\n  beast-cutscene-share    flag ID 1003: composed gift 'LEGENDARY BEAST'\n  celebi                  flag ID 1003: composed gift 'CELEBI GIFT'\n  solrock-stamp           flag ID 1006: solrock-stamp for 'SUN AND MOON RALLY'\n  lunatone-stamp          flag ID 1006: lunatone-stamp for 'SUN AND MOON RALLY'\n  porygon-tm-gift         flag ID 1007: composed gift 'PORYGON TM GIFT'\n  worlds-xp               flag ID 1006: composed gift 'FANtastic Mystery Gift - WORLDS 26'\n  visiting-trainer        flag ID 1008: composed gift 'VISITING TRAINER'\n  mystery-event-probe     flag ID 1009: composed gift 'MYSTERY EVENT'\n  mystery-event-celebi    flag ID 1010: composed gift 'MYSTERY EVENT'\n  mystery-event-npc       flag ID 1011: composed gift 'MYSTERY EVENT'\n  rng-shiny-ditto         flag ID 1013: composed gift 'MYSTERY EVENT'\n  rng-seed-reader         flag ID 1015: composed gift 'MYSTERY EVENT'\n  rng-rate-probe          flag ID 1016: composed gift 'MYSTERY EVENT'\n  rng-rate-probe-3000     flag ID 1017: composed gift 'MYSTERY EVENT'\n  rng-draw-count          flag ID 1018: composed gift 'MYSTERY EVENT'\n  resident-hook           flag ID 1003: composed gift 'MYSTERY EVENT'\n  save-loader             flag ID 1003: composed gift 'MYSTERY EVENT'\n  resident-save           flag ID 1003: composed gift 'MYSTERY EVENT'\n  rng-shiny-hunt          flag ID 1012: composed gift 'MYSTERY EVENT'\n  rng-mon-hunt            flag ID 1019: composed gift 'MYSTERY EVENT'\n  rng-mon-hunt-far        flag ID 1000: composed gift 'MYSTERY EVENT'\n  rng-mon-hunt-both       flag ID 1001: composed gift 'MYSTERY EVENT'\n  rng-mon-hunt-log        flag ID 1002: composed gift 'MYSTERY EVENT'\n  mevent-opcode-sweep     flag ID 1005: composed gift 'MYSTERY EVENT'\n  master-ball             flag ID 1014: composed gift 'MYSTERY GIFT'\n  altering-cave           flag ID 1004: composed gift 'MYSTERY GIFT'\n  battle-count-card       flag ID 1005: composed gift 'BATTLE COUNT CARD'\n  wish-egg                flag ID 1005: composed gift '“WISH EGG”'\n  pokepark-egg            flag ID 1003: composed gift 'POKéMON EGG Present Card'\n  pc-japan-egg            flag ID 1003: composed gift 'POKéMON EGG Present Card'\n  event-pokemon           flag ID 1010: composed gift 'EVENT POKéMON'\n  national-dex            flag ID 1007: composed gift 'NATIONAL POKéDEX'\n  rare-berries            flag ID 1008: composed gift 'RARE BERRIES'\n  starter-egg             flag ID 1009: composed gift 'STARTER EGG'\n  speed-0-5               flag ID 1002: GB-Link Team card 'HALF SPEED'\n  speed-0-75              flag ID 1003: GB-Link Team card '0.75× SPEED'\n  speed-2                 flag ID 1006: GB-Link Team card 'DOUBLE SPEED'\n  speed-3                 flag ID 1007: GB-Link Team card 'TRIPLE SPEED'\n  speed-4                 flag ID 1008: GB-Link Team card '4× SPEED'\n  gender-swap             flag ID 1013: GB-Link Team card 'NEW TRAINER NAME/GENDER'\n  pokerus                 flag ID 1014: GB-Link Team card 'POKéRUS'\n  instant-eggs            flag ID 1016: GB-Link Team card 'INSTANT EGGS'\n  friendship              flag ID 1017: GB-Link Team card 'FRIENDSHIP CHECKER'\n  stat-judge              flag ID 1019: GB-Link Team card 'IV/EV STAT JUDGE'\n  no-encounters           flag ID 1000: GB-Link Team card 'NO ENCOUNTERS & REPEL'\n  nickname                flag ID 1001: GB-Link Team card 'NICKNAME CHANGE'\n  shiny-hunting           flag ID 1002: GB-Link Team card 'SHINY HUNTING'\n  nature-mint             flag ID 1003: GB-Link Team card 'NATURE MINT'\n  ability-capsule         flag ID 1004: GB-Link Team card 'ABILITY CAPSULE'\n  poke-ball-changer       flag ID 1004: GB-Link Team card 'POKé BALL CHANGER'\n  pokemon-gender          flag ID 1005: GB-Link Team card 'POKéMON GENDER CHANGE'\n  pp-max                  flag ID 1007: GB-Link Team card 'PP MAX'\n  max-conditions          flag ID 1008: GB-Link Team card 'MAX CONDITIONS'\n  hidden-power            flag ID 1009: GB-Link Team card 'HIDDEN POWER & IVS'\n  hidden-power-type       flag ID 1017: GB-Link Team card 'HIDDEN POWER TYPE'\n  unown-letters           flag ID 1016: GB-Link Team card 'UNOWN LETTER CHANGER'\n  ev-training             flag ID 1010: GB-Link Team card 'EV TRAINING'\n  trainer-ids             flag ID 1011: GB-Link Team card 'TRAINER ID REVEAL'\n  rival-name              flag ID 1017: GB-Link Team card 'RENAME YOUR RIVAL'\n  gift-ribbons            flag ID 1018: GB-Link Team card 'GIFT RIBBONS'\n  fast-text               flag ID 1019: GB-Link Team card 'FAST TEXT'\n  move-tutor              flag ID 1000: GB-Link Team card 'MOVE RELEARNER & DELETER'\n  trade-evolution         flag ID 1001: GB-Link Team card 'TRADE EVOLUTION'\n  espeon-umbreon          flag ID 1003: GB-Link Team card 'ESPEON & UMBREON'\n  roamer                  flag ID 1002: GB-Link Team card 'ROAMING POKéMON'\n  legendary-respawn       flag ID 1003: GB-Link Team card 'LEGENDARY RESPAWN'\n  travel-anywhere         flag ID 1004: GB-Link Team card 'TRAVEL ANYWHERE'\n  pc-anywhere             flag ID 1006: GB-Link Team card 'PC ANYWHERE'\n  hm-moves                flag ID 1008: GB-Link Team card 'HM MOVES, NO HMs'\n  reusable-tms            flag ID 1005: GB-Link Team card 'REUSABLE TMs'\n  physical-special-split  flag ID 1002: GB-Link Team card 'GEN 4 PHYSICAL/SPECIAL SPLIT'\n  exp-share               flag ID 1007: GB-Link Team card 'EXP. SHARE FOR ALL'\n  box-eggs                flag ID 1010: GB-Link Team card 'POKéMON BOX EGGS'\n  colosseum-pikachu       flag ID 1011: GB-Link Team card 'COLOSSEUM PIKACHU'\n  ageto-celebi            flag ID 1012: GB-Link Team card 'AGETO CELEBI'\n  mattle-ho-oh            flag ID 1013: GB-Link Team card 'MATTLE HO-OH'\n  gift-box                flag ID 1001: GB-Link Team card 'GIFT BOX'\n  pocket-casino           flag ID 1009: GB-Link Team card 'POCKET CASINO'"
"core.help.rse-gift.gift-file" = "a complete FRLG .pokegift file, or a .wc3 Wonder Card"
"core.help.rse-gift.hunt-cap" = "with --gift rng-mon-hunt: how many states the stub may try before giving up and leaving the\nrng alone. The default is the smallest cap that finds one 99 times in 100."
"core.help.rse-gift.hunt-freeze-frames" = "with --gift rng-mon-hunt: how long the search may block the overworld in the worst case,\nin frames (default 900, about 15 s). The field engine has not returned while it\nsearches, so the player sees a still frame with the music playing; criteria whose\nsearch could take longer than this are refused before the card is built."
"core.help.rse-gift.hunt-iv" = "with --gift rng-mon-hunt: a floor under one IV, repeatable (speed=31, attack=20). The stats\nare hp, attack, defense, speed, sp_attack, sp_defense, named in the order the ROM draws them - which is not the order the summary\nscreen shows."
"core.help.rse-gift.hunt-level" = "with --gift rng-mon-hunt: the level that species appears at."
"core.help.rse-gift.hunt-nature" = "with --gift rng-mon-hunt: which natures the search will accept, comma separated\n(Hardy, Lonely, Brave, Adamant, Naughty, Bold, ...), or plain ids. Without this it takes any."
"core.help.rse-gift.hunt-species" = "with --gift rng-mon-hunt: what the stub's own `setwildbattle` puts on the screen. Neither the\nspecies nor the level is drawn from the rng, so this changes nothing about the\nsearch. The default is a level 5 MAGIKARP, which is catchable in one ball."
"core.help.rse-gift.id" = "decimal trainer ID, optionally followed by decimal secret ID"
"core.help.rse-gift.idle-timeout" = "stop after this many seconds without meaningful Switch traffic (join or Pia/RFU datagram); default: disabled"
"core.help.rse-gift.inter-block-gap-frames" = "diagnostic: idle VBlanks between the blocks of one Mystery Gift message; raise it if a run stalls part-way through a message (default is the built-in timing)"
"core.help.rse-gift.language" = "trainer language; defaults to DEFAULT_TRAINER"
"core.help.rse-gift.local-config" = "optional machine-local TOML (default: sibling host.local.toml)"
"core.help.rse-gift.news" = "Wonder News payload to distribute (Mystery Gift -> Wonder News -> Friend).\nAvailable news:\n  pokeldn  id 1: the plain proof-of-link news, one berry from the man in CERULEAN CITY\n  berry    id 2: a ten-line news that exercises the console's scroll indicator"
"core.help.rse-gift.news-id" = "override the news id (1..65535). A console keeps news only when it differs from what it already holds [IsWonderNewsSameAsSaved], so bump this to re-send the same text to the same console"
"core.help.rse-gift.no-accept-decrypted-ccmp" = "accept hardware-decrypted RX frames that retain their CCMP header and mic (TP-Link Archer T3U/rtw88_8822bu profile)"
"core.help.rse-gift.no-end-on-success" = "stop after the post-delivery RFU close sequence; used by the supervised run_mystery_gift.sh host"
"core.help.rse-gift.no-live" = "host for a real Switch"
"core.help.rse-gift.no-local-config" = "do not load host.local.toml"
"core.help.rse-gift.no-make-artifact" = "write an annotated listing for the exact Mystery Gift bytes that will be sent (default: disabled)"
"core.help.rse-gift.no-native-nonce-sequence" = "use FireRed's session-wide incrementing Pia nonce"
"core.help.rse-gift.no-session-response-first" = "send Session type 2 unicast before type 5 broadcast"
"core.help.rse-gift.no-skip-encryption" = "delegate transmit CCMP to mac80211/hardware; over-air frames remain encrypted"
"core.help.rse-gift.no-trust-pia" = "use Pia-backed send-once block delivery (recommended); --no-trust-pia enables diagnostic RFU retransmits"
"core.help.rse-gift.ot" = "trainer name; defaults to DEFAULT_TRAINER"
"core.help.rse-gift.over-ip" = "host for an emulated console over the LAN instead of over the radio: answer ldn_mitm discovery on port 11452 and carry Pia over UDP. Takes the address to advertise, or auto. Needs no adapter, no prod.keys and no root"
"core.help.rse-gift.password" = "LDN passphrase hex; default uses the frlg emulator value"
"core.help.rse-gift.phy" = "Wi-Fi phy; explicit phyN overrides --adapter"
"core.help.rse-gift.print-effective-config" = "print the safe effective host configuration and exit"
"core.help.rse-gift.questionnaire" = "require the console to be holding this four-word Easy Chat phrase in its Poke Mart\nquestionnaire before anything is sent [SVR_CHECK_QUESTIONNAIRE]. Each word is an\nEnglish word name, `species:N`, `move:N`, `group/index`, or a raw id. Word ids are\nper-language outside the species and move groups, so read the phrase off the target\nconsole first: every session logs the four ids it is holding."
"core.help.rse-gift.ram-script-block-repeat" = "fragment redundancy for the ident-25 delivery script alone (1-8, default 3); the console never reflects gift blocks, so a lost fragment cannot be resent"
"core.help.rse-gift.ram-script-map-group" = "which map group the RAM script binds to (a group_order index in\n[decomp:data/maps/map_groups.json]). The default is the player's house, where the\nmother never moves. Cerulean Cave B1F is group 1 map 74, and MEWTWO is object 3."
"core.help.rse-gift.ram-script-map-num" = "which map in that group the RAM script binds to."
"core.help.rse-gift.ram-script-object" = "which object event on that map. Local ids are assigned in map.json order and start\nat 1. Binding REPLACES that object's own script, so choose one that never moves."
"core.help.rse-gift.resident" = "with --buffer-script install-resident: the hook to install (turbo)"
"core.help.rse-gift.resident-param" = "with --buffer-script install-resident: a hook parameter, e.g. extra=6"
"core.help.rse-gift.save-backup" = "copy the console's whole 128 KB save into FILE (.sav); the console's save is not changed [docs/frlg_gift.md, Save backup and restore]"
"core.help.rse-gift.save-restore" = "write the .sav FILE onto the console: beside its newest save, every sector read back, then the game loads it and saves; anything short of that keeps the old save"
"core.help.rse-gift.save-resume-dir" = "with --save-backup: keep a backup the link cut short here; the next one goes on from it"
"core.help.rse-gift.scan-blocks" = "with --buffer-script memory-scan: 32-byte blocks scanned per frame, the budget the console's link has to live with (default 512, about 3 ms of a 16 ms frame)"
"core.help.rse-gift.scan-end" = "with --buffer-script memory-scan: one past the last address to read (default 0x09000000, the end of a 16 MB cartridge)"
"core.help.rse-gift.scan-max-calls" = "with --buffer-script memory-scan: the watchdog. A payload that never returns 1 hangs the Mystery Gift menu, so the scan gives up and answers after this many frames (default: what the range needs, plus two)"
"core.help.rse-gift.scan-start" = "with --buffer-script memory-scan: where to start, 32-byte aligned (default 0x08000000, the cartridge)"
"core.help.rse-gift.scan-word" = "with --buffer-script memory-scan: the 32-bit value to search for. The payload returns 0 to be called again next frame, so one run scans a whole range instead of the 1024 bytes a dump reads. Accepts 0x hex"
"core.help.rse-gift.scene" = "LDN scene; default is the known FRLG scene"
"core.help.rse-gift.sum-block" = "with --buffer-script rom-checksum: the block size, a power of two from 32; the range holds at most 128 blocks (default 0x20000)"
"core.help.rse-gift.sum-budget" = "with --buffer-script rom-checksum: 32-byte chunks summed per frame (default 512, no more load on the frame than memory-scan's 512)"
"core.help.rse-gift.sum-end" = "with --buffer-script rom-checksum: one past the last address to sum, a whole number of blocks after --sum-start (default 0x09000000)"
"core.help.rse-gift.sum-max-calls" = "with --buffer-script rom-checksum: the watchdog, in calls (= frames) (default: what the range needs, plus two)"
"core.help.rse-gift.sum-reference" = "with --buffer-script rom-checksum: the ROM image to compare the sums with (default: the image config.REFERENCE_ROMS names for the console's build)"
"core.help.rse-gift.sum-start" = "with --buffer-script rom-checksum: where to start, aligned to --sum-block (default 0x08000000, the cartridge)"
"core.help.rse-gift.svc-arg" = "with --buffer-script sloop-svc: r0, r1, r2, r3 in order (repeatable)"
"core.help.rse-gift.svc-bkpt" = "with --buffer-script sloop-svc: issue THUMB `bkpt N` instead of `swi N` (0xFF is the one the game never issues; needs --write-unsafe)"
"core.help.rse-gift.svc-data-in" = "with --buffer-script sloop-svc: point this register at the console's copy of the data"
"core.help.rse-gift.svc-hex" = "with --buffer-script sloop-svc: the data as hex instead"
"core.help.rse-gift.svc-number" = "with --buffer-script sloop-svc: a syscall, 0x40..0x62 (0x4D is the bad-word check); repeat for up to eight, issued in order in one session"
"core.help.rse-gift.svc-text" = "with --buffer-script sloop-svc: up to 256 bytes of UTF-8 data to send"
"core.help.rse-gift.table-blocks" = "with --buffer-script table-scan: 16-byte blocks scanned per frame (default 192, the same instruction load on the frame that memory-scan's 512 costs)"
"core.help.rse-gift.table-delta" = "with --buffer-script table-scan: what each word of the run must exceed the one before it by. 2 finds a table of pointers to consecutive u16s, which is what gSpecialVars is. Accepts 0x hex"
"core.help.rse-gift.table-end" = "with --buffer-script table-scan: one past the last address to read (default 0x09000000)"
"core.help.rse-gift.table-max-calls" = "with --buffer-script table-scan: the watchdog, in calls (= frames)"
"core.help.rse-gift.table-runlen" = "with --buffer-script table-scan: how many words in a row make a run worth reporting (default 12, the twelve gSpecialVar_0x8000..0x800B entries)"
"core.help.rse-gift.table-start" = "with --buffer-script table-scan: where to start, 16-byte aligned (default 0x08000000, the cartridge)"
"core.help.rse-gift.tick-hz" = "how many RFU slots a second the host emits (default 59.727, one per GBA VBlank). A real console pair runs far below this; lowering it slows every link step by the same factor."
"core.help.rse-gift.trace-address" = "with --buffer-script rng-trace: the word to sample once a frame. gRngValue is 0x03004220 on the French cartridges and 0x030042D0 on the English ones [builds.py]. Accepts 0x hex"
"core.help.rse-gift.trace-call" = "with --buffer-script rng-trace: a ROM function to call between the two reads of each sample, as a THUMB pointer (bit 0 set), or 0 for none. Random is 0x080486B1 French, 0x08048671 English; the recurrence between the two reads is then the proof that both addresses are what we say they are"
"core.help.rse-gift.trace-samples" = "with --buffer-script rng-trace: how many frames to sample, 1..96"
"core.help.rse-gift.verbose" = "show detailed protocol logging instead of milestones"
"core.help.rse-gift.version" = "game version; defaults to DEFAULT_TRAINER"
"core.help.rse-gift.write-hex" = "with --buffer-script save-write: the bytes to write, as hex"
"core.help.rse-gift.write-text" = "with --buffer-script save-write: ascii to write into the save block at --dump-offset. The same region is read back in the same run, so the answer is the proof. The console saves afterwards, so it reaches flash"
"core.help.rse-gift.write-unsafe" = "allow a save write outside struct SaveBlock2's never-read filler regions. This is the player's live save and the console commits it to flash; without this the write is refused"
"core.help.rse-trade-host.adapter" = "named Wi-Fi adapter profile used while --phy is auto"
"core.help.rse-trade-host.anim-delay" = "override the proven trade-animation frame delay"
"core.help.rse-trade-host.battle-fight" = "Union Room battle: pick fight with the first move instead of forfeiting at the first action prompt. Only the forfeit path has been proven on hardware"
"core.help.rse-trade-host.battle-move" = "Union Room battle with --battle-fight: which of the active Pokemon's four move slots to use. The default 0 is whatever move slot one holds, which for the tracked party is refresh and does no damage"
"core.help.rse-trade-host.board-level" = "override the level shown on the trading board"
"core.help.rse-trade-host.board-type" = "Union Room trading board: register the offered Pokemon (its species and level) and ask for this type in return, so the console's board lists us. The console must have a Pokemon of that type to start the trade"
"core.help.rse-trade-host.capture" = "record an optional JSONL protocol diagnostic"
"core.help.rse-trade-host.card-flag-id" = "the Wonder Card flag id our trainer card claims in the Union Room card exchange. A console holding the card with that id arms its own card counters, so a trade or cable-club battle with us increments them [union_room.c:1777]; default 0, which arms nothing"
"core.help.rse-trade-host.chat-file" = "Union Room chat: tail this file while the host runs and send every line appended to it, so the chat can be answered live instead of queued at launch"
"core.help.rse-trade-host.chat-message" = "Union Room chat: a line to send once the chat opens, repeatable. Up to 15 Gen-3 charmap characters each, the console's own keyboard limit and the width its chat line can draw; they go out one at a time, 1.5s apart"
"core.help.rse-trade-host.colosseum" = "host the cable-club COLOSSEUM instead of the trade centre (Pokemon Center 2F, third NPC -> Colosseum -> Single Battle -> JOIN). The entry is the trade centre's, so --card-flag-id still arms the console's card counters, and only this path increments its battlesWon [decomp:src/cable_club.c:792]. The whole party fights"
"core.help.rse-trade-host.comm-id" = "LDN local_communication_id in hexadecimal"
"core.help.rse-trade-host.config" = "shared host TOML (default: config/host.toml)"
"core.help.rse-trade-host.id" = "decimal trainer ID, optionally followed by decimal secret ID"
"core.help.rse-trade-host.language" = "trainer language; defaults to DEFAULT_TRAINER"
"core.help.rse-trade-host.link-player-idle-frames" = "diagnostic: quiet console polls after the LinkPlayer exchange before the leader starts the trainer-card exchange itself"
"core.help.rse-trade-host.local-config" = "optional machine-local TOML (default: sibling host.local.toml)"
"core.help.rse-trade-host.no-accept-decrypted-ccmp" = "accept hardware-decrypted RX frames that retain their CCMP header and mic (TP-Link Archer T3U/rtw88_8822bu profile)"
"core.help.rse-trade-host.no-live" = "host for a real Switch"
"core.help.rse-trade-host.no-local-config" = "do not load host.local.toml"
"core.help.rse-trade-host.no-native-nonce-sequence" = "use FireRed's session-wide incrementing Pia nonce"
"core.help.rse-trade-host.no-session-response-first" = "send Session type 2 unicast before type 5 broadcast"
"core.help.rse-trade-host.no-skip-encryption" = "delegate transmit CCMP to mac80211/hardware; over-air frames remain encrypted"
"core.help.rse-trade-host.no-trust-pia" = "use Pia-backed send-once block delivery (recommended); --no-trust-pia enables diagnostic RFU retransmits"
"core.help.rse-trade-host.online" = "trade with a player far away: their console's offer is offered here, and each side confirms only once both consoles have (docs/online.md)"
"core.help.rse-trade-host.online-code" = "the room both players enter; default the link code, and no code meets anyone else trading online without one"
"core.help.rse-trade-host.ot" = "trainer name; defaults to DEFAULT_TRAINER"
"core.help.rse-trade-host.out" = "received-mon output path"
"core.help.rse-trade-host.over-ip" = "host for an emulated console over the LAN instead of over the radio: answer ldn_mitm discovery on port 11452 and carry Pia over UDP. Takes the address to advertise, or auto. Needs no adapter, no prod.keys and no root"
"core.help.rse-trade-host.password" = "LDN passphrase hex; default uses the frlg emulator value"
"core.help.rse-trade-host.phy" = "Wi-Fi phy; explicit phyN overrides --adapter"
"core.help.rse-trade-host.player-ids-repeat-frames" = "diagnostic: consecutive polls the opening SEND_PLAYER_IDS burst occupies before the LinkPlayer block request; default is the built-in timing"
"core.help.rse-trade-host.print-effective-config" = "print the safe effective host configuration and exit"
"core.help.rse-trade-host.save-rounds" = "post-trade standby rounds before the parties are exchanged again; default 6, the Switch FireRed count. GBA Emerald runs 5 (docs/rse.md, After the trade)"
"core.help.rse-trade-host.scene" = "LDN scene; default is the known Direct Corner scene"
"core.help.rse-trade-host.slot" = "0-based host party slot offered for one trade (default: 1)"
"core.help.rse-trade-host.slots" = "comma-separated 0-based offered slots for multiple trades"
"core.help.rse-trade-host.tick-hz" = "how many RFU slots a second the host emits (default 59.727, one per GBA VBlank). A real console pair runs far below this; lowering it slows every link step by the same factor."
"core.help.rse-trade-host.union-room" = "host for the Union Room (the middle NPC on Pokemon Center 2F) instead of the trade centre's third NPC; use with --union-room-keepalive 120 and --board-type"
"core.help.rse-trade-host.union-room-activity" = "which activity --union-room advertises; default 'in-room', the bare IN_UNION_ROOM a console standing in the room connects to. 'search' is what the screen before the room looks for (untested)"
"core.help.rse-trade-host.union-room-battle" = "Union Room: accept the console's Combat instead of declining it. The console needs two non-egg party mons at level 30 or lower or it refuses on its own screen; it is master and runs the battle, we answer its controller commands"
"core.help.rse-trade-host.union-room-chat" = "Union Room: accept the console's 'Tchat' instead of declining it. Both sides send a join block, then the console's keyboard opens and every line it types is logged"
"core.help.rse-trade-host.union-room-keepalive" = "Union Room: re-present a parent NI_START for N VBlanks before the first UNI frame; the room child drops the link after five unanswered frames, and enters UNI 480 frames after the last NI_START. 120 is proven"
"core.help.rse-trade-host.verbose" = "show detailed protocol logging instead of milestones"
"core.help.rse-trade-host.version" = "game version; defaults to DEFAULT_TRAINER"
"core.help.rse-trade-join.anim-delay" = "frames to wait after START_TRADE before READY_FINISH (default 1935, the wire-measured wireless DoTradeAnim duration)"
"core.help.rse-trade-join.capture" = "(live) record every Pia datagram both directions to a .jsonl (incl. the SSID), so a live attempt can be decrypted/analysed offline"
"core.help.rse-trade-join.card-flag-id" = "the Wonder Card flag id our trainer card claims in the Union Room card exchange. A console holding the card with that id arms its own card counters, so a trade or cable-club battle with us increments them [union_room.c:1777]; default 0, which arms nothing"
"core.help.rse-trade-join.comm-id" = "LDN local_communication_id (hex) to join (live); if omitted, joins the only available network (scan logs candidates)"
"core.help.rse-trade-join.compress" = "zstd-compress out payloads"
"core.help.rse-trade-join.connect-id" = "(live) override the RFU connection id (hex, e.g. 7036) sent in the emulator connect ('C') frame. Default: a random nonzero id - any nonzero value works. --parent-pid is a deprecated alias."
"core.help.rse-trade-join.decline" = "decline at the confirm prompt (confirm-NO -> immediate READY_CANCEL, graceful cancel-to-leave) [trade.c:2019-2023]"
"core.help.rse-trade-join.id" = "decimal trainer ID, optionally followed by decimal secret ID"
"core.help.rse-trade-join.keys" = "Switch prod.keys (live); default: keys_path from config/host*.toml"
"core.help.rse-trade-join.language" = "trainer language; defaults to DEFAULT_TRAINER"
"core.help.rse-trade-join.live" = "join the real Switch"
"core.help.rse-trade-join.no-trust-pia" = "send each block fragment once (fire-and-forget) instead of the console's re-send-until-confirmed loop. Default off (faithful re-send): against the real client, a block streams in 1-2s with aggressive re-sends (~1.5x) and completes; trust_pia's send-once crawled (~0.1 frag/s) and never completed. trust_pia was a workaround for the 'flood', but that was the rtt deadlock (now fixed). --trust-pia re-enables send-once"
"core.help.rse-trade-join.ot" = "trainer name; defaults to DEFAULT_TRAINER"
"core.help.rse-trade-join.out" = "save the received mon here (trades=1); for trades>1 this is a base/prefix and each received mon is saved as <stem>_trade<k>_<species>.pk3"
"core.help.rse-trade-join.out-format" = "received mon format: pk3=decrypted (opens in PKHeX), ek3=encrypted/raw"
"core.help.rse-trade-join.out-size" = "received file size (100=party, 80=box)"
"core.help.rse-trade-join.pace-ms" = "live: minimum ms between two datagrams to the console, merging what is due into one (0 = off). See sim.PACE_MIN_GAP_MS for the measurement."
"core.help.rse-trade-join.password" = "LDN passphrase as hex (live); default = the built-in 64-byte emulator passphrase (shared by frlg/rse)"
"core.help.rse-trade-join.phy" = "wifi phy for the LDN join (live)"
"core.help.rse-trade-join.refuse-illegit" = "treat an offered Deoxys/Mew as PARTNER_MON_INVALID and cancel-to-leave (the host's illegitimate-legend gate; legitimacy is not offline-decodable) [trade.c:1965-1968]"
"core.help.rse-trade-join.replay" = "offline: replay a capture's host stream"
"core.help.rse-trade-join.self-id" = "wire mpId / gLocalLinkPlayerId (joiner = 1 = right seat; the only valid value - mpId 0 is the host/parent) [trade.c:1816; link_rfu_2.c:1633-1638]"
"core.help.rse-trade-join.slot" = "party slot to offer on the first round (default 1); the per-round default list grows ascending from here (or [0..N-1] for a full-party swap)"
"core.help.rse-trade-join.slots" = "explicit comma list of 0-based party slots to offer, one per trade (len must == --trades, distinct, each < party size), e.g. --slots 0,2,4"
"core.help.rse-trade-join.trades" = "number of sequential trades to perform, 1..6 (default 1; 6 = swap both entire parties). After the Nth trade the sim cancels-to-leave."
"core.help.rse-trade-join.version" = "game version; defaults to DEFAULT_TRAINER"
"core.help.rse-trade-online.adapter" = "named Wi-Fi adapter profile used while --phy is auto"
"core.help.rse-trade-online.anim-delay" = "override the proven trade-animation frame delay"
"core.help.rse-trade-online.battle-fight" = "Union Room battle: pick fight with the first move instead of forfeiting at the first action prompt. Only the forfeit path has been proven on hardware"
"core.help.rse-trade-online.battle-move" = "Union Room battle with --battle-fight: which of the active Pokemon's four move slots to use. The default 0 is whatever move slot one holds, which for the tracked party is refresh and does no damage"
"core.help.rse-trade-online.board-level" = "override the level shown on the trading board"
"core.help.rse-trade-online.board-type" = "Union Room trading board: register the offered Pokemon (its species and level) and ask for this type in return, so the console's board lists us. The console must have a Pokemon of that type to start the trade"
"core.help.rse-trade-online.capture" = "record an optional JSONL protocol diagnostic"
"core.help.rse-trade-online.card-flag-id" = "the Wonder Card flag id our trainer card claims in the Union Room card exchange. A console holding the card with that id arms its own card counters, so a trade or cable-club battle with us increments them [union_room.c:1777]; default 0, which arms nothing"
"core.help.rse-trade-online.chat-file" = "Union Room chat: tail this file while the host runs and send every line appended to it, so the chat can be answered live instead of queued at launch"
"core.help.rse-trade-online.chat-message" = "Union Room chat: a line to send once the chat opens, repeatable. Up to 15 Gen-3 charmap characters each, the console's own keyboard limit and the width its chat line can draw; they go out one at a time, 1.5s apart"
"core.help.rse-trade-online.colosseum" = "host the cable-club COLOSSEUM instead of the trade centre (Pokemon Center 2F, third NPC -> Colosseum -> Single Battle -> JOIN). The entry is the trade centre's, so --card-flag-id still arms the console's card counters, and only this path increments its battlesWon [decomp:src/cable_club.c:792]. The whole party fights"
"core.help.rse-trade-online.comm-id" = "LDN local_communication_id in hexadecimal"
"core.help.rse-trade-online.config" = "shared host TOML (default: config/host.toml)"
"core.help.rse-trade-online.id" = "decimal trainer ID, optionally followed by decimal secret ID"
"core.help.rse-trade-online.language" = "trainer language; defaults to DEFAULT_TRAINER"
"core.help.rse-trade-online.link-player-idle-frames" = "diagnostic: quiet console polls after the LinkPlayer exchange before the leader starts the trainer-card exchange itself"
"core.help.rse-trade-online.local-config" = "optional machine-local TOML (default: sibling host.local.toml)"
"core.help.rse-trade-online.no-accept-decrypted-ccmp" = "accept hardware-decrypted RX frames that retain their CCMP header and mic (TP-Link Archer T3U/rtw88_8822bu profile)"
"core.help.rse-trade-online.no-live" = "host for a real Switch"
"core.help.rse-trade-online.no-local-config" = "do not load host.local.toml"
"core.help.rse-trade-online.no-native-nonce-sequence" = "use FireRed's session-wide incrementing Pia nonce"
"core.help.rse-trade-online.no-session-response-first" = "send Session type 2 unicast before type 5 broadcast"
"core.help.rse-trade-online.no-skip-encryption" = "delegate transmit CCMP to mac80211/hardware; over-air frames remain encrypted"
"core.help.rse-trade-online.no-trust-pia" = "use Pia-backed send-once block delivery (recommended); --no-trust-pia enables diagnostic RFU retransmits"
"core.help.rse-trade-online.online" = "trade with a player far away: their console's offer is offered here, and each side confirms only once both consoles have (docs/online.md)"
"core.help.rse-trade-online.online-code" = "the room both players enter; default the link code, and no code meets anyone else trading online without one"
"core.help.rse-trade-online.ot" = "trainer name; defaults to DEFAULT_TRAINER"
"core.help.rse-trade-online.out" = "received-mon output path"
"core.help.rse-trade-online.over-ip" = "host for an emulated console over the LAN instead of over the radio: answer ldn_mitm discovery on port 11452 and carry Pia over UDP. Takes the address to advertise, or auto. Needs no adapter, no prod.keys and no root"
"core.help.rse-trade-online.password" = "LDN passphrase hex; default uses the frlg emulator value"
"core.help.rse-trade-online.phy" = "Wi-Fi phy; explicit phyN overrides --adapter"
"core.help.rse-trade-online.player-ids-repeat-frames" = "diagnostic: consecutive polls the opening SEND_PLAYER_IDS burst occupies before the LinkPlayer block request; default is the built-in timing"
"core.help.rse-trade-online.print-effective-config" = "print the safe effective host configuration and exit"
"core.help.rse-trade-online.save-rounds" = "post-trade standby rounds before the parties are exchanged again; default 6, the Switch FireRed count. GBA Emerald runs 5 (docs/rse.md, After the trade)"
"core.help.rse-trade-online.scene" = "LDN scene; default is the known Direct Corner scene"
"core.help.rse-trade-online.slot" = "0-based host party slot offered for one trade (default: 1)"
"core.help.rse-trade-online.slots" = "comma-separated 0-based offered slots for multiple trades"
"core.help.rse-trade-online.tick-hz" = "how many RFU slots a second the host emits (default 59.727, one per GBA VBlank). A real console pair runs far below this; lowering it slows every link step by the same factor."
"core.help.rse-trade-online.union-room" = "host for the Union Room (the middle NPC on Pokemon Center 2F) instead of the trade centre's third NPC; use with --union-room-keepalive 120 and --board-type"
"core.help.rse-trade-online.union-room-activity" = "which activity --union-room advertises; default 'in-room', the bare IN_UNION_ROOM a console standing in the room connects to. 'search' is what the screen before the room looks for (untested)"
"core.help.rse-trade-online.union-room-battle" = "Union Room: accept the console's Combat instead of declining it. The console needs two non-egg party mons at level 30 or lower or it refuses on its own screen; it is master and runs the battle, we answer its controller commands"
"core.help.rse-trade-online.union-room-chat" = "Union Room: accept the console's 'Tchat' instead of declining it. Both sides send a join block, then the console's keyboard opens and every line it types is logged"
"core.help.rse-trade-online.union-room-keepalive" = "Union Room: re-present a parent NI_START for N VBlanks before the first UNI frame; the room child drops the link after five unanswered frames, and enters UNI 480 frames after the last NI_START. 120 is proven"
"core.help.rse-trade-online.verbose" = "show detailed protocol logging instead of milestones"
"core.help.rse-trade-online.version" = "game version; defaults to DEFAULT_TRAINER"
"core.help.sv-circle-encounters-join.ack-dest-bits" = "the reliable header's destination bits; 3 adds the four-byte bitmap a retail station sends, 0 leaves the nine-byte header"
"core.help.sv-circle-encounters-join.ack-entries" = "entries in the ack payload; a retail station sends four"
"core.help.sv-circle-encounters-join.ack-flags" = "the Pia message flags on our bulk acks; 0xa0 is what both retail stations send, and bit 5 compresses the message body"
"core.help.sv-circle-encounters-join.ack-highest" = "ack one past the highest id received, with no mask, instead of the contiguous run and a mask as a retail station does (docs/sv.md)"
"core.help.sv-circle-encounters-join.ack-period" = "seconds between the periodic bulk acks on every stream the host uses"
"core.help.sv-circle-encounters-join.ack-sweep" = "rotate every combination of --ack-flags, --ack-entries and --ack-dest-bits through the seat, one per --ack-sweep-period, and print each as it goes live. One seat then says which shape the guest parses"
"core.help.sv-circle-encounters-join.ack-sweep-period" = "seconds each sweep variant stays live"
"core.help.sv-circle-encounters-join.announce-timeout" = "end a seat whose console has not announced on 0x80 port 2 this many seconds after the seat, and go back to scanning. A seat can carry every stream to completion and never be announced (docs/sv.md, Unresolved); board seats that traded announced at 5.8 and 7.7 s"
"core.help.sv-circle-encounters-join.answer-migration" = "answer the host's type-7 leave-with-host-migration with a type-8 ack, telling it we accept the host role it is handing over"
"core.help.sv-circle-encounters-join.bbq-clear" = "the BP, 1 to 9999999, --circle-task bp gives"
"core.help.sv-circle-encounters-join.capture" = "write every datagram here as JSON lines"
"core.help.sv-circle-encounters-join.circle-task" = "with --union-circle, a task after which our player leaves the circle and the run ends: snacksworth gives the host every Team and solo clear it lacks for all of Snacksworth's legendaries, one a second from the start demo's end; bp a clear paying the host the --bbq-clear BP"
"core.help.sv-circle-encounters-join.code" = "join only a console searching with this Link Code; empty takes any"
"core.help.sv-circle-encounters-join.comm-id" = "local communication id to join, hex; default is either cartridge's"
"core.help.sv-circle-encounters-join.commit-delay" = "seconds after the host's confirmation before the joiner commits; the pair's joiner committed 1.5 s after its own confirmation and its host answered in kind"
"core.help.sv-circle-encounters-join.confirm-delay" = "seconds after the host's confirmation before the joiner's own"
"core.help.sv-circle-encounters-join.connect-timeout" = "seconds to allow the association itself; a console whose host phase ends mid-connect leaves ldn.connect blocked with no timeout of its own"
"core.help.sv-circle-encounters-join.dwell" = "seconds per channel in the scan; the console's hosting window is a few seconds, so a long dwell misses it"
"core.help.sv-circle-encounters-join.follow-host" = "with --union-circle: our player copies the host's as it moves, its animations and its ride, keeping 5 m from it and facing it"
"core.help.sv-circle-encounters-join.fresh-pid" = "offer each record under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again"
"core.help.sv-circle-encounters-join.game-channel" = "announce our own channel table on 0x7c. A station opens the game's channel by sending the same 31-byte table its peer sends on port 1, an open on port 2, and a mirror of every later table update; the peer sends the game on port 0 only once ours is announced (docs/sv.md)"
"core.help.sv-circle-encounters-join.hold" = "how long to stay in one joined session before scanning again"
"core.help.sv-circle-encounters-join.host-ip" = "--ip-join: the emulator's address"
"core.help.sv-circle-encounters-join.ip-join" = "join an emulated console over the LAN through ldn_mitm instead of the radio: no root, no phy, no prod.keys"
"core.help.sv-circle-encounters-join.join-delay" = "hold the Session join request this long after the seat. A console whose WaitMember (3 to 4 s) ends unjoined leaves with host migration, so a join accepted in its leave wait draws the type 7 (docs/sv.md, What decides a seat)"
"core.help.sv-circle-encounters-join.join-dst-var" = "the packet header's destination variable id on the join request: 0, which is what a joining Arceus uses, or the host's own"
"core.help.sv-circle-encounters-join.join-flags" = "message flags on the join request; a joining Arceus sends 0x01, skip the source check, on every repeat of it"
"core.help.sv-circle-encounters-join.join-player-id" = "the 16-byte player id in the join request: 'arceus' (1 then 0 as two big-endian u64, what a retail Arceus states), 'random', 'high' (random with a leading 0xff) or 32 hex digits. A Scarlet host's own is 10047bd4a25543e057cee5c71ab1f2a2 (sv18)"
"core.help.sv-circle-encounters-join.join-player-name" = "the player name in the join request's one player record; a retail console's is a single space"
"core.help.sv-circle-encounters-join.join-repeat" = "with --session-join, re-send it every N seconds (0 sends it once)"
"core.help.sv-circle-encounters-join.leave-on-migration" = "end the seat this many seconds after the console asks us to take the host role (Session type 7), and go back to scanning. A console that sent it sent nothing but NetStartHostMigration afterwards in the seats measured; without this the run holds the seat for the whole --hold"
"core.help.sv-circle-encounters-join.mac" = "set the adapter's MAC before associating, e.g. 48:f1:eb:11:22:33. Pia derives a station's constant id from its MAC, and the two consoles' are Nintendo OUIs where the adapter's is not. The driver reload in the launcher puts the adapter's own address back"
"core.help.sv-circle-encounters-join.mirror-records" = "send every record the host puts on 0x81 port 0 back on port 1 as our own, in order. A retail joiner answers the host's records with a set of its own; this fills that set with records the game itself composed"
"core.help.sv-circle-encounters-join.name" = "the LDN node name we publish"
"core.help.sv-circle-encounters-join.net-ack" = "answer the host's Net 0x11 with the 0x12 ack. A retail joiner does not, and the ack makes the console ask for host migration instead (sv08)"
"core.help.sv-circle-encounters-join.no-ack" = "do not acknowledge reliable streams"
"core.help.sv-circle-encounters-join.no-channel-ack" = "do not acknowledge the host's messages on the game's reliable channel 0x7c"
"core.help.sv-circle-encounters-join.no-clock" = "do not send the Clone Clock request. A seated joiner sends eighteen zero bytes on 0x77 before anything else and the host answers"
"core.help.sv-circle-encounters-join.no-identity" = "send no station identity unless --record-set or --send-on-open names one; by default the recorded one in pokeldn.sv.reference"
"core.help.sv-circle-encounters-join.no-rtt" = "do not answer RTT requests"
"core.help.sv-circle-encounters-join.no-take-host" = "when the console hands us the host role before the announcement (not a player leaving), leave its network and become the host with bin/sv_host.py on the same channel and code, as bin/pla_join.py does; needs --answer-migration"
"core.help.sv-circle-encounters-join.no-update-ack" = "do not answer a Session type-5 station update with the type 6"
"core.help.sv-circle-encounters-join.offer-after-open" = "seconds after the host's key-0x80 open at which the joiner offers first, before the host does; without it the joiner answers the host's offer"
"core.help.sv-circle-encounters-join.offer-dump" = "write the offered record's 348-byte body to this file as hex and exit, which needs no radio"
"core.help.sv-circle-encounters-join.offer-out" = "a file to write the host's own offer to, the 348-byte body of its 80 00 02 00 message, as hex text"
"core.help.sv-circle-encounters-join.offer-set" = "a field written into the offered record before it is sealed, by its pokeldn.sv.pokemon name: nickname=SHINY, species=906, ivs=31,31,31,31,31,31, trainer_id=12345, ball=4. Repeatable, and `shiny` alone rolls a personality value shiny against the record's own ids"
"core.help.sv-circle-encounters-join.open-delay" = "seconds after the join response (after the seat without --session-join) before the eleven acks and the two stream opens go out; a retail joiner opens 0.75 s after its join"
"core.help.sv-circle-encounters-join.our-ip" = "--ip-join: our own address"
"core.help.sv-circle-encounters-join.platform" = "the station platform byte we publish; 1 is what a Switch 2 sends"
"core.help.sv-circle-encounters-join.port2-now" = "send the game's type-3 join on 0x7c port 2 with the channel table, rather than in answer to the console's type-7 announcement on 0x80 port 2. A pair's joiner answers the announcement (docs/sv.md, Port 2)"
"core.help.sv-circle-encounters-join.print-packets" = "print every packet in and out; the --capture file keeps them either way"
"core.help.sv-circle-encounters-join.quiet-seat" = "end a seat on which the console has sent nothing at all for this many seconds, and go back to scanning. An association taken outside the console's host phase carries no traffic; without this the run holds it for the whole --hold"
"core.help.sv-circle-encounters-join.raid-pokemon" = "join the Tera Raid lobby a console hosts and bring this party record, legal per PKHeX; our player readies, answers the start and leaves when the battle begins, its Pokemon fighting on for the console"
"core.help.sv-circle-encounters-join.raid-ready-delay" = "seconds in the raid lobby before our player readies"
"core.help.sv-circle-encounters-join.record-delay" = "seconds after the seat before the first identity record goes out"
"core.help.sv-circle-encounters-join.record-set" = "send this directory's records as our own on 0x81 port 1, in sequence order, in place of --mirror-records. `scratchpad/sv_extract_records.py` writes one from a station's own log, so a whole real identity can be replayed rather than the host's mirrored back; by default the recorded set in pokeldn.sv.reference"
"core.help.sv-circle-encounters-join.repeat-ack-gap" = "acknowledge a record already held at most once per SECONDS per stream; a new record is acked at once. 0 acks every repeat (docs/sv.md)"
"core.help.sv-circle-encounters-join.rtt-delay" = "answer each RTT request SECONDS late; RTT samples enable the host's retransmission timer (docs/sv.md)"
"core.help.sv-circle-encounters-join.rtt-period" = "seconds between our own RTT requests (0 sends none)"
"core.help.sv-circle-encounters-join.scan-only" = "report what the console advertises and join nothing"
"core.help.sv-circle-encounters-join.scan-timeout" = "--ip-join: seconds to wait for one ldn_mitm scan answer"
"core.help.sv-circle-encounters-join.scene-id" = "join only a network of this LDN scene: 4 a Link Trade, 7 a Tera Raid"
"core.help.sv-circle-encounters-join.seconds" = "how long to keep trying"
"core.help.sv-circle-encounters-join.send-on-open" = "DELAY:PROTO:PORT:HEX[:z][:start|:end], sent that many seconds after the host announces key 0x80 open on 0x7c port 1. A station's identity is four messages on 0x7c port 0, the two fragments twice, and nothing sent on that port before the announcement reaches the game; repeatable; by default the identity fragments in pokeldn.sv.reference"
"core.help.sv-circle-encounters-join.send-record" = "after the seat, send this 1395-byte identity record on 0x81 port 1 (our station stream) as the game's data exchange, retransmitting until the host acknowledges it. A retail joiner sends its own identity here"
"core.help.sv-circle-encounters-join.session-join" = "send the Pia Session join request in the retail layout (docs/sv.md, The Session join request): ten protocols with their versions, a four-byte nonce, both location ids, a seven-byte station address and one player record. A mesh join is unicast, so no passive capture shows a retail one"
"core.help.sv-circle-encounters-join.spawn" = "with --union-circle: 10 s after the circle's start demo has ended, keep 3 wild Pokemon of this species (dev number) out 15 to 25 m from the host's player, as a console shares its own: one the host battles, removes or goes more than 50 m from comes again near it"
"core.help.sv-circle-encounters-join.spawn-ability" = "ability slot, 2 the hidden ability (default 0 or 1 at random, as a wild one's)"
"core.help.sv-circle-encounters-join.spawn-gender" = "1 female (default 0)"
"core.help.sv-circle-encounters-join.spawn-item" = "held item id"
"core.help.sv-circle-encounters-join.spawn-ivs" = "six IVs 0 to 31 (default each random, as a wild one's)"
"core.help.sv-circle-encounters-join.spawn-legal" = "with --spawn: spawn only while the host stands in an area where PKHeX accepts that spawn caught, found from the wild Pokemon the host's console shares (it shares them once our player is near: --follow-host)"
"core.help.sv-circle-encounters-join.spawn-nature" = "0 to 24 (default random)"
"core.help.sv-circle-encounters-join.spawn-scale" = "0 to 255 (default random)"
"core.help.sv-circle-encounters-join.spawn-tera" = "Tera Type, 0 Normal to 17 Fairy in type order (default %(default)s)"
"core.help.sv-circle-encounters-join.stay-on-host-migration" = "hold the seat after the console's NetStartHostMigration (Net 0x40). By default the joiner leaves on the first one: the console is destroying its network and resends it until every client has left, for up to 4 s"
"core.help.sv-circle-encounters-join.trade-offer" = "a file holding the 348-byte record this joiner offers (raw, or hex text; a 352-byte game message is stripped of its header). With it the joiner answers the host's offer with its own, confirms, commits, and echoes the four exchange steps the way a pair's joiner does (pokeldn.sv.trade). Repeatable: the second and later records are offered in the same seat, one per trade, as each trade closes"
"core.help.sv-circle-encounters-join.trainer-name" = "the player name record 1 of our identity carries, the one the trade screen shows"
"core.help.sv-circle-encounters-join.unicast" = "send to the host's address instead of the LDN broadcast address. Both retail stations broadcast every Pia packet (sv11), and a broadcast needs no ARP resolution of the peer"
"core.help.sv-circle-encounters-join.union-circle" = "join the Union Circle a console hosts, as a raid guest joins a raid: take the seat, send our identity, open the game's channel, answer the host's start, put our player on the field where the host's stands and hold it for --hold (docs/sv_union_circle.md)"
"core.help.sv-circle-encounters-join.verbose-circle" = "with --union-circle: print each circle message we send and each step of the area search too; the --capture file keeps the steps either way"
"core.help.sv-circle-encounters-join.verbose-rtt" = "print the RTT traffic too"
"core.help.sv-circle-join.ack-dest-bits" = "the reliable header's destination bits; 3 adds the four-byte bitmap a retail station sends, 0 leaves the nine-byte header"
"core.help.sv-circle-join.ack-entries" = "entries in the ack payload; a retail station sends four"
"core.help.sv-circle-join.ack-flags" = "the Pia message flags on our bulk acks; 0xa0 is what both retail stations send, and bit 5 compresses the message body"
"core.help.sv-circle-join.ack-highest" = "ack one past the highest id received, with no mask, instead of the contiguous run and a mask as a retail station does (docs/sv.md)"
"core.help.sv-circle-join.ack-period" = "seconds between the periodic bulk acks on every stream the host uses"
"core.help.sv-circle-join.ack-sweep" = "rotate every combination of --ack-flags, --ack-entries and --ack-dest-bits through the seat, one per --ack-sweep-period, and print each as it goes live. One seat then says which shape the guest parses"
"core.help.sv-circle-join.ack-sweep-period" = "seconds each sweep variant stays live"
"core.help.sv-circle-join.announce-timeout" = "end a seat whose console has not announced on 0x80 port 2 this many seconds after the seat, and go back to scanning. A seat can carry every stream to completion and never be announced (docs/sv.md, Unresolved); board seats that traded announced at 5.8 and 7.7 s"
"core.help.sv-circle-join.answer-migration" = "answer the host's type-7 leave-with-host-migration with a type-8 ack, telling it we accept the host role it is handing over"
"core.help.sv-circle-join.bbq-clear" = "the BP, 1 to 9999999, --circle-task bp gives"
"core.help.sv-circle-join.capture" = "write every datagram here as JSON lines"
"core.help.sv-circle-join.circle-task" = "with --union-circle, a task after which our player leaves the circle and the run ends: snacksworth gives the host every Team and solo clear it lacks for all of Snacksworth's legendaries, one a second from the start demo's end; bp a clear paying the host the --bbq-clear BP"
"core.help.sv-circle-join.code" = "join only a console searching with this Link Code; empty takes any"
"core.help.sv-circle-join.comm-id" = "local communication id to join, hex; default is either cartridge's"
"core.help.sv-circle-join.commit-delay" = "seconds after the host's confirmation before the joiner commits; the pair's joiner committed 1.5 s after its own confirmation and its host answered in kind"
"core.help.sv-circle-join.confirm-delay" = "seconds after the host's confirmation before the joiner's own"
"core.help.sv-circle-join.connect-timeout" = "seconds to allow the association itself; a console whose host phase ends mid-connect leaves ldn.connect blocked with no timeout of its own"
"core.help.sv-circle-join.dwell" = "seconds per channel in the scan; the console's hosting window is a few seconds, so a long dwell misses it"
"core.help.sv-circle-join.follow-host" = "with --union-circle: our player copies the host's as it moves, its animations and its ride, keeping 5 m from it and facing it"
"core.help.sv-circle-join.fresh-pid" = "offer each record under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again"
"core.help.sv-circle-join.game-channel" = "announce our own channel table on 0x7c. A station opens the game's channel by sending the same 31-byte table its peer sends on port 1, an open on port 2, and a mirror of every later table update; the peer sends the game on port 0 only once ours is announced (docs/sv.md)"
"core.help.sv-circle-join.hold" = "how long to stay in one joined session before scanning again"
"core.help.sv-circle-join.host-ip" = "--ip-join: the emulator's address"
"core.help.sv-circle-join.ip-join" = "join an emulated console over the LAN through ldn_mitm instead of the radio: no root, no phy, no prod.keys"
"core.help.sv-circle-join.join-delay" = "hold the Session join request this long after the seat. A console whose WaitMember (3 to 4 s) ends unjoined leaves with host migration, so a join accepted in its leave wait draws the type 7 (docs/sv.md, What decides a seat)"
"core.help.sv-circle-join.join-dst-var" = "the packet header's destination variable id on the join request: 0, which is what a joining Arceus uses, or the host's own"
"core.help.sv-circle-join.join-flags" = "message flags on the join request; a joining Arceus sends 0x01, skip the source check, on every repeat of it"
"core.help.sv-circle-join.join-player-id" = "the 16-byte player id in the join request: 'arceus' (1 then 0 as two big-endian u64, what a retail Arceus states), 'random', 'high' (random with a leading 0xff) or 32 hex digits. A Scarlet host's own is 10047bd4a25543e057cee5c71ab1f2a2 (sv18)"
"core.help.sv-circle-join.join-player-name" = "the player name in the join request's one player record; a retail console's is a single space"
"core.help.sv-circle-join.join-repeat" = "with --session-join, re-send it every N seconds (0 sends it once)"
"core.help.sv-circle-join.leave-on-migration" = "end the seat this many seconds after the console asks us to take the host role (Session type 7), and go back to scanning. A console that sent it sent nothing but NetStartHostMigration afterwards in the seats measured; without this the run holds the seat for the whole --hold"
"core.help.sv-circle-join.mac" = "set the adapter's MAC before associating, e.g. 48:f1:eb:11:22:33. Pia derives a station's constant id from its MAC, and the two consoles' are Nintendo OUIs where the adapter's is not. The driver reload in the launcher puts the adapter's own address back"
"core.help.sv-circle-join.mirror-records" = "send every record the host puts on 0x81 port 0 back on port 1 as our own, in order. A retail joiner answers the host's records with a set of its own; this fills that set with records the game itself composed"
"core.help.sv-circle-join.name" = "the LDN node name we publish"
"core.help.sv-circle-join.net-ack" = "answer the host's Net 0x11 with the 0x12 ack. A retail joiner does not, and the ack makes the console ask for host migration instead (sv08)"
"core.help.sv-circle-join.no-ack" = "do not acknowledge reliable streams"
"core.help.sv-circle-join.no-channel-ack" = "do not acknowledge the host's messages on the game's reliable channel 0x7c"
"core.help.sv-circle-join.no-clock" = "do not send the Clone Clock request. A seated joiner sends eighteen zero bytes on 0x77 before anything else and the host answers"
"core.help.sv-circle-join.no-identity" = "send no station identity unless --record-set or --send-on-open names one; by default the recorded one in pokeldn.sv.reference"
"core.help.sv-circle-join.no-rtt" = "do not answer RTT requests"
"core.help.sv-circle-join.no-take-host" = "when the console hands us the host role before the announcement (not a player leaving), leave its network and become the host with bin/sv_host.py on the same channel and code, as bin/pla_join.py does; needs --answer-migration"
"core.help.sv-circle-join.no-update-ack" = "do not answer a Session type-5 station update with the type 6"
"core.help.sv-circle-join.offer-after-open" = "seconds after the host's key-0x80 open at which the joiner offers first, before the host does; without it the joiner answers the host's offer"
"core.help.sv-circle-join.offer-dump" = "write the offered record's 348-byte body to this file as hex and exit, which needs no radio"
"core.help.sv-circle-join.offer-out" = "a file to write the host's own offer to, the 348-byte body of its 80 00 02 00 message, as hex text"
"core.help.sv-circle-join.offer-set" = "a field written into the offered record before it is sealed, by its pokeldn.sv.pokemon name: nickname=SHINY, species=906, ivs=31,31,31,31,31,31, trainer_id=12345, ball=4. Repeatable, and `shiny` alone rolls a personality value shiny against the record's own ids"
"core.help.sv-circle-join.open-delay" = "seconds after the join response (after the seat without --session-join) before the eleven acks and the two stream opens go out; a retail joiner opens 0.75 s after its join"
"core.help.sv-circle-join.our-ip" = "--ip-join: our own address"
"core.help.sv-circle-join.platform" = "the station platform byte we publish; 1 is what a Switch 2 sends"
"core.help.sv-circle-join.port2-now" = "send the game's type-3 join on 0x7c port 2 with the channel table, rather than in answer to the console's type-7 announcement on 0x80 port 2. A pair's joiner answers the announcement (docs/sv.md, Port 2)"
"core.help.sv-circle-join.print-packets" = "print every packet in and out; the --capture file keeps them either way"
"core.help.sv-circle-join.quiet-seat" = "end a seat on which the console has sent nothing at all for this many seconds, and go back to scanning. An association taken outside the console's host phase carries no traffic; without this the run holds it for the whole --hold"
"core.help.sv-circle-join.raid-pokemon" = "join the Tera Raid lobby a console hosts and bring this party record, legal per PKHeX; our player readies, answers the start and leaves when the battle begins, its Pokemon fighting on for the console"
"core.help.sv-circle-join.raid-ready-delay" = "seconds in the raid lobby before our player readies"
"core.help.sv-circle-join.record-delay" = "seconds after the seat before the first identity record goes out"
"core.help.sv-circle-join.record-set" = "send this directory's records as our own on 0x81 port 1, in sequence order, in place of --mirror-records. `scratchpad/sv_extract_records.py` writes one from a station's own log, so a whole real identity can be replayed rather than the host's mirrored back; by default the recorded set in pokeldn.sv.reference"
"core.help.sv-circle-join.repeat-ack-gap" = "acknowledge a record already held at most once per SECONDS per stream; a new record is acked at once. 0 acks every repeat (docs/sv.md)"
"core.help.sv-circle-join.rtt-delay" = "answer each RTT request SECONDS late; RTT samples enable the host's retransmission timer (docs/sv.md)"
"core.help.sv-circle-join.rtt-period" = "seconds between our own RTT requests (0 sends none)"
"core.help.sv-circle-join.scan-only" = "report what the console advertises and join nothing"
"core.help.sv-circle-join.scan-timeout" = "--ip-join: seconds to wait for one ldn_mitm scan answer"
"core.help.sv-circle-join.scene-id" = "join only a network of this LDN scene: 4 a Link Trade, 7 a Tera Raid"
"core.help.sv-circle-join.seconds" = "how long to keep trying"
"core.help.sv-circle-join.send-on-open" = "DELAY:PROTO:PORT:HEX[:z][:start|:end], sent that many seconds after the host announces key 0x80 open on 0x7c port 1. A station's identity is four messages on 0x7c port 0, the two fragments twice, and nothing sent on that port before the announcement reaches the game; repeatable; by default the identity fragments in pokeldn.sv.reference"
"core.help.sv-circle-join.send-record" = "after the seat, send this 1395-byte identity record on 0x81 port 1 (our station stream) as the game's data exchange, retransmitting until the host acknowledges it. A retail joiner sends its own identity here"
"core.help.sv-circle-join.session-join" = "send the Pia Session join request in the retail layout (docs/sv.md, The Session join request): ten protocols with their versions, a four-byte nonce, both location ids, a seven-byte station address and one player record. A mesh join is unicast, so no passive capture shows a retail one"
"core.help.sv-circle-join.spawn" = "with --union-circle: 10 s after the circle's start demo has ended, keep 3 wild Pokemon of this species (dev number) out 15 to 25 m from the host's player, as a console shares its own: one the host battles, removes or goes more than 50 m from comes again near it"
"core.help.sv-circle-join.spawn-ability" = "ability slot, 2 the hidden ability (default 0 or 1 at random, as a wild one's)"
"core.help.sv-circle-join.spawn-gender" = "1 female (default 0)"
"core.help.sv-circle-join.spawn-item" = "held item id"
"core.help.sv-circle-join.spawn-ivs" = "six IVs 0 to 31 (default each random, as a wild one's)"
"core.help.sv-circle-join.spawn-legal" = "with --spawn: spawn only while the host stands in an area where PKHeX accepts that spawn caught, found from the wild Pokemon the host's console shares (it shares them once our player is near: --follow-host)"
"core.help.sv-circle-join.spawn-nature" = "0 to 24 (default random)"
"core.help.sv-circle-join.spawn-scale" = "0 to 255 (default random)"
"core.help.sv-circle-join.spawn-tera" = "Tera Type, 0 Normal to 17 Fairy in type order (default %(default)s)"
"core.help.sv-circle-join.stay-on-host-migration" = "hold the seat after the console's NetStartHostMigration (Net 0x40). By default the joiner leaves on the first one: the console is destroying its network and resends it until every client has left, for up to 4 s"
"core.help.sv-circle-join.trade-offer" = "a file holding the 348-byte record this joiner offers (raw, or hex text; a 352-byte game message is stripped of its header). With it the joiner answers the host's offer with its own, confirms, commits, and echoes the four exchange steps the way a pair's joiner does (pokeldn.sv.trade). Repeatable: the second and later records are offered in the same seat, one per trade, as each trade closes"
"core.help.sv-circle-join.trainer-name" = "the player name record 1 of our identity carries, the one the trade screen shows"
"core.help.sv-circle-join.unicast" = "send to the host's address instead of the LDN broadcast address. Both retail stations broadcast every Pia packet (sv11), and a broadcast needs no ARP resolution of the peer"
"core.help.sv-circle-join.union-circle" = "join the Union Circle a console hosts, as a raid guest joins a raid: take the seat, send our identity, open the game's channel, answer the host's start, put our player on the field where the host's stands and hold it for --hold (docs/sv_union_circle.md)"
"core.help.sv-circle-join.verbose-circle" = "with --union-circle: print each circle message we send and each step of the area search too; the --capture file keeps the steps either way"
"core.help.sv-circle-join.verbose-rtt" = "print the RTT traffic too"
"core.help.sv-gift-host.ack-period" = "seconds between the periodic bulk acks on every port the console used"
"core.help.sv-gift-host.announce" = "run the game's port-2 opening from the station ids instead of a replay: the type-7 announcement on 0x80 port 2 carrying this host's own station id, and a type 9 carrying the console's in answer to its type-3 join on 0x7c port 2 (pokeldn.sv.port2)"
"core.help.sv-gift-host.announce-delay" = "seconds after the seat before the type 7 goes out; a pair's host sends it at about 2.3"
"core.help.sv-gift-host.capture" = "write every datagram here as JSON lines"
"core.help.sv-gift-host.clock" = "answer clone clock requests, if any"
"core.help.sv-gift-host.code" = "the Link Code the player sets, e.g. 12345678; empty for none"
"core.help.sv-gift-host.comm-id" = "advertise this local communication id"
"core.help.sv-gift-host.confirm-delay" = "seconds after the console's offer before the host's confirmation"
"core.help.sv-gift-host.for-receiver" = "make each --gift-event card that gives the receiver's own trainer again for the console's save, during the trade: the console offers first, a Pokemon its save caught names the trainer, and ours goes up made for it; for any other, the trainer the console's session data names. Failing both, the offer goes as given, under the trainer from Settings (pokeldn.receiver_gift, docs/gift_simulated.md)"
"core.help.sv-gift-host.fresh-pid" = "offer each record under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again"
"core.help.sv-gift-host.game-data" = "hex, the 40 game bytes of the advertisement; a searching console leaves them zero, a host that a joiner reached carried 648cf4 at +0x21"
"core.help.sv-gift-host.gift-event" = "the Mystery Gift card each --trade-offer was made from, in the same order: its key in PKHeX's event database (pokeldn.pokemon.Service.gift_events)"
"core.help.sv-gift-host.ip-host" = "host over ldn_mitm on the LAN for an emulator; no radio and no root"
"core.help.sv-gift-host.max-participants" = "the LDN participant limit; a Tera Raid advertises 4"
"core.help.sv-gift-host.net-flags" = "the message flags on the Net 0x11 opening; a retail host sends 0x31, this host's own default is 0x01"
"core.help.sv-gift-host.net-property" = "send the Net 0x50 update-property message a pair's host sends 0.37 s after its 0x11, retransmitting until the console's 0x51"
"core.help.sv-gift-host.net-property-flags" = "the message flags on the Net 0x50; a pair's host sends 0x31 on it and on its 0x11, and this host's 0x11 needs 0x01 to be answered at all"
"core.help.sv-gift-host.net-stations" = "how many 21-byte station slots the Net 0x11 carries; a retail host writes four whatever the game's participant limit is"
"core.help.sv-gift-host.no-ack" = "do not acknowledge reliable streams"
"core.help.sv-gift-host.no-identity" = "send no station identity unless --record-set or --send-on-open names one; by default the recorded one in pokeldn.sv.reference"
"core.help.sv-gift-host.no-leave-response" = "leave a console's Session type-3 leave request unanswered; it then resends it every 0.5 s and leaves after the fourth (docs/sv.md, Leaving)"
"core.help.sv-gift-host.no-rtt" = "do not answer RTT requests"
"core.help.sv-gift-host.offer-after-open" = "seconds after the console's key-0x80 open at which the host offers first; the same gate as --send-on-open"
"core.help.sv-gift-host.offer-at" = "seconds after the seat at which the host offers first, before the console does, as a pair's host did; without it the host answers the console's offer"
"core.help.sv-gift-host.offer-dump" = "write the offered record's 348-byte body to this file as hex and exit, which needs no radio"
"core.help.sv-gift-host.offer-out" = "a file to write the console's own offer to, the 348-byte body of its 80 00 02 00 message, as hex text. What it holds is read by pokeldn.sv.pokemon"
"core.help.sv-gift-host.offer-set" = "a field written into the offered record before it is sealed, by its pokeldn.sv.pokemon name: nickname=SHINY, species=906, level=50, ivs=31,31,31,31,31,31, pid=0x1234, trainer_id=12345, ball=4, moves=33,0,0,0. Repeatable, and `shiny` alone rolls a personality value shiny against the record's own ids"
"core.help.sv-gift-host.online" = "trade with a player far away: their console's offer is offered here, and each side confirms only once both consoles have (docs/online.md)"
"core.help.sv-gift-host.online-code" = "the room both players enter; default the link code, and no code meets anyone else trading online without one"
"core.help.sv-gift-host.platform" = "the station platform byte: 1 is a Switch 2, which is what both retail consoles advertise; 0 is a Switch and what the LDN layer defaults to"
"core.help.sv-gift-host.player-name" = "the LDN node name"
"core.help.sv-gift-host.print-packets" = "print every packet in and out; the --capture file keeps them either way"
"core.help.sv-gift-host.raid-catch-normal" = "with --raid-event: serve a catch-once encounter (every seven-star raid, Walking Wake, Iron Leaves...) as a normal catch, its capture rate normal and its record number a stand-in no save has caught, so a save that caught it may catch it again; one that cannot be caught stays so (docs/sv_raid.md, Event raids)"
"core.help.sv-gift-host.raid-content" = "a standard or a black (six-star) crystal"
"core.help.sv-gift-host.raid-event" = "host an event raid: a Poke Portal News delivery's folder (an EventsGallery event, or its Files); the seed draws from the event's encounters at --raid-version and --raid-progress, and --raid-map and --raid-content are unused"
"core.help.sv-gift-host.raid-event-group" = "the delivery group of the event's den, 1 to 10; by default the first with dens and an encounter at that progress"
"core.help.sv-gift-host.raid-partner" = "an NPC partner the raid seats, in slot order, one per slot the consoles leave empty (2 with one console, 1 with two, none with three): Austin, Ava, Logan, Hailey, Evan, Charlotte, Kylie, Hunter, Gianna, Eli, Henry, Chase, Claire, Brooklyn, Zoe, Samantha, Dylan, Luke; the host draws a partner seed that seats them, the rest drawn freely (docs/sv_raid.md, Partners)"
"core.help.sv-gift-host.raid-partner-progress" = "the unlock stage the partners come from, which sets their pool, their level being four fifths of --raid-pokemon's; by default --raid-progress's, six stars for a black crystal or a seven-star event raid"
"core.help.sv-gift-host.raid-players" = "consoles the raid waits for, 1 to 3; it starts once N are in the lobby and every one is Ready, or when the lobby timer runs out"
"core.help.sv-gift-host.raid-pokemon" = "the party record our player brings to the raid, legal per PKHeX; with --raid-seed"
"core.help.sv-gift-host.raid-progress" = "the story stage, which sets a standard crystal's star odds"
"core.help.sv-gift-host.raid-reward" = "a reward row in place of the seed's, in order; up to 45"
"core.help.sv-gift-host.raid-seed" = "host a Tera Raid: the raid seed, eight hex digits; the boss, its Tera type and the rewards follow from it and the four --raid-* context flags"
"core.help.sv-gift-host.raid-serve" = "serve the raid battle from this station with a plugin's battle server (NAME, or the first one loaded): the console and our Pokemon fight one battle; one console only; a failure hands the network over as without it (docs/sv_raid.md, Serving the battle)"
"core.help.sv-gift-host.record-delay" = "seconds after the seat before the record set goes out"
"core.help.sv-gift-host.record-set" = "a directory of NNN.bin records to send on 0x81 port 0 as this host's own identity, the way a pair's host sends its 46; the first carries INITIALIZED and every one is already zlib (scratchpad/sv_extract_records.py writes such a set); by default the recorded set in pokeldn.sv.reference"
"core.help.sv-gift-host.record-spacing" = "seconds between the record packets; a retail raid host spreads its identity over about 0.13 s"
"core.help.sv-gift-host.records-per-packet" = "bundle the record set N to a packet, each after the first with its header inherited, as a retail host's retransmit round does (docs/sv.md)"
"core.help.sv-gift-host.rtt-probe" = "send an RTT request this often, as a pair's host does every 410 ms; the host otherwise only answers them"
"core.help.sv-gift-host.scarlet-response" = "the 41-byte Session join response a Scarlet host sends, with no route bytes, rather than Arceus's 43-byte one"
"core.help.sv-gift-host.scene-id" = "the LDN scene: 4 for a Link Trade, 7 for a Tera Raid"
"core.help.sv-gift-host.send" = "PROTO:PORT:HEX, a reliable data message to send once the console has joined (host seq 1 on that port, INITIALIZED); repeatable"
"core.help.sv-gift-host.send-at" = "DELAY:PROTO:PORT:HEX[:z][:start|:end], a reliable data message sent that many seconds after the seat; the sequence follows the port's own. A pair's host sends its 0x7c port 1 table update at nine seconds this way"
"core.help.sv-gift-host.send-on-open" = "DELAY:PROTO:PORT:HEX[:z][:start|:end], sent that many seconds after the console announces its own key 0x80 open on 0x7c port 1. A port-0 message sent before that open is acknowledged by the console and never reaches the game, and so is everything after it on that port; repeatable; by default the identity fragments in pokeldn.sv.reference"
"core.help.sv-gift-host.session-flags" = "the message flags on the Session replies; a Scarlet host sends 0x00, this host's own default is 0x01"
"core.help.sv-gift-host.session-packet-id" = "the packet id in the Pia header of the Session replies; a Scarlet host's join response carries 1"
"core.help.sv-gift-host.ssid" = "hex, 16 bytes; default lets the LDN layer pick"
"core.help.sv-gift-host.trade-offer" = "a file holding the 348-byte record this host offers (raw, or hex text; a 352-byte game message is stripped of its header). With it the host answers the console's offer with its own, confirms, and follows the console through the commit and the four exchange steps the way a pair's host does (pokeldn.sv.trade). Repeatable: the second and later records are offered in the same seat, one per trade, as each trade closes"
"core.help.sv-gift-host.trainer-name" = "the player name record 1 of our identity carries, the one the trade screen shows"
"core.help.sv-gift-host.update-delay" = "seconds between the Session join response and the station-list update; a Scarlet host leaves about 1.5 s"
"core.help.sv-gift-host.update-first-seq" = "also send a station list in the same breath as the join response, under this sequence id; an emulated Scarlet host sends one with id 0 there and the second about two seconds later"
"core.help.sv-gift-host.update-seq" = "the sequence id in the station-list update; a Scarlet host sends 1 where its join response sent 0"
"core.help.sv-gift-host.violet" = "advertise Violet's local communication id instead of Scarlet's"
"core.help.sv-host.ack-period" = "seconds between the periodic bulk acks on every port the console used"
"core.help.sv-host.announce" = "run the game's port-2 opening from the station ids instead of a replay: the type-7 announcement on 0x80 port 2 carrying this host's own station id, and a type 9 carrying the console's in answer to its type-3 join on 0x7c port 2 (pokeldn.sv.port2)"
"core.help.sv-host.announce-delay" = "seconds after the seat before the type 7 goes out; a pair's host sends it at about 2.3"
"core.help.sv-host.capture" = "write every datagram here as JSON lines"
"core.help.sv-host.clock" = "answer clone clock requests, if any"
"core.help.sv-host.code" = "the Link Code the player sets, e.g. 12345678; empty for none"
"core.help.sv-host.comm-id" = "advertise this local communication id"
"core.help.sv-host.confirm-delay" = "seconds after the console's offer before the host's confirmation"
"core.help.sv-host.for-receiver" = "make each --gift-event card that gives the receiver's own trainer again for the console's save, during the trade: the console offers first, a Pokemon its save caught names the trainer, and ours goes up made for it; for any other, the trainer the console's session data names. Failing both, the offer goes as given, under the trainer from Settings (pokeldn.receiver_gift, docs/gift_simulated.md)"
"core.help.sv-host.fresh-pid" = "offer each record under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again"
"core.help.sv-host.game-data" = "hex, the 40 game bytes of the advertisement; a searching console leaves them zero, a host that a joiner reached carried 648cf4 at +0x21"
"core.help.sv-host.gift-event" = "the Mystery Gift card each --trade-offer was made from, in the same order: its key in PKHeX's event database (pokeldn.pokemon.Service.gift_events)"
"core.help.sv-host.ip-host" = "host over ldn_mitm on the LAN for an emulator; no radio and no root"
"core.help.sv-host.max-participants" = "the LDN participant limit; a Tera Raid advertises 4"
"core.help.sv-host.net-flags" = "the message flags on the Net 0x11 opening; a retail host sends 0x31, this host's own default is 0x01"
"core.help.sv-host.net-property" = "send the Net 0x50 update-property message a pair's host sends 0.37 s after its 0x11, retransmitting until the console's 0x51"
"core.help.sv-host.net-property-flags" = "the message flags on the Net 0x50; a pair's host sends 0x31 on it and on its 0x11, and this host's 0x11 needs 0x01 to be answered at all"
"core.help.sv-host.net-stations" = "how many 21-byte station slots the Net 0x11 carries; a retail host writes four whatever the game's participant limit is"
"core.help.sv-host.no-ack" = "do not acknowledge reliable streams"
"core.help.sv-host.no-identity" = "send no station identity unless --record-set or --send-on-open names one; by default the recorded one in pokeldn.sv.reference"
"core.help.sv-host.no-leave-response" = "leave a console's Session type-3 leave request unanswered; it then resends it every 0.5 s and leaves after the fourth (docs/sv.md, Leaving)"
"core.help.sv-host.no-rtt" = "do not answer RTT requests"
"core.help.sv-host.offer-after-open" = "seconds after the console's key-0x80 open at which the host offers first; the same gate as --send-on-open"
"core.help.sv-host.offer-at" = "seconds after the seat at which the host offers first, before the console does, as a pair's host did; without it the host answers the console's offer"
"core.help.sv-host.offer-dump" = "write the offered record's 348-byte body to this file as hex and exit, which needs no radio"
"core.help.sv-host.offer-out" = "a file to write the console's own offer to, the 348-byte body of its 80 00 02 00 message, as hex text. What it holds is read by pokeldn.sv.pokemon"
"core.help.sv-host.offer-set" = "a field written into the offered record before it is sealed, by its pokeldn.sv.pokemon name: nickname=SHINY, species=906, level=50, ivs=31,31,31,31,31,31, pid=0x1234, trainer_id=12345, ball=4, moves=33,0,0,0. Repeatable, and `shiny` alone rolls a personality value shiny against the record's own ids"
"core.help.sv-host.online" = "trade with a player far away: their console's offer is offered here, and each side confirms only once both consoles have (docs/online.md)"
"core.help.sv-host.online-code" = "the room both players enter; default the link code, and no code meets anyone else trading online without one"
"core.help.sv-host.platform" = "the station platform byte: 1 is a Switch 2, which is what both retail consoles advertise; 0 is a Switch and what the LDN layer defaults to"
"core.help.sv-host.player-name" = "the LDN node name"
"core.help.sv-host.print-packets" = "print every packet in and out; the --capture file keeps them either way"
"core.help.sv-host.raid-catch-normal" = "with --raid-event: serve a catch-once encounter (every seven-star raid, Walking Wake, Iron Leaves...) as a normal catch, its capture rate normal and its record number a stand-in no save has caught, so a save that caught it may catch it again; one that cannot be caught stays so (docs/sv_raid.md, Event raids)"
"core.help.sv-host.raid-content" = "a standard or a black (six-star) crystal"
"core.help.sv-host.raid-event" = "host an event raid: a Poke Portal News delivery's folder (an EventsGallery event, or its Files); the seed draws from the event's encounters at --raid-version and --raid-progress, and --raid-map and --raid-content are unused"
"core.help.sv-host.raid-event-group" = "the delivery group of the event's den, 1 to 10; by default the first with dens and an encounter at that progress"
"core.help.sv-host.raid-partner" = "an NPC partner the raid seats, in slot order, one per slot the consoles leave empty (2 with one console, 1 with two, none with three): Austin, Ava, Logan, Hailey, Evan, Charlotte, Kylie, Hunter, Gianna, Eli, Henry, Chase, Claire, Brooklyn, Zoe, Samantha, Dylan, Luke; the host draws a partner seed that seats them, the rest drawn freely (docs/sv_raid.md, Partners)"
"core.help.sv-host.raid-partner-progress" = "the unlock stage the partners come from, which sets their pool, their level being four fifths of --raid-pokemon's; by default --raid-progress's, six stars for a black crystal or a seven-star event raid"
"core.help.sv-host.raid-players" = "consoles the raid waits for, 1 to 3; it starts once N are in the lobby and every one is Ready, or when the lobby timer runs out"
"core.help.sv-host.raid-pokemon" = "the party record our player brings to the raid, legal per PKHeX; with --raid-seed"
"core.help.sv-host.raid-progress" = "the story stage, which sets a standard crystal's star odds"
"core.help.sv-host.raid-reward" = "a reward row in place of the seed's, in order; up to 45"
"core.help.sv-host.raid-seed" = "host a Tera Raid: the raid seed, eight hex digits; the boss, its Tera type and the rewards follow from it and the four --raid-* context flags"
"core.help.sv-host.raid-serve" = "serve the raid battle from this station with a plugin's battle server (NAME, or the first one loaded): the console and our Pokemon fight one battle; one console only; a failure hands the network over as without it (docs/sv_raid.md, Serving the battle)"
"core.help.sv-host.record-delay" = "seconds after the seat before the record set goes out"
"core.help.sv-host.record-set" = "a directory of NNN.bin records to send on 0x81 port 0 as this host's own identity, the way a pair's host sends its 46; the first carries INITIALIZED and every one is already zlib (scratchpad/sv_extract_records.py writes such a set); by default the recorded set in pokeldn.sv.reference"
"core.help.sv-host.record-spacing" = "seconds between the record packets; a retail raid host spreads its identity over about 0.13 s"
"core.help.sv-host.records-per-packet" = "bundle the record set N to a packet, each after the first with its header inherited, as a retail host's retransmit round does (docs/sv.md)"
"core.help.sv-host.rtt-probe" = "send an RTT request this often, as a pair's host does every 410 ms; the host otherwise only answers them"
"core.help.sv-host.scarlet-response" = "the 41-byte Session join response a Scarlet host sends, with no route bytes, rather than Arceus's 43-byte one"
"core.help.sv-host.scene-id" = "the LDN scene: 4 for a Link Trade, 7 for a Tera Raid"
"core.help.sv-host.send" = "PROTO:PORT:HEX, a reliable data message to send once the console has joined (host seq 1 on that port, INITIALIZED); repeatable"
"core.help.sv-host.send-at" = "DELAY:PROTO:PORT:HEX[:z][:start|:end], a reliable data message sent that many seconds after the seat; the sequence follows the port's own. A pair's host sends its 0x7c port 1 table update at nine seconds this way"
"core.help.sv-host.send-on-open" = "DELAY:PROTO:PORT:HEX[:z][:start|:end], sent that many seconds after the console announces its own key 0x80 open on 0x7c port 1. A port-0 message sent before that open is acknowledged by the console and never reaches the game, and so is everything after it on that port; repeatable; by default the identity fragments in pokeldn.sv.reference"
"core.help.sv-host.session-flags" = "the message flags on the Session replies; a Scarlet host sends 0x00, this host's own default is 0x01"
"core.help.sv-host.session-packet-id" = "the packet id in the Pia header of the Session replies; a Scarlet host's join response carries 1"
"core.help.sv-host.ssid" = "hex, 16 bytes; default lets the LDN layer pick"
"core.help.sv-host.trade-offer" = "a file holding the 348-byte record this host offers (raw, or hex text; a 352-byte game message is stripped of its header). With it the host answers the console's offer with its own, confirms, and follows the console through the commit and the four exchange steps the way a pair's host does (pokeldn.sv.trade). Repeatable: the second and later records are offered in the same seat, one per trade, as each trade closes"
"core.help.sv-host.trainer-name" = "the player name record 1 of our identity carries, the one the trade screen shows"
"core.help.sv-host.update-delay" = "seconds between the Session join response and the station-list update; a Scarlet host leaves about 1.5 s"
"core.help.sv-host.update-first-seq" = "also send a station list in the same breath as the join response, under this sequence id; an emulated Scarlet host sends one with id 0 there and the second about two seconds later"
"core.help.sv-host.update-seq" = "the sequence id in the station-list update; a Scarlet host sends 1 where its join response sent 0"
"core.help.sv-host.violet" = "advertise Violet's local communication id instead of Scarlet's"
"core.help.sv-join.ack-dest-bits" = "the reliable header's destination bits; 3 adds the four-byte bitmap a retail station sends, 0 leaves the nine-byte header"
"core.help.sv-join.ack-entries" = "entries in the ack payload; a retail station sends four"
"core.help.sv-join.ack-flags" = "the Pia message flags on our bulk acks; 0xa0 is what both retail stations send, and bit 5 compresses the message body"
"core.help.sv-join.ack-highest" = "ack one past the highest id received, with no mask, instead of the contiguous run and a mask as a retail station does (docs/sv.md)"
"core.help.sv-join.ack-period" = "seconds between the periodic bulk acks on every stream the host uses"
"core.help.sv-join.ack-sweep" = "rotate every combination of --ack-flags, --ack-entries and --ack-dest-bits through the seat, one per --ack-sweep-period, and print each as it goes live. One seat then says which shape the guest parses"
"core.help.sv-join.ack-sweep-period" = "seconds each sweep variant stays live"
"core.help.sv-join.announce-timeout" = "end a seat whose console has not announced on 0x80 port 2 this many seconds after the seat, and go back to scanning. A seat can carry every stream to completion and never be announced (docs/sv.md, Unresolved); board seats that traded announced at 5.8 and 7.7 s"
"core.help.sv-join.answer-migration" = "answer the host's type-7 leave-with-host-migration with a type-8 ack, telling it we accept the host role it is handing over"
"core.help.sv-join.bbq-clear" = "the BP, 1 to 9999999, --circle-task bp gives"
"core.help.sv-join.capture" = "write every datagram here as JSON lines"
"core.help.sv-join.circle-task" = "with --union-circle, a task after which our player leaves the circle and the run ends: snacksworth gives the host every Team and solo clear it lacks for all of Snacksworth's legendaries, one a second from the start demo's end; bp a clear paying the host the --bbq-clear BP"
"core.help.sv-join.code" = "join only a console searching with this Link Code; empty takes any"
"core.help.sv-join.comm-id" = "local communication id to join, hex; default is either cartridge's"
"core.help.sv-join.commit-delay" = "seconds after the host's confirmation before the joiner commits; the pair's joiner committed 1.5 s after its own confirmation and its host answered in kind"
"core.help.sv-join.confirm-delay" = "seconds after the host's confirmation before the joiner's own"
"core.help.sv-join.connect-timeout" = "seconds to allow the association itself; a console whose host phase ends mid-connect leaves ldn.connect blocked with no timeout of its own"
"core.help.sv-join.dwell" = "seconds per channel in the scan; the console's hosting window is a few seconds, so a long dwell misses it"
"core.help.sv-join.follow-host" = "with --union-circle: our player copies the host's as it moves, its animations and its ride, keeping 5 m from it and facing it"
"core.help.sv-join.fresh-pid" = "offer each record under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again"
"core.help.sv-join.game-channel" = "announce our own channel table on 0x7c. A station opens the game's channel by sending the same 31-byte table its peer sends on port 1, an open on port 2, and a mirror of every later table update; the peer sends the game on port 0 only once ours is announced (docs/sv.md)"
"core.help.sv-join.hold" = "how long to stay in one joined session before scanning again"
"core.help.sv-join.host-ip" = "--ip-join: the emulator's address"
"core.help.sv-join.ip-join" = "join an emulated console over the LAN through ldn_mitm instead of the radio: no root, no phy, no prod.keys"
"core.help.sv-join.join-delay" = "hold the Session join request this long after the seat. A console whose WaitMember (3 to 4 s) ends unjoined leaves with host migration, so a join accepted in its leave wait draws the type 7 (docs/sv.md, What decides a seat)"
"core.help.sv-join.join-dst-var" = "the packet header's destination variable id on the join request: 0, which is what a joining Arceus uses, or the host's own"
"core.help.sv-join.join-flags" = "message flags on the join request; a joining Arceus sends 0x01, skip the source check, on every repeat of it"
"core.help.sv-join.join-player-id" = "the 16-byte player id in the join request: 'arceus' (1 then 0 as two big-endian u64, what a retail Arceus states), 'random', 'high' (random with a leading 0xff) or 32 hex digits. A Scarlet host's own is 10047bd4a25543e057cee5c71ab1f2a2 (sv18)"
"core.help.sv-join.join-player-name" = "the player name in the join request's one player record; a retail console's is a single space"
"core.help.sv-join.join-repeat" = "with --session-join, re-send it every N seconds (0 sends it once)"
"core.help.sv-join.leave-on-migration" = "end the seat this many seconds after the console asks us to take the host role (Session type 7), and go back to scanning. A console that sent it sent nothing but NetStartHostMigration afterwards in the seats measured; without this the run holds the seat for the whole --hold"
"core.help.sv-join.mac" = "set the adapter's MAC before associating, e.g. 48:f1:eb:11:22:33. Pia derives a station's constant id from its MAC, and the two consoles' are Nintendo OUIs where the adapter's is not. The driver reload in the launcher puts the adapter's own address back"
"core.help.sv-join.mirror-records" = "send every record the host puts on 0x81 port 0 back on port 1 as our own, in order. A retail joiner answers the host's records with a set of its own; this fills that set with records the game itself composed"
"core.help.sv-join.name" = "the LDN node name we publish"
"core.help.sv-join.net-ack" = "answer the host's Net 0x11 with the 0x12 ack. A retail joiner does not, and the ack makes the console ask for host migration instead (sv08)"
"core.help.sv-join.no-ack" = "do not acknowledge reliable streams"
"core.help.sv-join.no-channel-ack" = "do not acknowledge the host's messages on the game's reliable channel 0x7c"
"core.help.sv-join.no-clock" = "do not send the Clone Clock request. A seated joiner sends eighteen zero bytes on 0x77 before anything else and the host answers"
"core.help.sv-join.no-identity" = "send no station identity unless --record-set or --send-on-open names one; by default the recorded one in pokeldn.sv.reference"
"core.help.sv-join.no-rtt" = "do not answer RTT requests"
"core.help.sv-join.no-take-host" = "when the console hands us the host role before the announcement (not a player leaving), leave its network and become the host with bin/sv_host.py on the same channel and code, as bin/pla_join.py does; needs --answer-migration"
"core.help.sv-join.no-update-ack" = "do not answer a Session type-5 station update with the type 6"
"core.help.sv-join.offer-after-open" = "seconds after the host's key-0x80 open at which the joiner offers first, before the host does; without it the joiner answers the host's offer"
"core.help.sv-join.offer-dump" = "write the offered record's 348-byte body to this file as hex and exit, which needs no radio"
"core.help.sv-join.offer-out" = "a file to write the host's own offer to, the 348-byte body of its 80 00 02 00 message, as hex text"
"core.help.sv-join.offer-set" = "a field written into the offered record before it is sealed, by its pokeldn.sv.pokemon name: nickname=SHINY, species=906, ivs=31,31,31,31,31,31, trainer_id=12345, ball=4. Repeatable, and `shiny` alone rolls a personality value shiny against the record's own ids"
"core.help.sv-join.open-delay" = "seconds after the join response (after the seat without --session-join) before the eleven acks and the two stream opens go out; a retail joiner opens 0.75 s after its join"
"core.help.sv-join.our-ip" = "--ip-join: our own address"
"core.help.sv-join.platform" = "the station platform byte we publish; 1 is what a Switch 2 sends"
"core.help.sv-join.port2-now" = "send the game's type-3 join on 0x7c port 2 with the channel table, rather than in answer to the console's type-7 announcement on 0x80 port 2. A pair's joiner answers the announcement (docs/sv.md, Port 2)"
"core.help.sv-join.print-packets" = "print every packet in and out; the --capture file keeps them either way"
"core.help.sv-join.quiet-seat" = "end a seat on which the console has sent nothing at all for this many seconds, and go back to scanning. An association taken outside the console's host phase carries no traffic; without this the run holds it for the whole --hold"
"core.help.sv-join.raid-pokemon" = "join the Tera Raid lobby a console hosts and bring this party record, legal per PKHeX; our player readies, answers the start and leaves when the battle begins, its Pokemon fighting on for the console"
"core.help.sv-join.raid-ready-delay" = "seconds in the raid lobby before our player readies"
"core.help.sv-join.record-delay" = "seconds after the seat before the first identity record goes out"
"core.help.sv-join.record-set" = "send this directory's records as our own on 0x81 port 1, in sequence order, in place of --mirror-records. `scratchpad/sv_extract_records.py` writes one from a station's own log, so a whole real identity can be replayed rather than the host's mirrored back; by default the recorded set in pokeldn.sv.reference"
"core.help.sv-join.repeat-ack-gap" = "acknowledge a record already held at most once per SECONDS per stream; a new record is acked at once. 0 acks every repeat (docs/sv.md)"
"core.help.sv-join.rtt-delay" = "answer each RTT request SECONDS late; RTT samples enable the host's retransmission timer (docs/sv.md)"
"core.help.sv-join.rtt-period" = "seconds between our own RTT requests (0 sends none)"
"core.help.sv-join.scan-only" = "report what the console advertises and join nothing"
"core.help.sv-join.scan-timeout" = "--ip-join: seconds to wait for one ldn_mitm scan answer"
"core.help.sv-join.scene-id" = "join only a network of this LDN scene: 4 a Link Trade, 7 a Tera Raid"
"core.help.sv-join.seconds" = "how long to keep trying"
"core.help.sv-join.send-on-open" = "DELAY:PROTO:PORT:HEX[:z][:start|:end], sent that many seconds after the host announces key 0x80 open on 0x7c port 1. A station's identity is four messages on 0x7c port 0, the two fragments twice, and nothing sent on that port before the announcement reaches the game; repeatable; by default the identity fragments in pokeldn.sv.reference"
"core.help.sv-join.send-record" = "after the seat, send this 1395-byte identity record on 0x81 port 1 (our station stream) as the game's data exchange, retransmitting until the host acknowledges it. A retail joiner sends its own identity here"
"core.help.sv-join.session-join" = "send the Pia Session join request in the retail layout (docs/sv.md, The Session join request): ten protocols with their versions, a four-byte nonce, both location ids, a seven-byte station address and one player record. A mesh join is unicast, so no passive capture shows a retail one"
"core.help.sv-join.spawn" = "with --union-circle: 10 s after the circle's start demo has ended, keep 3 wild Pokemon of this species (dev number) out 15 to 25 m from the host's player, as a console shares its own: one the host battles, removes or goes more than 50 m from comes again near it"
"core.help.sv-join.spawn-ability" = "ability slot, 2 the hidden ability (default 0 or 1 at random, as a wild one's)"
"core.help.sv-join.spawn-gender" = "1 female (default 0)"
"core.help.sv-join.spawn-item" = "held item id"
"core.help.sv-join.spawn-ivs" = "six IVs 0 to 31 (default each random, as a wild one's)"
"core.help.sv-join.spawn-legal" = "with --spawn: spawn only while the host stands in an area where PKHeX accepts that spawn caught, found from the wild Pokemon the host's console shares (it shares them once our player is near: --follow-host)"
"core.help.sv-join.spawn-nature" = "0 to 24 (default random)"
"core.help.sv-join.spawn-scale" = "0 to 255 (default random)"
"core.help.sv-join.spawn-tera" = "Tera Type, 0 Normal to 17 Fairy in type order (default %(default)s)"
"core.help.sv-join.stay-on-host-migration" = "hold the seat after the console's NetStartHostMigration (Net 0x40). By default the joiner leaves on the first one: the console is destroying its network and resends it until every client has left, for up to 4 s"
"core.help.sv-join.trade-offer" = "a file holding the 348-byte record this joiner offers (raw, or hex text; a 352-byte game message is stripped of its header). With it the joiner answers the host's offer with its own, confirms, commits, and echoes the four exchange steps the way a pair's joiner does (pokeldn.sv.trade). Repeatable: the second and later records are offered in the same seat, one per trade, as each trade closes"
"core.help.sv-join.trainer-name" = "the player name record 1 of our identity carries, the one the trade screen shows"
"core.help.sv-join.unicast" = "send to the host's address instead of the LDN broadcast address. Both retail stations broadcast every Pia packet (sv11), and a broadcast needs no ARP resolution of the peer"
"core.help.sv-join.union-circle" = "join the Union Circle a console hosts, as a raid guest joins a raid: take the seat, send our identity, open the game's channel, answer the host's start, put our player on the field where the host's stands and hold it for --hold (docs/sv_union_circle.md)"
"core.help.sv-join.verbose-circle" = "with --union-circle: print each circle message we send and each step of the area search too; the --capture file keeps the steps either way"
"core.help.sv-join.verbose-rtt" = "print the RTT traffic too"
"core.help.sv-online.ack-period" = "seconds between the periodic bulk acks on every port the console used"
"core.help.sv-online.announce" = "run the game's port-2 opening from the station ids instead of a replay: the type-7 announcement on 0x80 port 2 carrying this host's own station id, and a type 9 carrying the console's in answer to its type-3 join on 0x7c port 2 (pokeldn.sv.port2)"
"core.help.sv-online.announce-delay" = "seconds after the seat before the type 7 goes out; a pair's host sends it at about 2.3"
"core.help.sv-online.capture" = "write every datagram here as JSON lines"
"core.help.sv-online.clock" = "answer clone clock requests, if any"
"core.help.sv-online.code" = "the Link Code the player sets, e.g. 12345678; empty for none"
"core.help.sv-online.comm-id" = "advertise this local communication id"
"core.help.sv-online.confirm-delay" = "seconds after the console's offer before the host's confirmation"
"core.help.sv-online.for-receiver" = "make each --gift-event card that gives the receiver's own trainer again for the console's save, during the trade: the console offers first, a Pokemon its save caught names the trainer, and ours goes up made for it; for any other, the trainer the console's session data names. Failing both, the offer goes as given, under the trainer from Settings (pokeldn.receiver_gift, docs/gift_simulated.md)"
"core.help.sv-online.fresh-pid" = "offer each record under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again"
"core.help.sv-online.game-data" = "hex, the 40 game bytes of the advertisement; a searching console leaves them zero, a host that a joiner reached carried 648cf4 at +0x21"
"core.help.sv-online.gift-event" = "the Mystery Gift card each --trade-offer was made from, in the same order: its key in PKHeX's event database (pokeldn.pokemon.Service.gift_events)"
"core.help.sv-online.ip-host" = "host over ldn_mitm on the LAN for an emulator; no radio and no root"
"core.help.sv-online.max-participants" = "the LDN participant limit; a Tera Raid advertises 4"
"core.help.sv-online.net-flags" = "the message flags on the Net 0x11 opening; a retail host sends 0x31, this host's own default is 0x01"
"core.help.sv-online.net-property" = "send the Net 0x50 update-property message a pair's host sends 0.37 s after its 0x11, retransmitting until the console's 0x51"
"core.help.sv-online.net-property-flags" = "the message flags on the Net 0x50; a pair's host sends 0x31 on it and on its 0x11, and this host's 0x11 needs 0x01 to be answered at all"
"core.help.sv-online.net-stations" = "how many 21-byte station slots the Net 0x11 carries; a retail host writes four whatever the game's participant limit is"
"core.help.sv-online.no-ack" = "do not acknowledge reliable streams"
"core.help.sv-online.no-identity" = "send no station identity unless --record-set or --send-on-open names one; by default the recorded one in pokeldn.sv.reference"
"core.help.sv-online.no-leave-response" = "leave a console's Session type-3 leave request unanswered; it then resends it every 0.5 s and leaves after the fourth (docs/sv.md, Leaving)"
"core.help.sv-online.no-rtt" = "do not answer RTT requests"
"core.help.sv-online.offer-after-open" = "seconds after the console's key-0x80 open at which the host offers first; the same gate as --send-on-open"
"core.help.sv-online.offer-at" = "seconds after the seat at which the host offers first, before the console does, as a pair's host did; without it the host answers the console's offer"
"core.help.sv-online.offer-dump" = "write the offered record's 348-byte body to this file as hex and exit, which needs no radio"
"core.help.sv-online.offer-out" = "a file to write the console's own offer to, the 348-byte body of its 80 00 02 00 message, as hex text. What it holds is read by pokeldn.sv.pokemon"
"core.help.sv-online.offer-set" = "a field written into the offered record before it is sealed, by its pokeldn.sv.pokemon name: nickname=SHINY, species=906, level=50, ivs=31,31,31,31,31,31, pid=0x1234, trainer_id=12345, ball=4, moves=33,0,0,0. Repeatable, and `shiny` alone rolls a personality value shiny against the record's own ids"
"core.help.sv-online.online" = "trade with a player far away: their console's offer is offered here, and each side confirms only once both consoles have (docs/online.md)"
"core.help.sv-online.online-code" = "the room both players enter; default the link code, and no code meets anyone else trading online without one"
"core.help.sv-online.platform" = "the station platform byte: 1 is a Switch 2, which is what both retail consoles advertise; 0 is a Switch and what the LDN layer defaults to"
"core.help.sv-online.player-name" = "the LDN node name"
"core.help.sv-online.print-packets" = "print every packet in and out; the --capture file keeps them either way"
"core.help.sv-online.raid-catch-normal" = "with --raid-event: serve a catch-once encounter (every seven-star raid, Walking Wake, Iron Leaves...) as a normal catch, its capture rate normal and its record number a stand-in no save has caught, so a save that caught it may catch it again; one that cannot be caught stays so (docs/sv_raid.md, Event raids)"
"core.help.sv-online.raid-content" = "a standard or a black (six-star) crystal"
"core.help.sv-online.raid-event" = "host an event raid: a Poke Portal News delivery's folder (an EventsGallery event, or its Files); the seed draws from the event's encounters at --raid-version and --raid-progress, and --raid-map and --raid-content are unused"
"core.help.sv-online.raid-event-group" = "the delivery group of the event's den, 1 to 10; by default the first with dens and an encounter at that progress"
"core.help.sv-online.raid-partner" = "an NPC partner the raid seats, in slot order, one per slot the consoles leave empty (2 with one console, 1 with two, none with three): Austin, Ava, Logan, Hailey, Evan, Charlotte, Kylie, Hunter, Gianna, Eli, Henry, Chase, Claire, Brooklyn, Zoe, Samantha, Dylan, Luke; the host draws a partner seed that seats them, the rest drawn freely (docs/sv_raid.md, Partners)"
"core.help.sv-online.raid-partner-progress" = "the unlock stage the partners come from, which sets their pool, their level being four fifths of --raid-pokemon's; by default --raid-progress's, six stars for a black crystal or a seven-star event raid"
"core.help.sv-online.raid-players" = "consoles the raid waits for, 1 to 3; it starts once N are in the lobby and every one is Ready, or when the lobby timer runs out"
"core.help.sv-online.raid-pokemon" = "the party record our player brings to the raid, legal per PKHeX; with --raid-seed"
"core.help.sv-online.raid-progress" = "the story stage, which sets a standard crystal's star odds"
"core.help.sv-online.raid-reward" = "a reward row in place of the seed's, in order; up to 45"
"core.help.sv-online.raid-seed" = "host a Tera Raid: the raid seed, eight hex digits; the boss, its Tera type and the rewards follow from it and the four --raid-* context flags"
"core.help.sv-online.raid-serve" = "serve the raid battle from this station with a plugin's battle server (NAME, or the first one loaded): the console and our Pokemon fight one battle; one console only; a failure hands the network over as without it (docs/sv_raid.md, Serving the battle)"
"core.help.sv-online.record-delay" = "seconds after the seat before the record set goes out"
"core.help.sv-online.record-set" = "a directory of NNN.bin records to send on 0x81 port 0 as this host's own identity, the way a pair's host sends its 46; the first carries INITIALIZED and every one is already zlib (scratchpad/sv_extract_records.py writes such a set); by default the recorded set in pokeldn.sv.reference"
"core.help.sv-online.record-spacing" = "seconds between the record packets; a retail raid host spreads its identity over about 0.13 s"
"core.help.sv-online.records-per-packet" = "bundle the record set N to a packet, each after the first with its header inherited, as a retail host's retransmit round does (docs/sv.md)"
"core.help.sv-online.rtt-probe" = "send an RTT request this often, as a pair's host does every 410 ms; the host otherwise only answers them"
"core.help.sv-online.scarlet-response" = "the 41-byte Session join response a Scarlet host sends, with no route bytes, rather than Arceus's 43-byte one"
"core.help.sv-online.scene-id" = "the LDN scene: 4 for a Link Trade, 7 for a Tera Raid"
"core.help.sv-online.send" = "PROTO:PORT:HEX, a reliable data message to send once the console has joined (host seq 1 on that port, INITIALIZED); repeatable"
"core.help.sv-online.send-at" = "DELAY:PROTO:PORT:HEX[:z][:start|:end], a reliable data message sent that many seconds after the seat; the sequence follows the port's own. A pair's host sends its 0x7c port 1 table update at nine seconds this way"
"core.help.sv-online.send-on-open" = "DELAY:PROTO:PORT:HEX[:z][:start|:end], sent that many seconds after the console announces its own key 0x80 open on 0x7c port 1. A port-0 message sent before that open is acknowledged by the console and never reaches the game, and so is everything after it on that port; repeatable; by default the identity fragments in pokeldn.sv.reference"
"core.help.sv-online.session-flags" = "the message flags on the Session replies; a Scarlet host sends 0x00, this host's own default is 0x01"
"core.help.sv-online.session-packet-id" = "the packet id in the Pia header of the Session replies; a Scarlet host's join response carries 1"
"core.help.sv-online.ssid" = "hex, 16 bytes; default lets the LDN layer pick"
"core.help.sv-online.trade-offer" = "a file holding the 348-byte record this host offers (raw, or hex text; a 352-byte game message is stripped of its header). With it the host answers the console's offer with its own, confirms, and follows the console through the commit and the four exchange steps the way a pair's host does (pokeldn.sv.trade). Repeatable: the second and later records are offered in the same seat, one per trade, as each trade closes"
"core.help.sv-online.trainer-name" = "the player name record 1 of our identity carries, the one the trade screen shows"
"core.help.sv-online.update-delay" = "seconds between the Session join response and the station-list update; a Scarlet host leaves about 1.5 s"
"core.help.sv-online.update-first-seq" = "also send a station list in the same breath as the join response, under this sequence id; an emulated Scarlet host sends one with id 0 there and the second about two seconds later"
"core.help.sv-online.update-seq" = "the sequence id in the station-list update; a Scarlet host sends 1 where its join response sent 0"
"core.help.sv-online.violet" = "advertise Violet's local communication id instead of Scarlet's"
"core.help.sv-raid-host.ack-period" = "seconds between the periodic bulk acks on every port the console used"
"core.help.sv-raid-host.announce" = "run the game's port-2 opening from the station ids instead of a replay: the type-7 announcement on 0x80 port 2 carrying this host's own station id, and a type 9 carrying the console's in answer to its type-3 join on 0x7c port 2 (pokeldn.sv.port2)"
"core.help.sv-raid-host.announce-delay" = "seconds after the seat before the type 7 goes out; a pair's host sends it at about 2.3"
"core.help.sv-raid-host.capture" = "write every datagram here as JSON lines"
"core.help.sv-raid-host.clock" = "answer clone clock requests, if any"
"core.help.sv-raid-host.code" = "the Link Code the player sets, e.g. 12345678; empty for none"
"core.help.sv-raid-host.comm-id" = "advertise this local communication id"
"core.help.sv-raid-host.confirm-delay" = "seconds after the console's offer before the host's confirmation"
"core.help.sv-raid-host.for-receiver" = "make each --gift-event card that gives the receiver's own trainer again for the console's save, during the trade: the console offers first, a Pokemon its save caught names the trainer, and ours goes up made for it; for any other, the trainer the console's session data names. Failing both, the offer goes as given, under the trainer from Settings (pokeldn.receiver_gift, docs/gift_simulated.md)"
"core.help.sv-raid-host.fresh-pid" = "offer each record under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again"
"core.help.sv-raid-host.game-data" = "hex, the 40 game bytes of the advertisement; a searching console leaves them zero, a host that a joiner reached carried 648cf4 at +0x21"
"core.help.sv-raid-host.gift-event" = "the Mystery Gift card each --trade-offer was made from, in the same order: its key in PKHeX's event database (pokeldn.pokemon.Service.gift_events)"
"core.help.sv-raid-host.ip-host" = "host over ldn_mitm on the LAN for an emulator; no radio and no root"
"core.help.sv-raid-host.max-participants" = "the LDN participant limit; a Tera Raid advertises 4"
"core.help.sv-raid-host.net-flags" = "the message flags on the Net 0x11 opening; a retail host sends 0x31, this host's own default is 0x01"
"core.help.sv-raid-host.net-property" = "send the Net 0x50 update-property message a pair's host sends 0.37 s after its 0x11, retransmitting until the console's 0x51"
"core.help.sv-raid-host.net-property-flags" = "the message flags on the Net 0x50; a pair's host sends 0x31 on it and on its 0x11, and this host's 0x11 needs 0x01 to be answered at all"
"core.help.sv-raid-host.net-stations" = "how many 21-byte station slots the Net 0x11 carries; a retail host writes four whatever the game's participant limit is"
"core.help.sv-raid-host.no-ack" = "do not acknowledge reliable streams"
"core.help.sv-raid-host.no-identity" = "send no station identity unless --record-set or --send-on-open names one; by default the recorded one in pokeldn.sv.reference"
"core.help.sv-raid-host.no-leave-response" = "leave a console's Session type-3 leave request unanswered; it then resends it every 0.5 s and leaves after the fourth (docs/sv.md, Leaving)"
"core.help.sv-raid-host.no-rtt" = "do not answer RTT requests"
"core.help.sv-raid-host.offer-after-open" = "seconds after the console's key-0x80 open at which the host offers first; the same gate as --send-on-open"
"core.help.sv-raid-host.offer-at" = "seconds after the seat at which the host offers first, before the console does, as a pair's host did; without it the host answers the console's offer"
"core.help.sv-raid-host.offer-dump" = "write the offered record's 348-byte body to this file as hex and exit, which needs no radio"
"core.help.sv-raid-host.offer-out" = "a file to write the console's own offer to, the 348-byte body of its 80 00 02 00 message, as hex text. What it holds is read by pokeldn.sv.pokemon"
"core.help.sv-raid-host.offer-set" = "a field written into the offered record before it is sealed, by its pokeldn.sv.pokemon name: nickname=SHINY, species=906, level=50, ivs=31,31,31,31,31,31, pid=0x1234, trainer_id=12345, ball=4, moves=33,0,0,0. Repeatable, and `shiny` alone rolls a personality value shiny against the record's own ids"
"core.help.sv-raid-host.online" = "trade with a player far away: their console's offer is offered here, and each side confirms only once both consoles have (docs/online.md)"
"core.help.sv-raid-host.online-code" = "the room both players enter; default the link code, and no code meets anyone else trading online without one"
"core.help.sv-raid-host.platform" = "the station platform byte: 1 is a Switch 2, which is what both retail consoles advertise; 0 is a Switch and what the LDN layer defaults to"
"core.help.sv-raid-host.player-name" = "the LDN node name"
"core.help.sv-raid-host.print-packets" = "print every packet in and out; the --capture file keeps them either way"
"core.help.sv-raid-host.raid-catch-normal" = "with --raid-event: serve a catch-once encounter (every seven-star raid, Walking Wake, Iron Leaves...) as a normal catch, its capture rate normal and its record number a stand-in no save has caught, so a save that caught it may catch it again; one that cannot be caught stays so (docs/sv_raid.md, Event raids)"
"core.help.sv-raid-host.raid-content" = "a standard or a black (six-star) crystal"
