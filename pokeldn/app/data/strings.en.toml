"core.help.lgpe-host.withhold-announce" = "test only: skip the first N of our announcements to the console alone, as if lost, so the resend carries them"
"core.help.lgpe-join.ack-peer-clock" = "carry the peer's announcement clock in our acknowledgement on clone type 2 rather than the clock round-tripped from our own announcement, which is what a reference joiner carries"
"core.help.lgpe-join.ack-re-announce" = "answer a peer re-announcement with an acknowledgement carrying its clock rather than a second take-over. A reference joiner takes a clone over once and never again"
"core.help.lgpe-join.announce-after-burst" = "send the announcement of our own copy a tick after the take-over burst. Both stations of a session that works put all seven in one frame, which is the default here"
"core.help.lgpe-join.app-data" = "the host's advertise data as hex, or @FILE, instead of scanning for it. Needs --host-mac alongside"
"core.help.lgpe-join.capture" = "jsonl of every datagram seen while seated, hex, with its verdict"
"core.help.lgpe-join.clone-requests" = "answered clock requests of our own before the participate (measured 10)"
"core.help.lgpe-join.comm-id" = "local_communication_id to join, hex. Omit to join the only unknown one"
"core.help.lgpe-join.connect" = "send a version-9 station connection request to the host and classify the reply, retransmitting every 0.5 s the way Pia does. Without it, listen only"
"core.help.lgpe-join.connect-seconds" = "how long to retransmit the connection request and listen for its reply"
"core.help.lgpe-join.discover-timeout" = "how long to wait for the scan response and the sync"
"core.help.lgpe-join.fresh-pid" = "offer every --offer structure under a new PID and encryption constant, shiny state kept, so a save that took it before takes it again"
"core.help.lgpe-join.grace" = "seconds past --connect-seconds or --hold to keep a seat whose trade is half done: a trade left mid-way locks the console out of trading"
"core.help.lgpe-join.host-mac" = "the hosting station's MAC, as it appears in its own advertisement"
"core.help.lgpe-join.leave-after" = "leave the session the way a console backs out of its trade screen, this long after the first trade step we answered (docs/lgpe_session.md)"
"core.help.lgpe-join.nat-location" = "send nat flags 5 and nat location 1. A Let's Go joiner sends zero for both on local wireless"
"core.help.lgpe-join.no-clone" = "once in the mesh, do not run the clone clock exchange (requests every 0.2 s, replies with our ms clock, participate after ten answers: docs/lgpe_session.md). Default: run it"
"core.help.lgpe-join.no-rtt" = "once in the mesh, do not answer the host's RTT requests and send none of our own. Default: answer them and send one a second"
"core.help.lgpe-join.no-sync-clock" = "once in the mesh, do not run the Sync Clock Protocol (0x1c): a request every 2 s, the host's reply carrying the mesh clock in ms. Default: run it"
"core.help.lgpe-join.offer" = "answer the host's offers with a box structure of our own. 'echo' returns the host's own, which the game accepts by construction; a path is a 232-byte structure, encrypted or not. Repeatable, one per trade on the seat; trade N writes what it received to --received with -N. After the last, a further trade is not answered and the player backs out"
"core.help.lgpe-join.our-mac" = "the MAC we present; any value the host has not seen"
"core.help.lgpe-join.our-trainer" = "replace the trainer id pair in the first message. A payload captured between two emulators that share a save carries the host's own pair, which presents the joiner as the station it is trading with"
"core.help.lgpe-join.over-ip" = "reach the peer over plain UDP instead of the radio: no scan, no LDN association, the Pia socket straight at --host-ip:12345. For an emulated host under a debugger. Needs --app-data, --host-mac, --our-mac"
"core.help.lgpe-join.own-takeover-clock" = "stamp our own clock on the take-over instead of the clock the peer's announcement carried. The peer completes a take-over only when it matches the sequence it allocated, so the echo is the default"
"core.help.lgpe-join.passphrase" = "override, as ASCII"
"core.help.lgpe-join.peer-announce-dest" = "address our own clone announce to the peer alone. A real joiner addresses the first announce of a clone to the whole mesh (dest 0x0003), which is the default here"
"core.help.lgpe-join.player-name" = "the nickname the connection response carries, what the console shows as the partner (a real station sends its Switch profile's)"
"core.help.lgpe-join.print-packets" = "print every packet in and out; the --capture file keeps them either way"
"core.help.lgpe-join.public-address" = "put our own address in the station location's public field as well as its private one. A Let's Go joiner leaves the public field empty"
"core.help.lgpe-join.publish-delay" = "seconds after the take-over burst to publish our copy, with --publish-on-announce. Zero puts it in the burst's own frame"
"core.help.lgpe-join.publish-fallback" = "publish anyway this many seconds after the announce if the peer never published its own copy. Not a measured value"
"core.help.lgpe-join.publish-on-announce" = "publish our copy of a clone on clone type 2 as part of the announce burst. A real joiner waits for the peer to publish its own copy first, which is the default here"
"core.help.lgpe-join.publish-once" = "answer only the first of a peer's repeated publishes with a copy of our own and acknowledge the rest. Measured to stop the peer publishing at all, so the default answers each one"
"core.help.lgpe-join.received" = "write the peer's offered PB7 here"
"core.help.lgpe-join.reliable-interval" = "seconds between the payloads of --reliable-payload"
