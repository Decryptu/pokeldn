"core.help.swsh-join.send-protocol" = "应用数据协议：0x80 为广播可靠窗口（默认），0x7c 为单播可靠窗口。"
"core.help.swsh-join.send-seconds" = "没有确认时持续重传的时长；0 表示直到运行结束。"
"core.help.swsh-join.send-selection" = "打开选择阶段的时机：offer 在提议获确认后发送 40050 对；migration 在迁移开始后发送。"
"core.help.swsh-join.send-sequence" = "消息序列 ID，两个窗口均请求 1。首条消息还携带 FLAG_IS_INITIALIZED，定义流起点。"
"core.help.swsh-join.send-snapshot" = "收到对方快照后，在 0x84 发送此 3456 字节交换快照；live 使用当前会话游戏机快照。2965 字节短数据会先扩展；身份可由 --snapshot-name/-tid/-sid 重写。"
"core.help.swsh-join.send-stream" = "流 ID，游戏机在两个协议中均使用 0。"
"core.help.swsh-join.send-wait" = "发送前等待站点握手完成的最长秒数。"
"core.help.swsh-join.send-zlib" = "压缩消息，使用版本 4 的 Pia 0x10 标志，与游戏机的 0x80 消息行为一致。"
"core.help.swsh-join.send2-data" = "在 --send2-protocol 上发送第二条流，触发条件为 --send2-trigger；60ea000012020801 表示 BlockDataHolder 已就绪。"
"core.help.swsh-join.send2-trigger" = "等待 --send2-protocol 上此载荷后再发送；省略则网络建立后立即发送。"
"core.help.swsh-join.seq-delta" = "对照实验：确认游戏机未发送过的序列号。--seq-delta 1 时仍重播而 0 时停止，可证明确认内容产生了效果。"
"core.help.swsh-join.snapshot-account" = "替换快照资料开头的三个 ID：伪设备 ID、账户 Uid 及网络服务账户 ID；否则回传游戏机原值。"
"core.help.swsh-join.snapshot-period" = "本机片段之间的发送间隔。"
"core.help.swsh-join.snapshot-port" = "本机 0x84 消息使用的 Pia 端口，游戏机使用 0。"
"core.help.swsh-join.snapshot-repeat" = "整组数据重新发送的间隔；游戏机在确认前持续重传。"
"core.help.swsh-join.src-var" = "本机站点可变 ID，省略则生成随机值；复用可能被晶灿钻石／明亮珍珠识别为现有站点。"
"core.help.swsh-join.station-sweep" = "依次测试头部 0x05 位置的字节值，IV 源 ID 随之变化。"
"core.help.swsh-join.sync-after-hash" = "哈希回应后，在端口 0 的同步 holder N 发送 ping；120 为确认阶段同步。"
"core.help.swsh-join.sync-after-offer" = "启用 --selection-offer 时，在选择提议之后紧接着排队发送 holder N 的同步消息。"
"core.help.swsh-join.sync-answers" = "按 pokeldn.swsh.trade.SYNC_ANSWERS 回应同步 holder，而非简单回显；没有规则的载荷会报告并保持不回应。"
"core.help.swsh-join.sync-field" = "--sync-after-hash 发送的同步字段：1 为 ping，2 为 pingReply，3 为 pingSynced。"
"core.help.swsh-join.trade-ready" = "本机提议获确认后，在交换 holder（20030）上发送 imReady，尝试触发对方提议。"
"core.help.swsh-join.unicast" = "将数据单播给游戏机，而非广播。"
"core.help.swsh-join.update-mesh" = "迁移后本机成为主机时，广播主机索引改为本机的 UPDATE_MESH，维持网络。"
"core.help.swsh-join.update-mesh-period" = "网络更新的广播间隔；游戏机约每两秒发送一次。"
"core.help.swsh-lair-raid-host.accept-first" = "无需等待加入方同意即主动接受，模拟玩家操作；用于等待交换对象先同意的本机加入程序。"
"core.help.swsh-lair-raid-host.advert" = "可选的剑版广播数据：十六进制、原始数据或 swsh_net_facts.json；未指定则生成新的站点记录。"
"core.help.swsh-lair-raid-host.card-set" = "设置交换后游戏机可能保留的联盟卡字段，例如 name、trainer_id、dex_owned、poke1_species。"
"core.help.swsh-lair-raid-host.code" = "玩家搜索时使用的连接密码，例如 12345678；默认无密码。"
"core.help.swsh-lair-raid-host.end-delay" = "配合 --migrate，结束步骤推进至盒子命令 3 并迁移主机。"
"core.help.swsh-lair-raid-host.fresh-pid" = "为提供的宝可梦生成新的加密常量及 PID。"
"core.help.swsh-lair-raid-host.ip-host" = "通过局域网 ldn_mitm 为模拟器担任主机，无需开发板或管理员权限。"
"core.help.swsh-lair-raid-host.lair-leave" = "发送传说的宝可梦后等待指定秒数再离开；电脑搭档随后接替我方位置并选择租借宝可梦。"
"core.help.swsh-lair-raid-host.lair-legendary" = "主持极巨大冒险（极巨巢穴）大厅，终点的传说的宝可梦为指定种类；探险开始后主机离开（docs/swsh_raid.md）。"
"core.help.swsh-lair-raid-host.lair-seed" = "探险种子（ChikaBattleSeed），决定租借宝可梦及途中遭遇；默认随机生成。"
"core.help.swsh-lair-raid-host.lead" = "仅供 bin/swsh_connect.py 测试：模拟主机玩家，有下一个 --offer-file 时在流程结束后等待此秒数再从盒子主动交换。"
"core.help.swsh-lair-raid-host.migrate" = "使用盒子命令 3 及 MIGRATION_START 结束；默认主机保留会话。"
"core.help.swsh-lair-raid-host.network-id" = "覆盖广播 0x00 字段（十六进制）。剑版仅加入大于自身值的广播；默认 0xFFFF 加两个随机字节。"
"core.help.swsh-lair-raid-host.offer-file" = "放入交换队伍位置的 PK8 文件，支持加密或 PKHeX 导出格式。可重复指定，依次交换；最后一个用于后续交换。"
"core.help.swsh-lair-raid-host.offer-slot" = "要提供的队伍位置。"
"core.help.swsh-lair-raid-host.online" = "与远方玩家在线交换：双方分别转发各自游戏机提出的宝可梦，只有两台游戏机都确认后才发送确认。详见 docs/online.md。"
"core.help.swsh-lair-raid-host.online-code" = "双方输入的匹配房间密码；默认使用游戏内的连接密码，留空匹配未设置密码的在线玩家。"
"core.help.swsh-lair-raid-host.our-ip" = "--ip-host 模式下广播的地址。"
