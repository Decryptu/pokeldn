"core.help.sv-online.for-receiver" = "交换时按接收游戏机的存档重新生成以接收玩家为初训家的礼物；优先读取玩家在此存档捕获的宝可梦，其次读取会话中的训练家信息。无法识别时使用设置中的初训家。"
