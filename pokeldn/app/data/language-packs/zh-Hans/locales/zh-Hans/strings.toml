"core.help.rse-gift.flag-id" = "神奇卡片标志 ID，1000 至 1019。未指定时使用所选礼物的默认 ID。"
"core.help.rse-gift.flash-counter" = "规范扇区在 +0xFFC 写入的存档计数器。"
