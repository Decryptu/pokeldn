"core.help.rse-gift.id" = "十进制训练家 ID，可在后面附加十进制里 ID。"
"core.help.rse-gift.idle-timeout" = "连续没有有效 Switch 通信时停止的秒数，默认关闭。"
"core.help.rse-gift.inter-block-gap-frames" = "诊断：同一神秘礼物消息的数据块间空闲帧数；传输中途停滞时可增加，默认内置时序。"
"core.help.rse-gift.language" = "训练家语言，默认使用 DEFAULT_TRAINER。"
"core.help.rse-gift.local-config" = "可选的本机 TOML 配置，默认同目录的 host.local.toml。"
"core.help.rse-gift.news" = "要分发的神奇新闻，通过“神秘礼物 → 神奇新闻 → 朋友”接收。pokeldn 为连接验证新闻，可在华蓝市领取树果；berry 为十行滚动新闻。"
"core.help.rse-gift.news-id" = "覆盖新闻 ID，1 至 65535。游戏机仅保存与现有 ID 不同的新闻；增加此值可向同一游戏机重发相同文字。"
"core.help.rse-gift.no-accept-decrypted-ccmp" = "控制是否接受硬件已解密但仍保留 CCMP 头和 MIC 的接收帧，适用于 Archer T3U／rtw88_8822bu。"
"core.help.rse-gift.no-end-on-success" = "控制是否在发送成功并完成 RFU 关闭序列后结束，用于受监督的 run_mystery_gift.sh 主机。"
"core.help.rse-gift.no-live" = "为真实 Switch 担任主机。"
"core.help.rse-gift.no-local-config" = "不加载 host.local.toml。"
"core.help.rse-gift.no-make-artifact" = "控制是否为实际发送的神秘礼物字节生成带注释清单，默认关闭。"
"core.help.rse-gift.no-native-nonce-sequence" = "使用火红整个会话递增的 Pia nonce。"
"core.help.rse-gift.no-session-response-first" = "先发送 Session 类型 2 单播，再发送类型 5 广播。"
"core.help.rse-gift.no-skip-encryption" = "由 mac80211／硬件执行 CCMP 发送加密，无线帧仍保持加密。"
"core.help.rse-gift.no-trust-pia" = "控制 Pia 单次发送与 RFU 重传；--no-trust-pia 启用诊断用 RFU 重传。具体默认行为以当前工具为准。"
"core.help.rse-gift.ot" = "训练家名称，默认使用 DEFAULT_TRAINER。"
"core.help.rse-gift.over-ip" = "通过局域网为模拟器担任主机，使用 ldn_mitm 的 11452 端口发现和 UDP Pia 通信。填写广播地址或 auto；无需无线适配器、prod.keys 或管理员权限。"
"core.help.rse-gift.password" = "十六进制 LDN 口令，默认使用火红／叶绿模拟器的值。"
"core.help.rse-gift.phy" = "Wi-Fi 物理设备；明确指定 phyN 时会覆盖 --adapter。"
"core.help.rse-gift.print-effective-config" = "显示生效的主机配置（隐藏敏感信息），然后退出。"
"core.help.rse-gift.questionnaire" = "发送前要求游戏机商店问卷中保存指定的四词简易聊天短语。词可用英语词名、species:N、move:N、group/index 或原始 ID。普通词 ID 因语言而异，请先从目标游戏机读取；每次会话会记录四个 ID。"
"core.help.rse-gift.ram-script-block-repeat" = "仅对 ident-25 配送脚本设置片段重复次数，1 至 8，默认 3；游戏机不会回传礼物块，丢失的片段无法按请求重发。"
"core.help.rse-gift.ram-script-map-group" = "RAM 脚本绑定的地图组索引。默认玩家家中的妈妈；华蓝洞窟地下 1 层为组 1、地图 74，超梦为对象 3。"
"core.help.rse-gift.ram-script-map-num" = "RAM 脚本绑定的地图在组内的编号。"
"core.help.rse-gift.ram-script-object" = "地图对象的本地事件 ID，按 map.json 顺序从 1 开始。绑定会替换该对象的原脚本，请选择不移动的对象。"
"core.help.rse-gift.resident" = "要安装的常驻钩子，例如 turbo。"
"core.help.rse-gift.resident-param" = "常驻钩子的参数，例如 extra=6。"
"core.help.rse-gift.save-backup" = "将游戏机完整的 128 KB 存档复制到 FILE（.sav），不改变游戏机存档。"
"core.help.rse-gift.save-restore" = "将 .sav 文件写入游戏机，逐扇区读取校验后加载并保存；失败时保留旧存档。"
"core.help.rse-gift.save-resume-dir" = "配合 --save-backup 使用：在此保留中断的备份，下次从断点继续。"
"core.help.rse-gift.scan-blocks" = "每帧扫描的 32 字节块数，默认 512，约占 16 毫秒一帧中的 3 毫秒。"
"core.help.rse-gift.scan-end" = "内存扫描结束地址（不包含），默认 0x09000000，即 16 MB 卡带的末尾。"
"core.help.rse-gift.scan-max-calls" = "内存扫描的最大帧数。超时后会停止并回应，避免神秘礼物菜单卡住；默认所需帧数加二。"
