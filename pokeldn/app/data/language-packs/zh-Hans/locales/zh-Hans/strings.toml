"core.help.rse-gift.flash-words" = "扇区内要填充的字数量。"
"core.help.rse-gift.game-data-log" = "将游戏机卡片计数器、四词问卷及简易聊天对战资料追加至 JSONL；可用 tools/frlg/game_data_read.py 比较会话间的变化。"
"core.help.rse-gift.gather-address" = "string-gather 要跟随的指针数组的首地址，支持 0x 十六进制；返回连续排列的字符串本身。"
