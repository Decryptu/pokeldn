"core.help.pla-online.rtt-probe" = "额外发送 RTT 请求，对方无需会话状态即可回应。"
"core.help.pla-online.rtt-version" = "RTT 协议版本字节。"
"core.help.pla-online.seconds" = "保持网络开启的时长。"
"core.help.pla-online.session-update" = "响应后发送类型 5 站点列表更新；每站布局仍为研究中的暂定格式。"
"core.help.pla-online.ssid" = "16 字节十六进制 SSID；默认由 LDN 层选择。"
"core.help.pla-online.stay-after-leave" = "发送离开后保持网络开启但静默，不结束运行，用于区分离开消息与网络关闭的影响。"
"core.help.pla-online.sustain" = "加入后回显 RTT 并确认可靠流，避免游戏机在十二秒后超时离开。"
"core.help.pla-online.trade-box" = "在游戏通道提供本机宝可梦，用端口 0 序列 2 回应对方交换盒子。"
"core.help.pla-online.trade-box-collect" = "将对方显示或提供的所有不同记录保存到此目录，按种类及昵称命名。"
"core.help.pla-online.trade-box-experience" = "提供记录的经验值，应与 --trade-box-level 对应；游戏显示等级由经验曲线决定。"
"core.help.pla-online.trade-box-level" = "提供记录队伍尾部的等级字节。"
"core.help.pla-online.trade-box-nickname" = "提供记录的昵称。"
"core.help.pla-online.trade-box-ours" = "使用本机身份而非捕获身份提供记录，替换名称、ID 及标识，避免返还对方自身已有记录。"
"core.help.pla-online.trade-box-pid" = "提供记录的 PID（十六进制）。假设训练家 ID、里 ID 及 PID 两半异或小于 16 时为异色，此路径尚未验证。"
"core.help.pla-online.trade-box-record" = "替代参考记录的文件，支持盒子／队伍、加密／已解密格式。可重复指定，依次使用，最后一个用于后续交换。"
"core.help.rse-gift.adapter" = "--phy 为 auto 时使用的 Wi-Fi 适配器配置。"
"core.help.rse-gift.artifact-dir" = "--make-artifact 的输出目录，默认 artifacts。"
"core.help.rse-gift.attempt-log-dir" = "将已完成的连接尝试追加到此目录的每日 CSV 文件，默认关闭。"
"core.help.rse-gift.block-repeat" = "每个块片段重复发送次数，1 至 8，默认 2，用于应对静默丢包。"
"core.help.rse-gift.buffer-script" = "通过 CLI_RUN_BUFFER_SCRIPT 在游戏机运行原生 ARM 代码，替代礼物发送。支持存档／内存读取、存档写入、随机数追踪、内存／表扫描、ROM 校验、函数调用、宝可梦创建及常驻增强等脚本；按所选脚本配置下方参数。写入类操作须启用 --write-unsafe。"
"core.help.rse-gift.call-address" = "调用的 THUMB ROM 函数地址，最低位置 1，请与 --console-build 对应。法语版 SeedRng／Random 为 0x080486D1／0x080486B1，英语版为 0x08048691／0x08048671；0 表示不调用。"
"core.help.rse-gift.call-arg" = "函数调用的参数字，可重复指定，最多八个。前四个放入 r0 至 r3，其余放在栈上。"
"core.help.rse-gift.call-watch" = "函数调用前后各读取一次的地址，两次值都会返回。gRngValue：法语版 0x03004220，英语版 0x030042D0。"
"core.help.rse-gift.capture" = "将协议诊断记录保存为 JSONL 文件。"
"core.help.rse-gift.card-flag-id" = "联合房间交换训练家卡时声明的神奇卡片标志 ID。持有同 ID 卡片的游戏机会启用计数器，交换或竞技场对战将增加计数。默认 0，不启用计数。"
"core.help.rse-gift.chain-step" = "call-chain 的步骤，可重复指定，最多 16 步，在同一帧依次执行。call:NAME_OR_ADDR[,ARG]... 调用函数；read32|read16|read8:ADDR 读取；write32|write16|write8:ADDR,VALUE 写入并读回，须启用 --write-unsafe。prev 表示上一步结果，prev+N 表示其后 N 字节。"
"core.help.rse-gift.client-ready-idle-frames" = "诊断：LinkPlayer 待机后，首个神秘礼物消息前的空闲轮询帧数；默认内置时序。"
"core.help.rse-gift.comm-id" = "十六进制 LDN 本地通信 ID（local_communication_id）。"
"core.help.rse-gift.config" = "共享主机 TOML 配置，默认 config/host.toml。"
"core.help.rse-gift.console-build" = "选择生成代码使用的卡带地址。auto 根据游戏机报告的卡带代码自动选择对应语言和版本，不匹配的代码会被拒绝。"
"core.help.rse-gift.create-mon-append" = "将创建的宝可梦加入玩家队伍的第一个空位；队伍已满时不写入。修改真实存档且会保存，须启用 --write-unsafe。"
"core.help.rse-gift.create-mon-append-dry-run" = "模拟加入队伍：报告队伍数量、目标地址及该位置现有的 100 字节数据，不修改存档，无需启用写入覆盖。"
"core.help.rse-gift.create-mon-call" = "create-mon 的 THUMB CreateMon 函数地址。默认根据卡带版本选择（法语版 0x08041151，英语版 0x080411FD）；0 表示不调用。"
"core.help.rse-gift.create-mon-destination" = "将创建的 100 字节宝可梦复制到指定内存地址，须启用 --write-unsafe；未指定时不写入游戏机内存。"
"core.help.rse-gift.create-mon-iv" = "所有个体值设为此值，0 至 31；32 或更大则随机生成。"
"core.help.rse-gift.create-mon-level" = "创建宝可梦的等级，1 至 100。"
"core.help.rse-gift.create-mon-ot-id" = "--create-mon-ot-id-type 为 1 时使用的初训家 ID。"
"core.help.rse-gift.create-mon-ot-id-type" = "初训家 ID 来源：0 使用真实存档中的玩家 ID，1 使用 --create-mon-ot-id，2 随机生成直到非异色。"
"core.help.rse-gift.create-mon-personality" = "32 位 PID，决定性格、性别、特性位置及异色状态；省略时由游戏机 Random32 随机生成。"
"core.help.rse-gift.create-mon-species" = "创建宝可梦的种类 ID，1 至 411，使用第三世代内部编号而非全国图鉴编号。"
"core.help.rse-gift.denied-message" = "问卷短语不匹配时显示的消息，最多 63 字符，默认 That is not the phrase.。"
"core.help.rse-gift.dump-address" = "memory-dump 要读取的地址：0x02000000 为 EWRAM，0x03000000 为 IWRAM，0x08000000 为 ROM。支持 0x 十六进制。"
"core.help.rse-gift.dump-block" = "读取的存档块：sav2 包含名称、训练家 ID 和图鉴；sav1 包含队伍、背包、金钱、标志及变量。"
