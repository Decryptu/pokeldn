"core.help.sv-join.spawn" = "配合 --union-circle 使用：开场演出结束 10 秒后，在主机玩家周围 15 到 25 米处保持 3 只此种类的野生宝可梦（开发编号）。主机与其对战、移除或离开超过 50 米后，宝可梦会在附近重新生成。"
"core.help.sv-join.spawn-ability" = "特性位置，2 为隐藏特性；默认按野生宝可梦规则随机选择 0 或 1。"
