"core.help.pla-online.online" = "与远方玩家在线交换：双方分别转发各自游戏机提出的宝可梦，只有两台游戏机都确认后才发送确认。详见 docs/online.md。"
"core.help.pla-online.online-code" = "双方输入的匹配房间密码；默认使用游戏内的连接密码，留空匹配未设置密码的在线玩家。"
"core.help.pla-online.our-ip" = "--ip-host 的广播及监听地址。"
"core.help.pla-online.player-name" = "LDN 节点名称，真实游戏机在此公布用户资料名称。"
"core.help.pla-online.print-packets" = "打印收发的每个数据包；无论是否启用，--capture 文件都会记录这些数据包。"
"core.help.pla-online.reliable-bitmap" = "目标位图，wire[9] 大端字；须设置对方索引 1 的位，即 0x2，才能被游戏机接收。"
