"core.help.sv-join.spawn-item" = "携带道具 ID。"
"core.help.sv-join.spawn-ivs" = "六项个体值，范围为 0 到 31；默认按野生宝可梦规则分别随机生成。"
"core.help.sv-join.spawn-legal" = "配合 --spawn 使用：仅当主机位于 PKHeX 判定捕获合法的区域时生成。区域由主机游戏机共享的野生宝可梦推断；我方玩家靠近后才会共享，可配合 --follow-host 使用。"
"core.help.sv-join.spawn-nature" = "范围为 0 到 24，默认随机生成。"
"core.help.sv-join.spawn-scale" = "范围为 0 到 255，默认随机生成。"
"core.help.sv-join.spawn-tera" = "太晶属性，按属性顺序从 0（一般）到 17（妖精）；默认 %(default)s。"
"core.help.sv-join.stay-on-host-migration" = "收到 NetStartHostMigration（Net 0x40）后继续保持连接；默认第一次收到即离开，游戏机最多重发四秒。"
"core.help.sv-join.trade-offer" = "加入方提供的 348 字节记录文件，支持原始或十六进制，352 字节消息会剥离头部。可重复指定，依次回应提议、确认、提交并完成四步交换。"
