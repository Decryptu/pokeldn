"core.help.sv-online.raid-catch-normal" = "配合 --raid-event 使用：将仅限捕获一次的遭遇（所有七星团体战、波荡水、铁斑叶等）改为普通捕获，使用普通捕获规则及替代记录编号，让已捕获过的存档也能再次捕获；无法捕获的遭遇仍不可捕获。详见 docs/sv_raid.md。"
