"core.help.swsh-lair-raid-host.raid-boss" = "使用此首领主持极巨团体战大厅，替代连接交换（docs/swsh_raid.md）。"
"core.help.swsh-lair-raid-host.raid-console-serves" = "在 BattleStart 及框架对象 0 中将游戏机放在首位，使游戏机推进战斗，开发板作为客户端回应（docs/swsh_raid.md）。"
"core.help.swsh-lair-raid-host.raid-event" = "使用此旷野地带新闻分发的首领主持极巨团体战，替代 --raid-boss。指定 EventsGallery 的“Index NNN”目录；除非提供 --raid-reward，否则使用活动奖励（docs/swsh_raid.md，活动团体战）。"
