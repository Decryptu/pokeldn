"core.help.sv-join.seconds" = "持续尝试连接的时长。"
"core.help.sv-join.send-on-open" = "对方打开 0x7c 端口 1 的 key 0x80 后，按 DELAY:PROTO:PORT:HEX[:z][:start|:end] 发送消息；可重复指定，默认发送参考身份片段。"
