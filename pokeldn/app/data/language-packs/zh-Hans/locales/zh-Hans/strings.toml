"core.help.rse-gift.dump-offset" = "存档块内的字节偏移，支持 0x 十六进制。"
"core.help.rse-gift.dump-scatter" = "memory-dump-scatter 要依次读取的分散地址，每个地址读取一个块；支持 0x 十六进制。"
"core.help.rse-gift.dump-size" = "memory-dump 的读取字节数，1 至 1024。"
