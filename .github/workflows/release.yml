name: Release

# A tag v* builds the radio firmware and the desktop app for macOS, Windows and Linux, and publishes
# them as a GitHub release. Running it by hand builds the same files as workflow artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: esp32
            file: pokeldn-radio.bin
          - target: esp32s3
            file: pokeldn-radio-s3.bin
          - target: esp32c3
            file: pokeldn-radio-c3.bin
          - target: esp32c6
            file: pokeldn-radio-c6.bin
    steps:
      - uses: actions/checkout@v7
      - name: Build and merge the image
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware/esp32
          idf.py set-target ${{ matrix.target }}
          idf.py build
          idf.py merge-bin -o "$GITHUB_WORKSPACE/${{ matrix.file }}"
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.target }}
          path: ${{ matrix.file }}

  app:
    needs: firmware
    strategy:
      fail-fast: false
      matrix:
        include:
          # Flet's own CI builds its macOS client here; macos-14's rsync 2.6.9 fails Flutter's plugin copy.
          - os: macos-26
            asset: pokeldn-macos-arm64.zip
          - os: windows-latest
            asset: pokeldn-windows-x64.zip
          - os: ubuntu-22.04
            asset: pokeldn-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            gui/requirements.txt
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v8
        with:
          name: firmware-esp32
          path: gui/firmware
      - uses: actions/download-artifact@v8
        with:
          name: firmware-esp32s3
          path: gui/firmware
      - uses: actions/download-artifact@v8
        with:
          name: firmware-esp32c3
          path: gui/firmware
      - uses: actions/download-artifact@v8
        with:
          name: firmware-esp32c6
          path: gui/firmware
      - name: Install
        run: python -m pip install -r gui/requirements.txt
      # Both builds are pure functions of these inputs; a hit skips Flutter and CMake entirely.
      - name: Restore the Flet client
        id: client
        uses: actions/cache@v4
        with:
          path: |
            gui/client/*
            !gui/client/flet
          key: flet-client-${{ runner.os }}-${{ hashFiles('requirements.txt', 'gui/requirements.txt', 'gui/flet_client.py', 'scripts/build_client.py', 'gui/flet_drop/**') }}
      - name: Restore the ARM-only Unicorn
        id: unicorn
        uses: actions/cache@v4
        with:
          path: |
            gui/unicorn/lib
            gui/unicorn/pokeldn-unicorn
          key: unicorn-${{ runner.os }}-${{ hashFiles('requirements.txt', 'scripts/build_unicorn.py') }}
      # The app runs its own build of Flet's client, which takes files dropped on it (scripts/build_client.py).
      - name: Flutter version
        if: steps.client.outputs.cache-hit != 'true'
        id: flet
        shell: bash
        run: |
          python -m flet_cli.cli --version --json > flet.json
          echo "flutter=$(python -c "import json; print(json.load(open('flet.json'))['flutter'])")" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        if: steps.client.outputs.cache-hit != 'true'
        with:
          flutter-version: ${{ steps.flet.outputs.flutter }}
          channel: stable
          cache: true
      - name: Flutter's Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $(python -c "import json; print(' '.join(json.load(open('flet.json'))['linux_dependencies']))")
      - name: Build the Flet client
        if: steps.client.outputs.cache-hit != 'true'
        run: python scripts/build_client.py
      - name: Build the ARM-only Unicorn
        if: steps.unicorn.outputs.cache-hit != 'true'
        run: python scripts/build_unicorn.py
      - name: Pack
        run: python scripts/pack_app.py
      - name: Verify the frozen app (macOS)
        if: runner.os == 'macOS'
        run: python scripts/check_app.py dist/pokeldn.app/Contents/MacOS/pokeldn
      - name: Verify the frozen app (Linux)
        if: runner.os == 'Linux'
        run: python scripts/check_app.py dist/pokeldn/pokeldn
      - name: Verify the frozen app (Windows)
        if: runner.os == 'Windows'
        run: python scripts/check_app.py dist/pokeldn/pokeldn.exe
      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/pokeldn.app "${{ matrix.asset }}"
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/pokeldn -DestinationPath "${{ matrix.asset }}"
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.asset }}" -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  checksums:
    needs: app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Hash release assets
        working-directory: assets
        run: sha256sum pokeldn-* > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: assets/SHA256SUMS

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checksums
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Check the release notes name this tag
        run: test "$(head -n1 .github/release-notes.md)" = "# pokeldn ${GITHUB_REF_NAME#v}"
      - uses: softprops/action-gh-release@v3
        with:
          name: pokeldn ${{ github.ref_name }}
          files: assets/*
          body_path: .github/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
