name: Release

# A tag v* builds the radio firmware and the desktop app for macOS, Windows and Linux, and publishes
# them as a GitHub release. Running it by hand builds the same files as workflow artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: esp32
            file: pokeldn-radio.bin
          - target: esp32s3
            file: pokeldn-radio-s3.bin
          - target: esp32c3
            file: pokeldn-radio-c3.bin
    steps:
      - uses: actions/checkout@v7
      - name: Build and merge the image
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd firmware/esp32
          idf.py set-target ${{ matrix.target }}
          idf.py build
          idf.py merge-bin -o "$GITHUB_WORKSPACE/${{ matrix.file }}"
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.target }}
          path: ${{ matrix.file }}

  app:
    needs: firmware
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            asset: pokeldn-macos-arm64.zip
          - os: windows-latest
            asset: pokeldn-windows-x64.exe
          - os: ubuntu-22.04
            asset: pokeldn-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v8
        with:
          name: firmware-esp32
          path: gui/firmware
      - uses: actions/download-artifact@v8
        with:
          name: firmware-esp32s3
          path: gui/firmware
      - uses: actions/download-artifact@v8
        with:
          name: firmware-esp32c3
          path: gui/firmware
      - name: Install
        run: python -m pip install -r gui/requirements.txt
      - name: Pack
        run: python scripts/pack_app.py
      - name: Verify the frozen app (macOS and Linux)
        if: runner.os != 'Windows'
        run: python scripts/check_app.py dist/pokeldn
      - name: Verify the frozen app (Windows)
        if: runner.os == 'Windows'
        run: python scripts/check_app.py dist/pokeldn.exe
      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/pokeldn.app "${{ matrix.asset }}"
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item dist/pokeldn.exe "${{ matrix.asset }}"
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.asset }}" -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  checksums:
    needs: app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Hash release assets
        working-directory: assets
        run: sha256sum pokeldn-* > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: assets/SHA256SUMS

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checksums
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          body_path: .github/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
