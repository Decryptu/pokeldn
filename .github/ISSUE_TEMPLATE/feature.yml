name: Feature request
description: Ask for something the app does not do yet.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you want, and in which game or tool
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: I read the README's table of what each game supports.
          required: true
